<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Streamer PRO</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=Montserrat:wght@400;700&display=swap');
        
        body { background: #000; color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; overflow: hidden; height: 100vh; }

        /* ФОН КОМНАТЫ ИЗ ТВОЕГО ФАЙЛА */
        #room-bg {
            position: absolute; inset: 0;
            background-image: url('uploaded:1000122227.jpg-686ae5c8-004f-4147-ba7f-9d98257bcae1');
            background-size: cover;
            background-position: center;
            filter: brightness(0.6);
            z-index: 1;
        }

        /* ЛОГОТИП КАНАЛА */
        #channel-logo {
            position: absolute; top: 20px; left: 20px;
            width: 50px; height: 50px;
            background-image: url('uploaded:1000122084.png-5b19d047-9013-454e-8fb6-40c30781f53f');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 150;
            filter: drop-shadow(0 0 10px rgba(0,242,255,0.5));
        }

        /* ПЕРСОНАЖ */
        .stage {
            position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
            width: 300px; height: 550px; z-index: 20;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
        }

        .avatar-rig { animation: slowFloat 4s ease-in-out infinite; transform-origin: bottom center; }
        @keyframes slowFloat { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-15px) rotate(1deg); } }

        .head {
            width: 110px; height: 135px; background: #ffe4d5; border-radius: 55px 55px 65px 65px;
            position: relative; box-shadow: 0 5px 20px rgba(0,0,0,0.3); z-index: 10;
        }
        .hair {
            position: absolute; top: -15px; left: -10px; width: 130px; height: 110px;
            background: linear-gradient(180deg, #00f2ff, #7000ff); border-radius: 65px 65px 20px 20px;
        }
        .eyes { position: absolute; top: 65px; width: 100%; display: flex; justify-content: space-around; padding: 0 22px; }
        .eye { width: 22px; height: 22px; background: #fff; border-radius: 50%; position: relative; animation: blink 4s infinite; }
        .eye::after { content: ''; position: absolute; top: 6px; left: 6px; width: 10px; height: 10px; background: #111; border-radius: 50%; }
        @keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(0.1); } }

        .mouth {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 20px; height: 6px; background: #ff4081; border-radius: 10px; transition: 0.1s;
        }
        .talking .mouth { animation: speakMove 0.12s infinite alternate; }
        @keyframes speakMove { from { height: 4px; } to { height: 18px; border-radius: 40%; } }

        .torso { width: 150px; height: 180px; background: #151525; border-radius: 40px 40px 60px 60px; margin-top: -25px; border: 2px solid #333; position: relative; }

        /* ИНТЕРФЕЙС */
        .hud { position: absolute; inset: 0; z-index: 100; pointer-events: none; padding: 25px; display: flex; flex-direction: column; justify-content: space-between; }
        .glass { background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); border: 1px solid rgba(0,242,255,0.2); border-radius: 18px; pointer-events: auto; }
        
        #chat-window { max-height: 200px; overflow-y: auto; scroll-behavior: smooth; mask-image: linear-gradient(transparent, black 15%); }
        .chat-row { font-size: 11px; margin-bottom: 6px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        #gate { background: #000; z-index: 2000; cursor: pointer; }
    </style>
</head>
<body>

    <div id="gate" class="fixed inset-0 flex flex-col items-center justify-center" onclick="launch()">
        <div class="relative w-24 h-24 mb-6">
            <div class="absolute inset-0 border-4 border-cyan-500/20 rounded-full animate-ping"></div>
            <div class="absolute inset-0 border-2 border-cyan-500 rounded-full flex items-center justify-center text-cyan-500 font-black text-xs uppercase">Start</div>
        </div>
        <div class="text-[10px] tracking-[5px] text-white/30 uppercase">Вход в студию</div>
    </div>

    <div id="room-bg"></div>
    <div id="channel-logo"></div>

    <div class="stage" id="avatar-rig">
        <div class="avatar-rig">
            <div class="head">
                <div class="hair"></div>
                <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
                <div id="mouth" class="mouth"></div>
            </div>
            <div class="torso"></div>
        </div>
    </div>

    <div class="hud">
        <div class="flex justify-between items-start pointer-events-auto">
            <div class="flex flex-col gap-2">
                <div class="flex items-center gap-2">
                    <div class="bg-red-600 px-3 py-1 rounded text-[10px] font-black uppercase">Live</div>
                    <div class="glass px-3 py-1 text-[10px] font-bold text-cyan-400" id="timer">00:00:00</div>
                </div>
                <div class="text-[9px] font-bold text-white/40 uppercase">Зрители: <span id="viewers">2,419</span></div>
            </div>
            <div class="glass p-3 text-right">
                <div class="text-[8px] text-white/40 uppercase">Топ донат</div>
                <div class="text-[11px] font-black text-pink-500">USER_99: 500₽</div>
            </div>
        </div>

        <div class="flex flex-col gap-4">
            <div id="chat-window" class="glass p-4">
                <div class="chat-row text-white/30 italic">Подключение к чату...</div>
            </div>
            <div class="glass p-2 flex gap-2 pointer-events-auto">
                <input id="user-input" type="text" class="bg-transparent border-none outline-none flex-1 px-4 text-sm" placeholder="Напиши что-нибудь...">
                <button onclick="userAction()" class="bg-cyan-500 text-black px-8 py-3 rounded-xl font-black text-[10px] uppercase">Send</button>
            </div>
        </div>
    </div>

    <audio id="stream-music" loop src="https://stream.zeno.fm/0r0xa792kwzuv"></audio>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const mouth = document.getElementById('mouth');
        const music = document.getElementById('stream-music');
        let isSpeaking = false;
        let lastActivity = Date.now();

        // ФУНКЦИЯ ЗАПУСКА
        function launch() {
            try { vkBridge.send("VKWebAppInit"); } catch(e) {}
            document.getElementById('gate').style.display = 'none';
            music.play(); music.volume = 0.15;
            
            startTimer();
            addMsg("Система", "Эфир запущен. Привет, чат!", true);
            
            // Автономность: ИИ сам начинает говорить каждые 20 секунд
            setInterval(autoPilot, 20000);
            // Случайные события в чате
            setInterval(randomChatEvent, 15000);
        }

        function addMsg(user, text, isBot = false) {
            const row = document.createElement('div');
            row.className = 'chat-row';
            row.innerHTML = `<b class="${isBot ? 'text-cyan-400' : 'text-pink-500'} uppercase mr-1">${user}:</b> ${text}`;
            chatWindow.appendChild(row);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // БЕЗОПАСНЫЙ ВЫЗОВ ИИ С ОБРАБОТКОЙ ОШИБОК
        async function fetchAI(prompt, isAuto = false) {
            let retries = 0;
            const maxRetries = 3;
            const system = isAuto ? 
                "Ты - популярная ИИ-стримерша. Сейчас ты ведешь прямой эфир. Придумай короткую забавную фразу для зрителей (до 10 слов). Не спрашивай ничего, просто комментируй." : 
                "Ты - ИИ-стримерша. Ответь зрителю весело и коротко (до 10 слов).";

            while (retries < maxRetries) {
                try {
                    const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?system=${encodeURIComponent(system)}`);
                    if (!response.ok) throw new Error('Network error');
                    const text = await response.text();
                    return text;
                } catch (e) {
                    retries++;
                    await new Promise(r => setTimeout(r, retries * 1000));
                }
            }
            return "Ой, связь с сервером подводит... Ребят, вы тут?";
        }

        async function aiAction(text, isAuto = false) {
            if (isSpeaking) return;
            const reply = await fetchAI(text, isAuto);
            addMsg("ИИ_Тян", reply, true);
            speak(reply);
            lastActivity = Date.now();
        }

        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ru-RU';
            utter.pitch = 1.3;
            utter.onstart = () => { isSpeaking = true; document.getElementById('avatar-rig').classList.add('talking'); };
            utter.onend = () => { isSpeaking = false; document.getElementById('avatar-rig').classList.remove('talking'); };
            window.speechSynthesis.speak(utter);
        }

        function userAction() {
            const val = userInput.value.trim();
            if (!val || isSpeaking) return;
            userInput.value = '';
            addMsg("Ты", val);
            aiAction(val, false);
        }

        function autoPilot() {
            if (Date.now() - lastActivity > 15000 && !isSpeaking) {
                aiAction("Расскажи что-нибудь интересное зрителям", true);
            }
        }

        function randomChatEvent() {
            const names = ["Gamer88", "Neo", "MikuFan", "CyberShadow"];
            const actions = ["зашел на стрим", "подписался!", "отправил реакцию", "смотрит эфир"];
            const name = names[Math.floor(Math.random()*names.length)];
            const action = actions[Math.floor(Math.random()*actions.length)];
            
            addMsg("SYSTEM", `${name} ${action}`, false);
            
            // Если кто-то подписался, ИИ реагирует
            if(action.includes("подписался") && !isSpeaking) {
                setTimeout(() => speak(`Ой, ${name}, спасибо за подписку! Добро пожаловать!`), 1000);
            }
        }

        function startTimer() {
            let s = 0;
            setInterval(() => {
                s++;
                const m = Math.floor((s%3600)/60).toString().padStart(2,'0');
                const sec = (s%60).toString().padStart(2,'0');
                document.getElementById('timer').innerText = `00:${m}:${sec}`;
                
                // Имитация изменения кол-ва зрителей
                if(s % 5 === 0) {
                    const v = 2400 + Math.floor(Math.random()*50);
                    document.getElementById('viewers').innerText = v.toLocaleString();
                }
            }, 1000);
        }

        userInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') userAction(); });
    </script>
</body>
</html>
