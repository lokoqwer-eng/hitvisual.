<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HIT VISUAL | TURBO v7</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=JetBrains+Mono&display=swap');
        :root { --neon: #00f2ff; --bg: #05070a; --vh: 1vh; }
        html, body {
            height: 100vh; height: calc(var(--vh, 1vh) * 100);
            margin: 0; padding: 0; background: var(--bg);
            overflow: hidden; display: flex; flex-direction: column;
            color: #fff; font-family: 'Unbounded', sans-serif;
        }
        .sync { font-family: 'Unbounded', sans-serif; font-weight: 900; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        .viewport {
            flex: 1; margin: 10px; background: #000; border-radius: 24px;
            position: relative; overflow: hidden; border: 1px solid rgba(0, 242, 255, 0.2);
            display: flex; align-items: center; justify-content: center;
        }
        #main-img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.5s ease; opacity: 1; z-index: 10; }
        
        .loader-bar {
            position: absolute; top: 0; left: 0; height: 3px; width: 0%;
            background: var(--neon); box-shadow: 0 0 10px var(--neon);
            transition: width 0.3s; z-index: 100;
        }

        .host-cam {
            position: absolute; bottom: 12px; right: 12px; width: 65px; height: 85px;
            background: rgba(0,0,0,0.85); border: 1.5px solid var(--neon);
            border-radius: 12px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 30;
        }
        .v-bar { width: 3px; background: var(--neon); height: 2px; transition: height 0.1s; margin: 0 1px; }

        .control-panel {
            padding: 15px 20px calc(env(safe-area-inset-bottom) + 10px);
            background: #0d1117; border-radius: 25px 25px 0 0;
        }
        input {
            background: rgba(255,255,255,0.05) !important;
            border: 1px solid rgba(0, 242, 255, 0.3) !important;
            width: 100%; padding: 12px 15px; border-radius: 14px;
            outline: none; color: #fff !important; font-size: 16px !important;
            font-family: 'JetBrains Mono', monospace;
        }
        .btn-action {
            background: var(--neon); color: #000; padding: 12px 18px;
            border-radius: 14px; font-weight: 900; font-size: 10px;
            text-transform: uppercase;
        }
        #splash {
            position: fixed; inset: 0; background: #05070a;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000;
        }
    </style>
</head>
<body onclick="startApp()">

    <div id="splash">
        <div class="sync text-cyan-400 text-3xl mb-2 italic">HIT VISUAL</div>
        <div class="text-[8px] mono text-white/30 tracking-[4px] mb-8 uppercase">Turbo Stream Engine v7</div>
        <button class="px-12 py-4 bg-cyan-400 text-black sync text-[11px] rounded-2xl animate-pulse">ВОЙТИ В ЭФИР</button>
    </div>

    <div class="pt-8 pb-2 px-6 flex justify-between items-center">
        <div class="text-[11px] sync text-white flex items-center gap-2">
            <span class="w-2 h-2 bg-red-500 rounded-full animate-ping"></span> LIVE
        </div>
        <div id="top-viz" class="flex gap-1 items-end h-3"></div>
    </div>

    <div class="viewport">
        <div id="p-bar" class="loader-bar"></div>
        <img id="main-img" src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=1000&auto=format&fit=crop">
        
        <div class="host-cam">
            <div id="viz" class="flex items-end h-[22px]"></div>
        </div>
    </div>

    <div class="control-panel">
        <div id="chat-box" class="text-[10px] mono text-cyan-400/70 mb-3 h-4 overflow-hidden italic uppercase">
            > SYSTEM: STANDBY...
        </div>
        <div class="flex gap-2">
            <input type="text" id="m-prompt" placeholder="Опиши свой арт...">
            <button onclick="masterAction()" class="btn-action sync">ПУСК</button>
        </div>
    </div>

    <audio id="bg-audio" loop src="https://stream.nightride.fm/chillsynth.mp3"></audio>

<script>
    const vh = () => document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
    window.addEventListener('resize', vh); vh();
    vkBridge.send("VKWebAppInit");

    let started = false, isSpeaking = false, genCount = 0, isGenerating = false, autoTimer;
    const audio = document.getElementById('bg-audio');
    const mainImg = document.getElementById('main-img');
    const chat = document.getElementById('chat-box');
    const pBar = document.getElementById('p-bar');

    function makeBars(id, n) {
        const c = document.getElementById(id);
        for(let i=0; i<n; i++) {
            const b = document.createElement('div'); b.className = 'v-bar'; c.appendChild(b);
        }
    }
    makeBars('viz', 5); makeBars('top-viz', 4);

    setInterval(() => {
        const bars = document.getElementsByClassName('v-bar');
        for(let b of bars) b.style.height = (isSpeaking ? Math.random()*22 + 4 : 2) + 'px';
    }, 100);

    function startApp() {
        if(started) return;
        started = true;
        document.getElementById('splash').style.display = 'none';
        audio.volume = 0.3; audio.play().catch(()=>{});
        if(window.speechSynthesis) window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
        chat.innerText = "> SYSTEM: ONLINE / TURBO 512";
        nextSlide();
    }

    function aiTalk(txt) {
        chat.innerText = "> AI: " + txt.toUpperCase();
        if(!window.speechSynthesis) return;
        
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(txt);
        m.lang = 'ru-RU';
        
        let speechCheck = false;
        const fallback = setTimeout(() => {
            if(!speechCheck) chat.innerText = "> 📝 " + txt.toUpperCase();
        }, 1500);

        m.onstart = () => { 
            speechCheck = true; 
            clearTimeout(fallback);
            isSpeaking = true; 
            audio.volume = 0.05; 
        };
        m.onend = () => { isSpeaking = false; audio.volume = 0.3; };
        m.onerror = () => { 
            isSpeaking = false; 
            audio.volume = 0.3; 
            chat.innerText = "> 📝 " + txt.toUpperCase();
        };
        window.speechSynthesis.speak(m);
    }

    async function loadPhoto(prompt, isUser = false) {
        if(isGenerating && !isUser) return;
        isGenerating = true;
        
        clearTimeout(autoTimer);
        pBar.style.width = "20%";
        
        const seed = Math.floor(Math.random() * 999999);
        const suffix = isUser ? "" : " 4k cinematic neon cyberpunk art";
        // ✅ Ультра-скорость: model=turbo + enhance=false + 512x512
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt + suffix)}?seed=${seed}&width=512&height=512&nologo=true&model=turbo&enhance=false`;
        
        const imgTimeout = setTimeout(() => {
            if(isGenerating) {
                isGenerating = false;
                chat.innerText = "> AI: TIMEOUT / RETRYING...";
                nextSlide();
            }
        }, 15000); // 15 сек предел ожидания

        pBar.style.width = "60%";
        const temp = new Image();
        temp.src = url;
        
        temp.onload = () => {
            clearTimeout(imgTimeout);
            pBar.style.width = "100%";
            mainImg.style.opacity = 0;
            
            setTimeout(() => {
                mainImg.src = url;
                mainImg.style.opacity = 1;
                pBar.style.width = "0%";
                isGenerating = false;
                
                aiTalk(isUser ? "Ваш мастер-арт готов." : "Смена эфирного кадра завершена.");
                autoTimer = setTimeout(nextSlide, 15000);
            }, 300);
        };
        
        temp.onerror = () => {
            clearTimeout(imgTimeout);
            isGenerating = false;
            pBar.style.width = "0%";
            nextSlide();
        };
    }

    function nextSlide() {
        const t = ["cyberpunk aesthetics", "future synthwave", "neon digital city", "luxury android"][genCount % 4];
        genCount++;
        loadPhoto(t);
    }

    function masterAction() {
        const val = document.getElementById('m-prompt').value;
        if(!val) return;
        vkBridge.send("VKWebAppTapticNotificationOccurred", {"type": "success"});
        aiTalk("Перехват управления...");
        loadPhoto(val, true);
    }
</script>
</body>
</html>
