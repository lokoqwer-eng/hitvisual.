
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HIT VISUAL LUXURY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@300;400;800&display=swap');
        
        :root {
            --neon: #00f2ff;
            --purple: #bc13fe;
            --bg: #000000;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Футуристичный фон */
        .ambient-bg {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 10% 10%, rgba(0, 242, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(188, 19, 254, 0.03) 0%, transparent 50%);
            z-index: -1;
        }

        /* Контейнер для арта */
        .canvas-lux {
            flex: 1;
            margin: 20px 20px 10px;
            background: #050505;
            border-radius: 40px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 40px 80px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        #output-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #output-img.loaded {
            opacity: 1;
        }

        /* Глоу-эффект вокруг холста */
        .canvas-glow {
            position: absolute;
            inset: -1px;
            background: linear-gradient(135deg, var(--neon), transparent, var(--purple));
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }

        /* Док-панель */
        .ui-dock {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            padding: 30px 25px calc(40px + env(safe-area-inset-bottom));
            border-radius: 50px 50px 0 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 -20px 50px rgba(0,0,0,0.5);
        }

        .input-pill {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            padding: 20px 25px;
            margin-bottom: 25px;
            transition: all 0.4s ease;
        }

        .input-pill:focus-within {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--neon);
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.1);
        }

        .input-pill input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        /* Кнопка */
        .btn-lux {
            width: 100%;
            background: #fff;
            color: #000;
            padding: 22px;
            border-radius: 25px;
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 15px 35px rgba(255, 255, 255, 0.15);
        }

        .btn-lux:active {
            transform: scale(0.97);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
        }

        .btn-lux:disabled {
            background: #222;
            color: #555;
            box-shadow: none;
        }

        /* Спиннер */
        .loader {
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 2px solid rgba(0, 242, 255, 0.1);
            border-top: 2px solid var(--neon);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            filter: drop-shadow(0 0 10px var(--neon));
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .status-msg {
            margin-top: 20px;
            font-family: 'Syncopate', sans-serif;
            font-size: 8px;
            letter-spacing: 4px;
            color: var(--neon);
            text-shadow: 0 0 10px var(--neon);
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <div class="pt-12 pb-2 text-center">
        <h1 class="font-['Syncopate'] text-[9px] tracking-[1.2em] text-[#fff] opacity-30">HIT VISUAL LUXURY</h1>
    </div>

    <div class="canvas-lux" id="canvas">
        <div class="canvas-glow"></div>
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <div class="status-msg">RENDERING ART</div>
        </div>
        <div id="idle-text" class="font-['Syncopate'] text-[10px] tracking-[0.5em] opacity-10">Waiting for prompt</div>
        <img id="output-img" src="" alt="Masterpiece">
    </div>

    <div class="ui-dock">
        <div class="input-pill">
            <input type="text" id="prompt-input" placeholder="ОПИШИТЕ ВАШ ЗАМЫСЕЛ..." autocomplete="off">
        </div>
        <button id="gen-btn" onclick="generate()" class="btn-lux">ГЕНЕРИРОВАТЬ</button>
    </div>

    <script>
        function generate() {
            const prompt = document.getElementById('prompt-input').value;
            if (!prompt) return;

            const loader = document.getElementById('loader');
            const idleText = document.getElementById('idle-text');
            const img = document.getElementById('output-img');
            const btn = document.getElementById('gen-btn');

            // Состояние загрузки
            loader.style.display = 'flex';
            idleText.style.display = 'none';
            img.classList.remove('loaded');
            btn.disabled = true;
            btn.innerText = "ГЕНЕРАЦИЯ...";

            // Используем Pollinations API - это стабильно работает в браузере без ключей и CORS
            const seed = Math.floor(Math.random() * 1000000);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed}&width=1024&height=1024&nologo=true&enhance=true`;

            // Предзагрузка изображения
            const tempImg = new Image();
            tempImg.src = imageUrl;
            
            tempImg.onload = () => {
                img.src = imageUrl;
                img.classList.add('loaded');
                loader.style.display = 'none';
                btn.disabled = false;
                btn.innerText = "ГЕНЕРИРОВАТЬ";
            };

            tempImg.onerror = () => {
                loader.style.display = 'none';
                idleText.style.display = 'block';
                idleText.innerText = "ERROR - TRY AGAIN";
                idleText.style.color = "#ff3333";
                btn.disabled = false;
                btn.innerText = "ГЕНЕРИРОВАТЬ";
            };
        }
    </script>
</body>
</html>
