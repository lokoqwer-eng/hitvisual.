<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Neuro Streamer LIVE</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        
        :root { --accent: #00f2ff; --pink: #ff007a; }
        body { background: #000; color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; overflow: hidden; height: 100vh; }

        /* ФОН СТРИМА */
        #stream-bg {
            position: absolute; inset: 0;
            background-image: url('uploaded:1000122234.jpg-3529631c-9ef6-4e52-86fe-a664e144a809');
            background-size: cover; background-position: center;
            filter: brightness(0.5); z-index: 1;
        }

        /* МОДЕЛЬ ПЕРСОНАЖА */
        .vtuber-stage {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px; height: 90%;
            display: flex; align-items: flex-end; justify-content: center;
            z-index: 10; pointer-events: none;
        }

        #vtuber-img {
            height: 100%; object-fit: contain;
            animation: breathe 4s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(0,242,255,0.2));
        }

        @keyframes breathe {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
        }

        /* АНИМАЦИЯ РТА */
        #mouth-sync {
            position: absolute; bottom: 58%; left: 50.3%; transform: translateX(-50%);
            width: 32px; height: 8px; background: #ff007a;
            border-radius: 50%; z-index: 15; display: none;
            box-shadow: 0 0 15px #ff007a;
        }
        .speaking #mouth-sync { display: block; animation: flap 0.1s infinite alternate; }
        @keyframes flap { from { height: 2px; } to { height: 18px; } }

        /* ИНТЕРФЕЙС */
        .hud { position: absolute; inset: 0; z-index: 100; padding: 20px; pointer-events: none; display: flex; flex-direction: column; }
        .glass { background: rgba(0,0,0,0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; pointer-events: auto; }

        #stream-chat {
            position: absolute; top: 100px; right: 20px; width: 260px;
            max-height: 300px; overflow-y: auto; display: flex;
            flex-direction: column; gap: 8px; scrollbar-width: none;
        }

        .chat-msg {
            font-size: 11px; padding: 10px; border-radius: 12px;
            background: rgba(0,0,0,0.4); border-left: 3px solid var(--accent);
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* АНИМАЦИИ */
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 8s linear infinite; }

        #start-overlay {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="start-overlay" onclick="goLive()">
        <div class="w-24 h-24 border-4 border-cyan-500 rounded-full flex items-center justify-center animate-pulse mb-6">
            <div class="w-4 h-4 bg-cyan-500 rounded-sm"></div>
        </div>
        <p class="text-white/40 text-[10px] uppercase tracking-[8px]">Выйти в прямой эфир</p>
    </div>

    <div id="stream-bg"></div>

    <div class="vtuber-stage" id="character">
        <img id="vtuber-img" src="uploaded:1000122090.png-d8b4a516-b9d0-4c43-81fa-f7fdd3c383e3" 
             onerror="this.src='https://images.unsplash.com/photo-1578632767115-351597cf2477?w=600&h=900&fit=crop'">
        <div id="mouth-sync"></div>
    </div>

    <div class="hud">
        <div class="flex justify-between items-start pointer-events-auto">
            <div class="flex flex-col gap-2">
                <div class="flex items-center gap-2">
                    <div class="bg-red-600 px-3 py-1 rounded text-[10px] font-black uppercase">Live</div>
                    <div class="glass px-3 py-1 text-[11px] font-bold" id="uptime">00:00:00</div>
                </div>
                <div class="text-[10px] text-cyan-400 font-bold uppercase tracking-widest" id="status-text">Система в норме</div>
            </div>
            <div class="glass p-3 text-right min-w-[100px]">
                <div class="text-[8px] text-white/40 uppercase">Зрители</div>
                <div class="text-lg font-black text-white" id="viewer-count">8,102</div>
            </div>
        </div>

        <div id="stream-chat" class="pointer-events-none"></div>

        <div class="mt-auto flex flex-col gap-4 pointer-events-auto">
            <div class="glass p-4 flex items-center gap-4">
                <div class="w-10 h-10 bg-cyan-500/20 rounded-full flex items-center justify-center animate-spin-slow">
                    <svg class="w-5 h-5 text-cyan-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                </div>
                <div class="flex-1 overflow-hidden">
                    <div class="text-[8px] text-white/30 uppercase font-bold">Now Playing</div>
                    <div class="text-[11px] font-bold truncate" id="radio-info">Lo-Fi Cyberpunk Beats</div>
                </div>
                <button onclick="changeMusic()" class="p-2 hover:bg-white/10 rounded-lg">
                    <svg class="w-6 h-6" fill="white" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
            <div class="flex gap-2">
                <input id="user-input" type="text" class="glass flex-1 bg-transparent border-none outline-none px-6 py-4 text-sm text-white" placeholder="Напиши своей Тян...">
                <button onclick="userChat()" class="bg-cyan-500 text-black px-8 py-4 rounded-2xl font-black text-[11px] uppercase shadow-[0_0_20px_rgba(0,242,255,0.4)]">Send</button>
            </div>
        </div>
    </div>

    <audio id="bg-music" loop crossorigin="anonymous"></audio>

    <script>
        const chat = document.getElementById('stream-chat');
        const input = document.getElementById('user-input');
        const audio = document.getElementById('bg-music');
        const character = document.getElementById('character');
        
        let isSpeaking = false;
        let lastAction = Date.now();
        const radios = ["https://stream.zeno.fm/0r0xa792kwzuv", "https://stream.zeno.fm/f9scrt81638uv"];
        let rIdx = 0;

        async function goLive() {
            document.getElementById('start-overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('start-overlay').style.display = 'none', 500);
            
            // Разблокировка синтеза речи (обязательно для мобилок)
            if (window.speechSynthesis) {
                const s = new SpeechSynthesisUtterance("");
                window.speechSynthesis.speak(s);
            }

            // Инициализация ВК
            if (window.vkBridge) {
                try {
                    await vkBridge.send("VKWebAppInit");
                    vkBridge.send("VKWebAppTapticNotificationOccurred", {type: "success"}).catch(()=>{});
                } catch(e) { console.log("VK Bridge Error"); }
            }
            
            changeMusic(0);
            startTimer();
            addMsg("System", "Эфир запущен! Мы в сети, ребята!", "text-cyan-400");
            
            // Бесконечные циклы
            setInterval(autoThinking, 15000); 
            setInterval(fakeChatter, 8000);
        }

        function changeMusic(idx = -1) {
            rIdx = idx === -1 ? (rIdx + 1) % radios.length : idx;
            audio.src = radios[rIdx];
            audio.play().catch(e => addMsg("System", "Нажми на экран для музыки", "text-yellow-400"));
            audio.volume = 0.2;
            document.getElementById('radio-info').innerText = `Cyber Radio #${rIdx + 1}`;
        }

        function addMsg(user, text, color = "text-white/80") {
            const div = document.createElement('div');
            div.className = 'chat-msg';
            div.innerHTML = `<b class="${color} mr-2">${user}:</b> ${text}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            if(chat.children.length > 10) chat.removeChild(chat.firstChild);
        }

        async function talkToAI(prompt, isAuto = false) {
            if(isSpeaking && !isAuto) return;
            
            const sys = "Ты - милая стримерша Тян. Твой стиль: живая, энергичная, любишь своих зрителей. Отвечай ОЧЕНЬ коротко (до 10 слов), по-русски. Если это авто-реплика, начни новую тему, расскажи что делаешь или поблагодари за донаты.";
            
            try {
                // ИСПОЛЬЗУЕМ БЕСПЛАТНЫЙ POLLINATIONS API
                const url = `https://text.pollinations.ai/${encodeURIComponent(prompt)}?system=${encodeURIComponent(sys)}&seed=${Math.random()}`;
                const res = await fetch(url);
                const reply = await res.text();
                
                addMsg("Тян ✨", reply, "text-pink-400 font-bold text-[13px]");
                speak(reply);
                lastAction = Date.now();
            } catch(e) {
                console.error("AI Error");
                if(!isAuto) addMsg("Тян ✨", "Ой, связь прервалась! Но я всё равно вас люблю!", "text-pink-400");
            }
        }

        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ru-RU';
            utter.pitch = 1.4;
            utter.rate = 1.1;
            utter.onstart = () => { isSpeaking = true; character.classList.add('speaking'); };
            utter.onend = () => { isSpeaking = false; character.classList.remove('speaking'); };
            window.speechSynthesis.speak(utter);
        }

        function userChat() {
            const v = input.value.trim();
            if(!v) return;
            input.value = "";
            addMsg("Ты", v, "text-cyan-400 font-bold");
            talkToAI(v);
        }

        function autoThinking() {
            if(!isSpeaking && (Date.now() - lastAction > 15000)) {
                talkToAI("Расскажи короткую историю или прокомментируй стрим как живая стримерша", true);
            }
        }

        function fakeChatter() {
            const names = ["Dota_King", "Loli_Pops", "Vova_Zero", "Cyber_Kat"];
            const msgs = ["Кайфовый трек!", "Тян, ты лучшая", "Лол, жиза", "Всем привет!", "Ставлю лайк!", "+++", "Вау!"];
            if(Math.random() > 0.5) addMsg(names[Math.floor(Math.random()*names.length)], msgs[Math.floor(Math.random()*msgs.length)]);
        }

        function startTimer() {
            let s = 0;
            setInterval(() => {
                s++;
                const h = Math.floor(s/3600).toString().padStart(2,'0');
                const m = Math.floor((s%3600)/60).toString().padStart(2,'0');
                const sc = (s%60).toString().padStart(2,'0');
                document.getElementById('uptime').innerText = `${h}:${m}:${sc}`;
                
                if(s % 3 === 0) {
                    const vc = 8100 + Math.floor(Math.random()*200);
                    document.getElementById('viewer-count').innerText = vc.toLocaleString();
                }
            }, 1000);
        }

        input.addEventListener('keypress', (e) => { if(e.key === 'Enter') userChat(); });
    </script>
</body>
</html>
