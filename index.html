
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <title>HIT VISUAL LUXURY ULTIMATE</title>
    
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Montserrat:wght@400;600;700&display=swap');
        
        :root {
            --neon: #00e5ff;
            --pink: #ff007b;
            --bg: #ffffff;
            --text: #0f172a;
            --card: rgba(255, 255, 255, 0.98);
        }

        body.dark {
            --bg: #0f172a;
            --text: #f8fafc;
            --card: rgba(15, 23, 42, 0.98);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        .sync { font-family: 'Syncopate', sans-serif; }

        /* Анимированный заголовок */
        .glow-title {
            font-size: 10px;
            letter-spacing: 0.5em;
            background: linear-gradient(90deg, var(--neon), var(--pink), #7000ff, var(--neon));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow 4s linear infinite;
        }
        @keyframes rainbow { to { background-position: 200% center; } }

        /* Холст */
        .art-viewport {
            flex: 1;
            margin: 12px;
            background: #000;
            border-radius: 28px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #main-img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: none;
            transition: filter 0.3s ease;
        }

        .art-viewport.fs {
            position: fixed; inset: 0; margin: 0; z-index: 100; border-radius: 0;
        }
        .art-viewport.fs #main-img { object-fit: contain; }

        /* Панель управления */
        .ui-panel {
            background: var(--card);
            backdrop-filter: blur(20px);
            padding: 15px 15px calc(20px + env(safe-area-inset-bottom));
            border-radius: 32px 32px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
            z-index: 50;
        }

        .chip {
            padding: 8px 14px;
            background: rgba(0,0,0,0.05);
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
            transition: 0.2s;
        }
        body.dark .chip { background: rgba(255,255,255,0.1); }
        .chip.active { background: var(--text); color: var(--bg); }

        .btn {
            width: 100%; padding: 16px; border-radius: 18px;
            font-family: 'Syncopate', sans-serif; font-size: 10px;
            font-weight: 700; transition: 0.3s;
        }
        .btn-primary { background: var(--text); color: var(--bg); }
        
        /* История */
        .history-scroll {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px;
            scrollbar-width: none;
        }
        .history-scroll::-webkit-scrollbar { display: none; }
        .history-thumb {
            width: 54px; height: 54px; border-radius: 12px; flex-shrink: 0;
            object-fit: cover; border: 2px solid transparent; cursor: pointer;
        }
        .history-thumb:active { transform: scale(0.9); }

        /* Ачивка */
        #achievement {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: var(--text); color: var(--bg);
            padding: 12px 24px; border-radius: 50px; font-size: 12px;
            font-weight: 700; z-index: 200; transition: top 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        /* Редактор */
        #editor {
            position: fixed; inset: 0; background: #000; z-index: 150;
            display: none; flex-direction: column; padding: 20px;
        }

        @media screen and (max-height: 700px) {
            .art-viewport { margin: 8px; }
            .btn { padding: 14px; }
        }
    </style>
</head>
<body class="dark">

    <div id="achievement" class="sync">🏆 ДОСТИЖЕНИЕ ПОЛУЧЕНО!</div>

    <!-- Шапка -->
    <div class="pt-10 pb-2 px-6 flex justify-between items-center">
        <div class="glow-title sync uppercase">HIT VISUAL LUXURY</div>
        <button onclick="toggleTheme()" id="theme-btn" class="text-xl">☀️</button>
    </div>

    <!-- Экран арта -->
    <div class="art-viewport" id="viewport" onclick="toggleFS()">
        <div id="loader" class="hidden flex-col items-center">
            <div class="w-12 h-12 border-4 border-cyan-500/20 border-t-cyan-500 rounded-full animate-spin"></div>
            <div class="mt-4 text-[8px] tracking-[4px] text-white/40 font-bold sync">RENDERING...</div>
        </div>
        <div id="idle" class="sync opacity-20 text-[9px] tracking-widest text-white text-center px-10">
            ОПИШИТЕ ИДЕЮ
        </div>
        <img id="main-img" src="" alt="AI Art">
    </div>

    <!-- Интерфейс -->
    <div class="ui-panel">
        <!-- Категории -->
        <div class="flex gap-2 overflow-x-auto mb-4 no-scrollbar">
            <button onclick="loadTemplate('cyber')" class="chip">🌃 КИБЕРПАНК</button>
            <button onclick="loadTemplate('fantasy')" class="chip">🐉 ФЭНТЕЗИ</button>
            <button onclick="loadTemplate('photo')" class="chip">📸 ПОРТРЕТ</button>
            <button onclick="loadTemplate('anime')" class="chip">🌸 АНИМЕ</button>
        </div>

        <!-- Ввод -->
        <div class="space-y-3 mb-4">
            <div class="bg-black/5 dark:bg-white/5 rounded-2xl p-4 border border-black/10 dark:border-white/10">
                <input type="text" id="prompt-in" class="w-full bg-transparent outline-none text-[15px]" placeholder="Что нарисовать?">
            </div>
            <div class="bg-red-500/5 rounded-xl p-3 border border-red-500/20">
                <input type="text" id="negative-in" class="w-full bg-transparent outline-none text-[12px] text-red-400" placeholder="❌ Исключить (размытие, текст...)">
            </div>
        </div>

        <!-- Соотношение сторон -->
        <div class="flex gap-2 mb-4">
            <button onclick="setRatio('1:1', this)" class="chip ratio-btn active">1:1</button>
            <button onclick="setRatio('9:16', this)" class="chip ratio-btn">9:16</button>
            <button onclick="setRatio('16:9', this)" class="chip ratio-btn">16:9</button>
        </div>

        <!-- История -->
        <div class="history-scroll" id="history-box"></div>

        <!-- Основные кнопки -->
        <div class="grid grid-cols-2 gap-3">
            <button id="gen-btn" onclick="generate()" class="btn btn-primary">СОЗДАТЬ</button>
            <div class="flex gap-2">
                <button id="upscale-btn" onclick="generate(true)" class="btn bg-cyan-500/10 text-cyan-500 border border-cyan-500/20 hidden">2X</button>
                <button id="edit-btn" onclick="openEditor()" class="btn bg-purple-500/10 text-purple-500 border border-purple-500/20 hidden">EDIT</button>
            </div>
        </div>
        <button id="save-btn" onclick="downloadArt()" class="btn border border-black/10 dark:border-white/10 mt-3 hidden uppercase">СОХРАНИТЬ</button>
    </div>

    <!-- Редактор фильтров -->
    <div id="editor">
        <div class="flex justify-between items-center mb-6">
            <h2 class="sync text-white text-[10px]">PHOTO EDITOR</h2>
            <button onclick="closeEditor()" class="text-white text-2xl">✕</button>
        </div>
        <div class="flex-1 flex items-center justify-center overflow-hidden rounded-2xl bg-white/5">
            <canvas id="edit-canvas" class="max-w-full max-h-full object-contain"></canvas>
        </div>
        <div class="mt-6 grid grid-cols-4 gap-2">
            <button onclick="applyFilter('none')" class="chip text-white bg-white/10">ORIGIN</button>
            <button onclick="applyFilter('grayscale(100%)')" class="chip text-white bg-white/10">B&W</button>
            <button onclick="applyFilter('sepia(80%)')" class="chip text-white bg-white/10">SEPIA</button>
            <button onclick="applyFilter('saturate(180%) contrast(110%)')" class="chip text-white bg-white/10">VIVID</button>
        </div>
        <button onclick="saveEdited()" class="btn btn-primary mt-6">СКАЧАТЬ ОТРЕДАКТИРОВАННОЕ</button>
    </div>

    <script>
        vkBridge.send("VKWebAppInit");

        // Глобальные переменные
        const img = document.getElementById('main-img');
        const promptIn = document.getElementById('prompt-in');
        const negIn = document.getElementById('negative-in');
        const historyBox = document.getElementById('history-box');
        const viewport = document.getElementById('viewport');
        const genBtn = document.getElementById('gen-btn');
        
        let stats = JSON.parse(localStorage.getItem('hit_stats')) || { generated: 0 };
        let history = JSON.parse(localStorage.getItem('hit_history')) || [];
        let curW = 1024, curH = 1024;

        // Инициализация темы
        if(localStorage.getItem('theme') === 'light') toggleTheme();

        function toggleTheme() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            document.getElementById('theme-btn').innerText = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function setRatio(r, btn) {
            document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            viewport.style.height = 'auto';
            if(r === '1:1') { curW=1024; curH=1024; viewport.style.aspectRatio = "1/1"; }
            if(r === '9:16') { curW=768; curH=1344; viewport.style.aspectRatio = "9/16"; }
            if(r === '16:9') { curW=1216; curH=688; viewport.style.aspectRatio = "16/9"; }
            setTimeout(() => { viewport.style.height = ''; }, 100);
        }

        function loadTemplate(type) {
            const temps = {
                cyber: "киберпанк город, неоновое освещение, футуристические детали, 8k",
                fantasy: "фэнтези пейзаж, магические существа, эпическое небо, высокая детализация",
                photo: "портрет, студийный свет, реализм, четкие глаза, кинематографично",
                anime: "аниме стиль, яркие цвета, динамичная композиция, качественная рисовка"
            };
            promptIn.value = temps[type];
            promptIn.focus();
        }

        async function generate(isUpscale = false) {
            const p = promptIn.value;
            const n = negIn.value;
            if(!p) return;

            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('idle').classList.add('hidden');
            img.style.display = 'none';
            genBtn.disabled = true;

            const seed = Math.floor(Math.random()*9999999);
            const w = isUpscale ? curW * 1.5 : curW;
            const h = isUpscale ? curH * 1.5 : curH;
            
            // Сборка финального промпта
            const finalPrompt = n ? `${p} --no ${n}` : p;
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(finalPrompt)}?seed=${seed}&width=${Math.round(w)}&height=${Math.round(h)}&nologo=true&model=flux&enhance=true`;

            const t = new Image();
            t.crossOrigin = "anonymous";
            t.src = url;

            t.onload = () => {
                img.src = url;
                img.style.display = 'block';
                document.getElementById('loader').classList.add('hidden');
                genBtn.disabled = false;
                
                // Показываем доп. кнопки
                document.getElementById('upscale-btn').classList.remove('hidden');
                document.getElementById('edit-btn').classList.remove('hidden');
                document.getElementById('save-btn').classList.remove('hidden');

                addToHistory(url);
                updateStats();
                vkBridge.send("VKWebAppTapticNotificationOccurred", {"type": "success"});
            };
        }

        function addToHistory(url) {
            if(history.includes(url)) return;
            history.unshift(url);
            if(history.length > 10) history.pop();
            localStorage.setItem('hit_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            historyBox.innerHTML = history.map(url => `
                <img src="${url}" class="history-thumb" onclick="loadFromHistory('${url}')">
            `).join('');
        }

        function loadFromHistory(url) {
            img.src = '';
            document.getElementById('loader').classList.remove('hidden');
            setTimeout(() => {
                img.src = url;
                img.style.display = 'block';
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('idle').classList.add('hidden');
                document.getElementById('save-btn').classList.remove('hidden');
                document.getElementById('edit-btn').classList.remove('hidden');
            }, 50);
        }

        async function downloadArt() {
            const btn = document.getElementById('save-btn');
            btn.innerText = "ЗАГРУЗКА...";
            try {
                const response = await fetch(img.src);
                const blob = await response.blob();
                const bUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = bUrl;
                a.download = `hit_art_${Date.now()}.jpg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                vkBridge.send("VKWebAppTapticNotificationOccurred", {"type": "success"});
            } catch (e) {
                vkBridge.send("VKWebAppShowImages", { images: [img.src] });
            } finally {
                btn.innerText = "СОХРАНИТЬ";
            }
        }

        // РЕДАКТОР
        function openEditor() {
            const editor = document.getElementById('editor');
            const canvas = document.getElementById('edit-canvas');
            const ctx = canvas.getContext('2d');
            editor.style.display = 'flex';
            
            const temp = new Image();
            temp.crossOrigin = "anonymous";
            temp.src = img.src;
            temp.onload = () => {
                canvas.width = temp.width;
                canvas.height = temp.height;
                ctx.drawImage(temp, 0, 0);
            };
        }

        function applyFilter(f) {
            const canvas = document.getElementById('edit-canvas');
            const ctx = canvas.getContext('2d');
            const temp = new Image();
            temp.crossOrigin = "anonymous";
            temp.src = img.src;
            temp.onload = () => {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                ctx.filter = f;
                ctx.drawImage(temp, 0, 0);
            };
        }

        function saveEdited() {
            const canvas = document.getElementById('edit-canvas');
            const link = document.createElement('a');
            link.download = 'edited_art.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        }

        function closeEditor() { document.getElementById('editor').style.display = 'none'; }

        function updateStats() {
            stats.generated++;
            localStorage.setItem('hit_stats', JSON.stringify(stats));
            if(stats.generated === 5) showAchievement("НОВИЧОК: 5 АРТОВ!");
            if(stats.generated === 25) showAchievement("МАСТЕР: 25 АРТОВ!");
        }

        function showAchievement(txt) {
            const el = document.getElementById('achievement');
            el.innerText = `🏆 ${txt}`;
            el.style.top = '20px';
            vkBridge.send("VKWebAppTapticNotificationOccurred", {"type": "success"});
            setTimeout(() => { el.style.top = '-100px'; }, 3000);
        }

        function toggleFS() { if(img.src && !img.src.includes('undefined')) viewport.classList.toggle('fs'); }

        window.onload = renderHistory;
        promptIn.addEventListener('keypress', (e) => { if(e.key === 'Enter') generate(); });
    </script>
</body>
</html>
