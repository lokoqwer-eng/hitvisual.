<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Streamer Fast</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=Montserrat:wght@400;700&display=swap');
        
        body { background: #0a0a12; color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; overflow: hidden; height: 100vh; }

        /* ПОСТОЯННЫЙ ФОН КОМНАТЫ */
        #room {
            position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 50%, #1a1033 0%, #07070c 100%);
            z-index: 1;
        }
        #room::before {
            content: ''; position: absolute; inset: 0;
            background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.1;
        }

        /* ПЕРСОНАЖ И КРЕСЛО */
        .stage {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 320px; height: 500px; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            animation: breathe 5s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }

        /* КРЕСЛО */
        .chair {
            position: absolute; bottom: 20px; width: 240px; height: 350px;
            background: #111; border: 2px solid #222; border-radius: 40px 40px 20px 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); z-index: 5;
        }

        /* ТЕЛО */
        .avatar { position: relative; z-index: 15; display: flex; flex-direction: column; align-items: center; margin-bottom: 40px; }
        
        .head {
            width: 110px; height: 140px; background: #ffe4d5; border-radius: 55px 55px 65px 65px;
            position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .hair {
            position: absolute; top: -15px; left: -10px; width: 130px; height: 100px;
            background: linear-gradient(180deg, #00f2ff, #7000ff); border-radius: 65px 65px 20px 20px;
        }
        .eyes { position: absolute; top: 65px; width: 100%; display: flex; justify-content: space-around; padding: 0 20px; }
        .eye { width: 22px; height: 22px; background: #fff; border-radius: 50%; position: relative; animation: blink 4s infinite; }
        .eye::after { content: ''; position: absolute; top: 6px; left: 6px; width: 10px; height: 10px; background: #111; border-radius: 50%; }

        @keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(0.1); } }

        .mouth {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 18px; height: 6px; background: #ff4081; border-radius: 10px; transition: 0.1s;
        }
        .talking .mouth { animation: speak 0.15s infinite alternate; }
        @keyframes speak { from { height: 4px; } to { height: 14px; border-radius: 50%; } }

        .torso { width: 140px; height: 150px; background: #1a1a2e; border-radius: 40px 40px 50px 50px; margin-top: -20px; border: 2px solid #333; }

        /* ИНТЕРФЕЙС */
        .hud { position: absolute; inset: 0; z-index: 100; pointer-events: none; padding: 25px; display: flex; flex-direction: column; justify-content: space-between; }
        .glass { background: rgba(0,0,0,0.75); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; pointer-events: auto; }
        
        #chat { max-height: 160px; overflow-y: auto; }
        .msg { font-size: 11px; margin-bottom: 5px; animation: msgIn 0.2s ease-out; }
        @keyframes msgIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        /* ЭКРАН СТАРТА */
        #gate { background: #0a0a12; cursor: pointer; transition: 0.5s; }
    </style>
</head>
<body>

    <div id="gate" class="fixed inset-0 z-[1000] flex flex-col items-center justify-center" onclick="start()">
        <div class="w-20 h-20 bg-cyan-500 rounded-full flex items-center justify-center animate-pulse shadow-[0_0_30px_rgba(6,182,212,0.5)]">
            <div class="text-black font-black text-xs uppercase">Live</div>
        </div>
        <div class="mt-6 text-[10px] text-white/40 uppercase tracking-[4px]">Нажми чтобы начать</div>
    </div>

    <div id="room"></div>

    <div class="stage" id="character-box">
        <div class="avatar">
            <div class="head">
                <div class="hair"></div>
                <div class="eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div id="mouth" class="mouth"></div>
            </div>
            <div class="torso"></div>
        </div>
        <div class="chair"></div>
    </div>

    <div class="hud">
        <div class="flex justify-between items-start pointer-events-auto">
            <div class="flex flex-col gap-2">
                <div class="bg-red-600 px-3 py-1 rounded text-[10px] font-black uppercase tracking-tighter">Live</div>
                <div class="glass px-3 py-1 text-[10px] font-bold text-cyan-400" id="timer">00:00:00</div>
            </div>
            <div class="glass px-4 py-2 text-[10px] font-bold uppercase">
                <span class="text-white/40 mr-2">Зрители:</span> <span id="vcount">1,402</span>
            </div>
        </div>

        <div class="flex flex-col gap-3">
            <div id="chat" class="glass p-3">
                <div class="msg text-white/30 italic">Чат активен...</div>
            </div>
            <div class="glass p-2 flex gap-2 pointer-events-auto">
                <input id="inp" type="text" class="bg-transparent border-none outline-none flex-1 px-4 text-sm" placeholder="Напиши что-нибудь...">
                <button onclick="sendMsg()" class="bg-cyan-500 text-black px-6 py-2 rounded-xl font-black text-[10px] uppercase">Send</button>
            </div>
        </div>
    </div>

    <audio id="music" loop src="https://stream.zeno.fm/0r0xa792kwzuv"></audio>

    <script>
        const chat = document.getElementById('chat');
        const inp = document.getElementById('inp');
        const mouth = document.getElementById('mouth');
        const music = document.getElementById('music');
        let talking = false;

        function start() {
            try { vkBridge.send("VKWebAppInit"); } catch(e) {}
            document.getElementById('gate').style.opacity = '0';
            setTimeout(() => document.getElementById('gate').style.display = 'none', 500);
            
            music.play();
            music.volume = 0.1;
            
            startTimer();
            addMsg("Система", "Эфир запущен успешно!", true);
            
            setInterval(() => {
                if(!talking && Math.random() > 0.7) {
                    aiSpeak("Ребята, не забывайте ставить лайки и писать в чат!", true);
                }
            }, 25000);
        }

        function addMsg(user, text, isBot = false) {
            const d = document.createElement('div');
            d.className = 'msg';
            d.innerHTML = `<b class="${isBot ? 'text-cyan-400' : 'text-pink-500'} uppercase mr-1">${user}:</b> ${text}`;
            chat.appendChild(d);
            chat.scrollTop = chat.scrollHeight;
        }

        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'ru-RU';
            u.pitch = 1.4;
            u.onstart = () => { talking = true; document.getElementById('character-box').classList.add('talking'); };
            u.onend = () => { talking = false; document.getElementById('character-box').classList.remove('talking'); };
            window.speechSynthesis.speak(u);
        }

        async function aiSpeak(prompt, isAuto = false) {
            try {
                const sys = isAuto ? "Ты стримерша. Скажи короткую фразу чату. До 7 слов." : "Ты стримерша. Ответь коротко. До 7 слов.";
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?system=${encodeURIComponent(sys)}`);
                const txt = await res.text();
                addMsg("ИИ-Тян", txt, true);
                speak(txt);
            } catch(e) {}
        }

        function sendMsg() {
            const v = inp.value.trim();
            if(!v || talking) return;
            inp.value = '';
            addMsg("Ты", v);
            aiSpeak(v);
        }

        function startTimer() {
            let s = 0;
            setInterval(() => {
                s++;
                const m = Math.floor((s%3600)/60).toString().padStart(2,'0');
                const sc = (s%60).toString().padStart(2,'0');
                document.getElementById('timer').innerText = `00:${m}:${sc}`;
                
                if(s % 10 === 0) {
                    const vc = 1400 + Math.floor(Math.random()*100);
                    document.getElementById('vcount').innerText = vc.toLocaleString();
                }
            }, 1000);
        }

        inp.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMsg(); });
    </script>
</body>
</html>
