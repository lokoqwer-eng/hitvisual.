<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HIT VISUAL | AI PODCAST</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=JetBrains+Mono&display=swap');
        
        :root { 
            --neon: #00f2ff; 
            --bg: #07090f;
            --vh: 1vh; 
        }

        html, body {
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            margin: 0;
            padding: 0;
            background: var(--bg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .sync { font-family: 'Unbounded', sans-serif; font-weight: 900; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Шапка с безопасным отступом сверху */
        .header {
            padding: calc(env(safe-area-inset-top) + 15px) 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(7,9,15,1), rgba(7,9,15,0));
        }

        /* Главный экран */
        .viewport {
            flex: 1;
            margin: 0 15px;
            background: #000;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0, 242, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #main-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease;
            opacity: 0;
        }

        /* Вебка ИИ */
        .host-cam {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 70px;
            height: 90px;
            background: rgba(0,0,0,0.8);
            border: 1px solid var(--neon);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .v-bar { width: 3px; background: var(--neon); height: 2px; transition: height 0.1s; margin: 0 1px; }

        /* Панель управления */
        .ui-panel {
            padding: 20px 20px calc(env(safe-area-inset-bottom) + 20px);
            background: #0d1117;
            border-radius: 32px 32px 0 0;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 10px;
        }

        .btn-mode {
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.5);
        }
        .btn-mode.active {
            background: var(--neon);
            color: #000;
        }

        input {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            color: #fff;
            font-size: 14px;
        }

        /* Стильный лоадер */
        #loader {
            position: fixed;
            inset: 0;
            background: #07090f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .pulse-text { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="sync text-cyan-400 text-xl pulse-text mb-4">HIT VISUAL</div>
        <div class="text-[8px] mono tracking-[4px] text-white/30 uppercase">Инициализация ИИ...</div>
    </div>

    <div class="header">
        <div>
            <div class="text-[14px] sync text-white">HIT VISUAL</div>
            <div class="text-[7px] mono text-cyan-500/60 uppercase tracking-[2px]">Core System</div>
        </div>
        <div class="flex gap-1 bg-white/5 p-1 rounded-xl">
            <button id="m-auto" onclick="setMode('auto')" class="btn-mode active">ЭФИР</button>
            <button id="m-man" onclick="setMode('manual')" class="btn-mode">МАСТЕР</button>
        </div>
    </div>

    <div class="viewport" id="stage">
        <!-- Заглушка на случай сбоя загрузки -->
        <div class="absolute inset-0 bg-gradient-to-br from-gray-900 to-black flex items-center justify-center opacity-20">
            <div class="sync text-4xl text-white/10">HIT VISUAL</div>
        </div>
        
        <img id="main-img" src="" alt="AI Art">
        
        <div id="status-icon" class="absolute top-4 left-4 flex items-center gap-2">
            <div class="w-2 h-2 bg-red-600 rounded-full animate-ping"></div>
            <div class="text-[8px] mono text-white/40 uppercase">Broadcast</div>
        </div>

        <div class="host-cam">
            <div class="text-[6px] font-bold text-cyan-400 mb-2">HOST</div>
            <div class="flex items-end h-[20px]" id="viz"></div>
        </div>
    </div>

    <div class="ui-panel">
        <div id="auto-ui">
            <div id="ai-text" class="text-[11px] leading-relaxed text-white/60 italic border-l-2 border-cyan-500/50 pl-4 py-1">
                Подключаемся к нейросети...
            </div>
        </div>

        <div id="manual-ui" class="hidden">
            <input type="text" id="user-prompt" placeholder="Опишите новый шедевр...">
            <button onclick="handleManual()" class="w-full mt-3 py-3 bg-cyan-400 text-black rounded-xl font-black sync text-[10px]">ГЕНЕРИРОВАТЬ</button>
        </div>
    </div>

<script>
    // Фикс высоты для мобилок
    function fixHeight() {
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    window.addEventListener('resize', fixHeight);
    fixHeight();

    vkBridge.send("VKWebAppInit");

    let mode = 'auto';
    let isSpeaking = false;
    const phrases = [
        "HIT VISUAL: Будущее уже загружено в ваш поток.",
        "Этот арт синтезирован специально для вашего эфира.",
        "Визуальная эстетика нового поколения. Смотрите.",
        "Границы реальности стерты нейронными связями.",
        "Каждый кадр — это хит. Добро пожаловать в завтра."
    ];

    // Визуализатор
    const viz = document.getElementById('viz');
    for(let i=0; i<5; i++) {
        const b = document.createElement('div'); b.className = 'v-bar'; viz.appendChild(b);
    }
    setInterval(() => {
        const bars = document.getElementsByClassName('v-bar');
        for(let b of bars) b.style.height = (isSpeaking ? Math.random()*20 + 2 : 2) + 'px';
    }, 100);

    // Убираем лоадер через 3 секунды ГАРАНТИРОВАННО
    setTimeout(() => {
        document.getElementById('loader').style.opacity = '0';
        setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
    }, 3000);

    function setMode(m) {
        mode = m;
        document.getElementById('m-auto').classList.toggle('active', m === 'auto');
        document.getElementById('m-man').classList.toggle('active', m === 'manual');
        document.getElementById('auto-ui').classList.toggle('hidden', m === 'manual');
        document.getElementById('manual-ui').classList.toggle('hidden', m === 'auto');
        if(m === 'auto') startAuto();
    }

    function speak(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(text);
        m.lang = 'ru-RU'; m.rate = 1;
        m.onstart = () => isSpeaking = true;
        m.onend = () => isSpeaking = false;
        window.speechSynthesis.speak(m);
    }

    async function startAuto() {
        if(mode !== 'auto') return;
        const text = phrases[Math.floor(Math.random()*phrases.length)];
        document.getElementById('ai-text').innerText = text;
        
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent("luxury futuristic digital art hit visual aesthetic 8k")}?seed=${Math.random()}&nologo=true&width=1024&height=1280`;
        
        const img = document.getElementById('main-img');
        img.src = url;
        img.onload = () => {
            img.style.opacity = 1;
            speak(text);
            setTimeout(() => { if(mode === 'auto') startAuto(); }, 12000);
        };
    }

    async function handleManual() {
        const p = document.getElementById('user-prompt').value;
        if(!p) return;
        const img = document.getElementById('main-img');
        img.style.opacity = 0.4;
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?seed=${Math.random()}&nologo=true&width=1024&height=1280`;
        img.src = url;
        img.onload = () => {
            img.style.opacity = 1;
            vkBridge.send("VKWebAppTapticNotificationOccurred", {"type": "success"});
        };
    }

    window.onload = startAuto;
</script>
</body>
</html>
