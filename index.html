
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <title>HIT VISUAL LUXURY</title>
    
    <!-- VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Montserrat:wght@400;700&display=swap');
        
        :root {
            --neon: #00e5ff;
            --pink: #ff007b;
        }

        body {
            background: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 229, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 0, 123, 0.08) 0px, transparent 50%);
        }

        .syncopate { font-family: 'Syncopate', sans-serif; }

        .glow-text {
            font-size: 10px;
            letter-spacing: 0.7em;
            font-weight: 700;
            background: linear-gradient(90deg, #00e5ff, #ff007b, #7000ff, #00e5ff);
            background-size: 200% auto;
            color: #000;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow 4s linear infinite;
        }

        @keyframes rainbow {
            to { background-position: 200% center; }
        }

        .art-canvas {
            flex: 1;
            margin: 15px;
            background: #0f172a;
            border-radius: 32px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 2px solid #fff;
            cursor: pointer;
        }

        #result-img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: none;
        }

        .art-canvas.fullscreen {
            position: fixed; inset: 0; margin: 0; z-index: 9999; border-radius: 0; background: #000;
        }
        .art-canvas.fullscreen #result-img { object-fit: contain; }

        .ui-dock {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 20px 20px calc(30px + env(safe-area-inset-bottom));
            border-radius: 40px 40px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.05);
        }

        .input-box {
            position: relative;
            background: #f1f5f9;
            border-radius: 20px;
            padding: 16px 55px 16px 25px;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
        }

        .input-box input {
            background: transparent; border: none; outline: none; width: 100%; font-size: 16px; color: #0f172a;
        }

        .btn {
            width: 100%; padding: 18px; border-radius: 20px; font-family: 'Syncopate', sans-serif;
            font-weight: 700; font-size: 11px; letter-spacing: 2px; transition: 0.3s;
        }

        .btn-black { background: #000; color: #fff; }
        .btn-white { background: #fff; color: #000; border: 1px solid #e2e8f0; margin-top: 10px; display: none; }
        .btn:active { transform: scale(0.97); }

        .loader-ui { display: none; flex-direction: column; align-items: center; }
        .spinner {
            width: 45px; height: 45px;
            border: 4px solid rgba(0, 229, 255, 0.1);
            border-top: 4px solid var(--neon);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="pt-10 pb-2 text-center">
        <div class="glow-text syncopate">HIT VISUAL LUXURY</div>
    </div>

    <div class="art-canvas" id="canvas" onclick="toggleFS()">
        <div class="loader-ui" id="loader">
            <div class="spinner"></div>
            <div class="mt-4 text-[8px] tracking-[4px] text-white/50 font-bold uppercase syncopate">Rendering Art...</div>
        </div>
        <div id="idle-text" class="syncopate opacity-20 text-[9px] tracking-[0.5em] text-white text-center px-12">
            НАПИШИТЕ ВАШ ЗАПРОС
        </div>
        <img id="result-img" src="" alt="AI Art">
    </div>

    <div class="ui-dock">
        <div class="input-box">
            <input type="text" id="prompt-input" placeholder="Космический пейзаж, 8k..." autocomplete="off">
            <div class="absolute right-4 top-1/2 -translate-y-1/2 opacity-30 text-xl cursor-pointer" onclick="clearInp()">❌</div>
        </div>
        <button id="gen-btn" onclick="runGenerate()" class="btn btn-black">СОЗДАТЬ</button>
        <button id="save-btn" onclick="handleSave()" class="btn btn-white">СОХРАНИТЬ</button>
    </div>

    <script>
        vkBridge.send("VKWebAppInit");

        const img = document.getElementById('result-img');
        const loader = document.getElementById('loader');
        const idle = document.getElementById('idle-text');
        const canvas = document.getElementById('canvas');
        const genBtn = document.getElementById('gen-btn');
        const saveBtn = document.getElementById('save-btn');
        const field = document.getElementById('prompt-input');

        function clearInp() { field.value = ''; field.focus(); }

        function toggleFS() {
            if (img.src && img.style.display !== 'none') canvas.classList.toggle('fullscreen');
        }

        async function runGenerate() {
            const prompt = field.value;
            if (!prompt) return;

            // СБРОС СОСТОЯНИЯ
            img.style.display = 'none';
            img.src = '';
            saveBtn.style.display = 'none';
            loader.style.display = 'flex';
            idle.style.display = 'none';
            genBtn.disabled = true;
            genBtn.innerText = "ГЕНЕРАЦИЯ...";

            const seed = Math.floor(Math.random() * 10000000);
            const ts = Date.now();
            // Добавляем timestamp (ts) в конец URL, чтобы убить кэш браузера
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed}&width=1024&height=1024&nologo=true&model=flux&enhance=true&t=${ts}`;

            const tester = new Image();
            tester.crossOrigin = "anonymous";
            
            tester.onload = () => {
                // Принудительно обновляем src основного элемента
                img.src = url;
                img.style.display = 'block';
                loader.style.display = 'none';
                genBtn.disabled = false;
                genBtn.innerText = "СОЗДАТЬ";
                saveBtn.style.display = 'block';
                vkBridge.send("VKWebAppTapticNotificationOccurred", {"type": "success"});
            };

            tester.onerror = () => {
                loader.style.display = 'none';
                idle.style.display = 'block';
                idle.innerText = "СБОЙ СЕТИ. ПОВТОРИТЕ.";
                genBtn.disabled = false;
                genBtn.innerText = "СОЗДАТЬ";
            };

            tester.src = url;
        }

        function handleSave() {
            if (!img.src) return;

            // Универсальный фоллбэк: открыть картинку во весь экран в ВК
            // Это позволяет сохранить ее через долгое нажатие даже без спецправ приложения
            vkBridge.send("VKWebAppShowImages", { images: [img.src] })
                .catch(() => {
                    // Если вдруг ShowImages упал, открываем в новой вкладке
                    window.open(img.src, '_blank');
                });
            
            setTimeout(() => {
                alert('💡 Зажмите фото пальцем → "Сохранить в галерею"');
            }, 1000);
        }

        field.addEventListener('keypress', (e) => { if (e.key === 'Enter') runGenerate(); });
    </script>
</body>
</html>
