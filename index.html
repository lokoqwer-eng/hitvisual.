<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HIT VISUAL | SPEED MASTER</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=JetBrains+Mono&display=swap');
        :root { --neon: #00f2ff; --bg: #05070a; --vh: 1vh; }
        html, body {
            height: 100vh; height: calc(var(--vh, 1vh) * 100);
            margin: 0; padding: 0; background: var(--bg);
            overflow: hidden; display: flex; flex-direction: column;
            color: #fff; font-family: 'Unbounded', sans-serif;
        }
        .sync { font-family: 'Unbounded', sans-serif; font-weight: 900; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        .viewport {
            flex: 1; margin: 10px; background: #000; border-radius: 20px;
            position: relative; overflow: hidden; border: 1px solid rgba(0, 242, 255, 0.15);
        }
        #main-img { width: 100%; height: 100%; object-fit: cover; transition: filter 0.5s ease, opacity 0.5s ease; opacity: 0; }
        
        /* Индикатор прогресса генерации */
        #gen-progress {
            position: absolute; top: 0; left: 0; height: 3px; width: 0%;
            background: var(--neon); box-shadow: 0 0 10px var(--neon);
            transition: width 0.3s; z-index: 100;
        }

        .host-cam {
            position: absolute; bottom: 12px; right: 12px; width: 60px; height: 80px;
            background: rgba(0,0,0,0.8); border: 1px solid var(--neon);
            border-radius: 10px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 30;
        }
        .v-bar { width: 3px; background: var(--neon); height: 2px; transition: height 0.1s; margin: 0 1px; }

        .master-area {
            padding: 15px 20px calc(env(safe-area-inset-bottom) + 10px);
            background: #0a0d12; border-radius: 25px 25px 0 0;
        }
        
        .input-group {
            position: relative; display: flex; gap: 8px; align-items: center;
        }
        
        input {
            background: rgba(255,255,255,0.05) !important;
            border: 1px solid rgba(0, 242, 255, 0.3) !important;
            flex: 1; padding: 14px 18px; border-radius: 16px;
            outline: none; color: #fff !important; font-size: 15px;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .master-btn {
            background: var(--neon); color: #000; padding: 14px 20px;
            border-radius: 16px; font-weight: 900; font-size: 10px;
            text-transform: uppercase; letter-spacing: 1px;
        }

        .dl-btn {
            position: absolute; top: 12px; left: 12px; z-index: 50;
            background: rgba(0,0,0,0.4); border-radius: 8px; padding: 8px;
        }

        #splash {
            position: fixed; inset: 0; background: #05070a;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000;
        }
    </style>
</head>
<body onclick="kickstart()">

    <div id="splash">
        <div class="sync text-cyan-400 text-4xl mb-2 italic">HIT VISUAL</div>
        <div class="text-[8px] mono text-white/20 tracking-[6px] mb-10">BY AI MASTER SYSTEM</div>
        <div class="px-12 py-4 bg-cyan-400 text-black sync text-[11px] rounded-2xl animate-bounce">В ЭФИР</div>
    </div>

    <div class="pt-8 pb-2 px-6 flex justify-between items-end">
        <div class="sync text-[11px] text-cyan-400">LIVE BROADCAST</div>
        <div id="mini-viz" class="flex gap-1 items-end h-3"></div>
    </div>

    <div class="viewport">
        <div id="gen-progress"></div>
        <button class="dl-btn" onclick="saveArt(event)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        </button>
        
        <img id="main-img" src="">
        
        <div class="host-cam">
            <div id="viz" class="flex items-end h-[25px]"></div>
        </div>
    </div>

    <div class="master-area">
        <div id="ai-log" class="text-[10px] mono text-white/50 mb-3 overflow-hidden whitespace-nowrap">
            > SYSTEM: STANDBY
        </div>
        <div class="input-group">
            <input type="text" id="m-prompt" placeholder="Твой промпт для нейросети...">
            <button onclick="masterLaunch()" class="master-btn sync">ПУСК</button>
        </div>
    </div>

    <audio id="stream" loop src="https://stream.nightride.fm/chillsynth.mp3"></audio>

<script>
    const vh = () => document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
    window.addEventListener('resize', vh); vh();
    vkBridge.send("VKWebAppInit");

    let isSpeaking = false, started = false, autoTimer;
    const radio = document.getElementById('stream');
    const mainImg = document.getElementById('main-img');
    const log = document.getElementById('ai-log');
    const progressBar = document.getElementById('gen-progress');

    function bars(id, n) {
        const c = document.getElementById(id);
        for(let i=0; i<n; i++) {
            const b = document.createElement('div'); b.className = 'v-bar'; c.appendChild(b);
        }
    }
    bars('viz', 5); bars('mini-viz', 4);

    setInterval(() => {
        const b = document.getElementsByClassName('v-bar');
        for(let x of b) x.style.height = (isSpeaking ? Math.random()*25 + 4 : 2) + 'px';
    }, 100);

    function kickstart() {
        if(started) return;
        started = true;
        document.getElementById('splash').style.display = 'none';
        radio.volume = 0.4; radio.play();
        if(window.speechSynthesis) window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
        log.innerText = "> SYSTEM: CONNECTED";
        autoNext();
    }

    function aiSay(t) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'ru-RU';
        m.onstart = () => { isSpeaking = true; radio.volume = 0.05; };
        m.onend = () => { isSpeaking = false; radio.volume = 0.4; };
        window.speechSynthesis.speak(m);
    }

    async function loadImage(prompt, isMaster = false) {
        clearTimeout(autoTimer);
        log.innerText = isMaster ? "> MASTER: GENERATING..." : "> AI: UPDATING VISUAL...";
        progressBar.style.width = "30%";
        
        // Используем ускоренные параметры
        const seed = Math.floor(Math.random() * 1000000);
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed}&width=768&height=1024&nologo=true`;
        
        const loader = new Image();
        loader.src = url;
        
        progressBar.style.width = "60%";
        
        loader.onload = () => {
            progressBar.style.width = "100%";
            mainImg.style.opacity = 0;
            setTimeout(() => {
                mainImg.src = url;
                mainImg.style.opacity = 1;
                progressBar.style.width = "0%";
                
                const phrase = isMaster ? "Ваш запрос обработан мастером." : "Новый поток визуализации запущен.";
                log.innerText = "> " + (isMaster ? "MASTER" : "AI") + ": SUCCESS";
                aiSay(phrase);
                
                autoTimer = setTimeout(autoNext, 15000);
            }, 300);
        };
        
        loader.onerror = () => {
            log.innerText = "> ERROR: RETRYING...";
            autoNext();
        };
    }

    function autoNext() {
        const t = ["cyberpunk neon", "future retro", "digital luxury", "space wave"][Math.floor(Math.random()*4)];
        loadImage(t + " hit visual art 4k");
    }

    function masterLaunch() {
        const p = document.getElementById('m-prompt').value;
        if(!p) return;
        vkBridge.send("VKWebAppTapticNotificationOccurred", {"type": "light"});
        aiSay("Запускаю мастер-генерацию.");
        loadImage(p + " high quality hit visual masterpiece", true);
    }

    function saveArt(e) {
        e.stopPropagation();
        window.open(mainImg.src, '_blank');
    }
</script>
</body>
</html>
