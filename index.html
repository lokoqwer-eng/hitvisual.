<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI VTuber Stream</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0f; color: #fff; 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; height: 100vh; 
        }

        /* ФОН - используем реальный URL */
        #bg {
            position: fixed; inset: 0;
            background: linear-gradient(135deg, #1a0b2e 0%, #0f0f1e 100%);
            z-index: 1;
        }
        #bg::before {
            content: '';
            position: absolute; inset: 0;
            background-image: url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=1200');
            background-size: cover;
            opacity: 0.3;
            filter: blur(1px);
        }

        /* ЖИВОЙ ПЕРСОНАЖ - используем видео или GIF */
        .avatar-container {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 450px;
            z-index: 10;
            pointer-events: none;
        }

        /* Анимация дыхания */
        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: contain;            animation: breathe 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(0,242,255,0.3));
        }

        @keyframes breathe {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.01); }
        }

        /* Анимация разговора */
        .talking .avatar-img {
            animation: talkBounce 0.3s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255,0,122,0.5));
        }

        @keyframes talkBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.02); }
        }

        /* ИНТЕРФЕЙС */
        .hud {
            position: fixed;
            inset: 0;
            z-index: 100;
            padding: 20px;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .glass {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0,242,255,0.2);
            border-radius: 16px;
            pointer-events: auto;
        }

        /* Чат */
        #chat-box {
            position: absolute;
            top: 100px;
            right: 20px;
            width: 260px;
            max-height: 280px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;            scrollbar-width: none;
            pointer-events: none;
        }

        .msg {
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 11px;
            background: rgba(0,0,0,0.6);
            border-left: 3px solid #00f2ff;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Экран запуска */
        #start {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ЗАПУСКА -->
    <div id="start" onclick="launch()">
        <div class="w-20 h-20 border-4 border-cyan-500 rounded-full flex items-center justify-center animate-pulse mb-4">
            <div class="w-3 h-3 bg-cyan-500 rounded-full"></div>
        </div>
        <div class="text-cyan-500 font-black text-lg mb-2">START STREAM</div>
        <div class="text-[10px] text-white/40 uppercase tracking-widest">Нажми чтобы начать</div>
    </div>

    <div id="bg"></div>

    <!-- АВАТАР - используем реальное изображение -->
    <div class="avatar-container" id="avatar">
        <!-- ЗАМЕНИ ЭТУ ССЫЛКУ на свою крутую картинку -->
        <img class="avatar-img" 
             src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=600&h=900&fit=crop"             alt="VTuber"
             id="vtuber-img">
    </div>

    <div class="hud">
        <!-- Верхняя панель -->
        <div class="flex justify-between items-start">
            <div class="flex items-center gap-2">
                <div class="bg-red-600 px-3 py-1 rounded text-[10px] font-black uppercase animate-pulse">Live</div>
                <div class="glass px-3 py-1 text-[11px] font-bold" id="timer">00:00:00</div>
            </div>
            <div class="glass px-4 py-2 text-right">
                <div class="text-[8px] text-white/40 uppercase">Viewers</div>
                <div class="text-lg font-black text-cyan-400" id="viewers">1,247</div>
            </div>
        </div>

        <!-- Чат -->
        <div id="chat-box"></div>

        <!-- Низ -->
        <div class="mt-auto flex flex-col gap-3">
            <div class="glass p-3 flex items-center gap-3">
                <div class="w-8 h-8 bg-cyan-500/20 rounded-full flex items-center justify-center">
                    <svg class="w-4 h-4 text-cyan-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                </div>
                <div class="flex-1">
                    <div class="text-[8px] text-white/30 uppercase">Music</div>
                    <div class="text-[11px] font-bold" id="music-title">Cyber Radio</div>
                </div>
            </div>

            <div class="flex gap-2">
                <input type="text" id="input" class="glass flex-1 bg-transparent border-none outline-none px-4 py-3 text-sm" placeholder="Напиши сообщение...">
                <button onclick="send()" class="bg-cyan-500 text-black px-6 py-3 rounded-xl font-black text-[10px] uppercase">Send</button>
            </div>
        </div>
    </div>

    <script>
        let isSpeaking = false;
        let lastMsg = Date.now();
        let msgCount = 0;
        const maxMessages = 50; // Лимит сообщений

        // Инициализация VK
        async function launch() {
            document.getElementById('start').style.display = 'none';
            
            // Правильная инициализация VK Bridge            if (window.vkBridge) {
                try {
                    await vkBridge.send('VKWebAppInit');
                    console.log('✅ VK Ready');
                } catch(e) {
                    console.log('⚠️ VK Error:', e);
                }
            }

            addChat('System', '🔴 Эфир начался! Привет, чат!', 'text-cyan-400');
            startTimer();
            
            // Авто-активность
            setInterval(() => {
                if (Date.now() - lastMsg > 20000 && !isSpeaking) {
                    aiTalk('auto');
                }
            }, 15000);
        }

        function addChat(user, text, color = 'text-white') {
            const chat = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<b class="${color}">${user}:</b> ${text}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            
            // Удаляем старые сообщения
            if (chat.children.length > maxMessages) {
                chat.removeChild(chat.firstChild);
            }
            
            lastMsg = Date.now();
        }

        // ГОВОРЯЩИЙ ИИ с обработкой ошибок
        async function aiTalk(mode) {
            if (isSpeaking) return;

            const prompts = {
                'auto': ['Расскажи что-нибудь интересное', 'Поздоровайся с новыми зрителями', 'Прокомментируй музыку'],
                'user': (text) => text
            };

            let prompt = mode === 'auto' 
                ? prompts.auto[Math.floor(Math.random() * prompts.auto.length)]
                : prompts.user(mode);

            try {                // БЕСПЛАТНЫЙ API с retry
                const response = await fetchWithRetry(`https://text.pollinations.ai/${encodeURIComponent(prompt + ' (отвечай коротко, мило, по-русски)')}?seed=${Math.random()}`);
                
                if (response) {
                    addChat('AI_Tyan', response, 'text-pink-400');
                    speak(response);
                } else {
                    addChat('AI_Tyan', '📡 Связь барахлит...', 'text-pink-400');
                }
            } catch(e) {
                console.error('AI Error:', e);
                addChat('AI_Tyan', '⚠️ Ошибка сети', 'text-pink-400');
            }
        }

        // Fetch с повторными попытками
        async function fetchWithRetry(url, retries = 3) {
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(url);
                    if (res.ok) return await res.text();
                    await new Promise(r => setTimeout(r, 1000 * (i + 1)));
                } catch(e) {
                    if (i === retries - 1) throw e;
                    await new Promise(r => setTimeout(r, 1000 * (i + 1)));
                }
            }
            return null;
        }

        // Озвучка
        function speak(text) {
            if (!window.speechSynthesis) return;
            
            window.speechSynthesis.cancel();
            
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ru-RU';
            utter.pitch = 1.3;
            utter.rate = 1.05;
            
            utter.onstart = () => {
                isSpeaking = true;
                document.getElementById('avatar').classList.add('talking');
            };
            
            utter.onend = () => {
                isSpeaking = false;
                document.getElementById('avatar').classList.remove('talking');
            };            
            utter.onerror = (e) => {
                console.error('TTS Error:', e);
                isSpeaking = false;
                document.getElementById('avatar').classList.remove('talking');
            };
            
            window.speechSynthesis.speak(utter);
        }

        function send() {
            const input = document.getElementById('input');
            const val = input.value.trim();
            if (!val) return;
            
            input.value = '';
            addChat('You', val, 'text-cyan-400');
            aiTalk(val);
        }

        function startTimer() {
            let s = 0;
            setInterval(() => {
                s++;
                const h = Math.floor(s/3600).toString().padStart(2,'0');
                const m = Math.floor((s%3600)/60).toString().padStart(2,'0');
                const sc = (s%60).toString().padStart(2,'0');
                document.getElementById('timer').innerText = `${h}:${m}:${sc}`;
                
                if (s % 5 === 0) {
                    const v = 1200 + Math.floor(Math.random() * 300);
                    document.getElementById('viewers').innerText = v.toLocaleString();
                }
            }, 1000);
        }

        document.getElementById('input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') send();
        });
    </script>
</body>
</html>
