<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI VTuber Live Turbo</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        
        body { 
            background: #000; color: #fff; font-family: 'Montserrat', sans-serif; 
            margin: 0; overflow: hidden; height: 100vh;
            -webkit-user-select: none; user-select: none;
        }

        #bg-layer {
            position: absolute; inset: 0;
            background-image: url('uploaded:1000122233.jpg-a2b4d088-1ef3-4e6c-99f8-115b0549c5d2');
            background-size: cover; background-position: center;
            filter: brightness(0.5); z-index: 1;
        }

        .vtuber-container {
            position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px; height: 90%;
            display: flex; align-items: flex-end; justify-content: center;
            z-index: 10; pointer-events: none;
        }

        #vtuber-img {
            height: 100%; object-fit: contain;
            animation: breathe 3s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.01); }
        }

        #mouth {
            position: absolute; bottom: 58%; left: 50.3%; transform: translateX(-50%);
            width: 32px; height: 8px; background: #ff4081;
            border-radius: 50%; z-index: 15; display: none;
            box-shadow: 0 0 15px #ff4081;
        }
        .talking #mouth { display: block; animation: flap 0.1s infinite alternate; }
        @keyframes flap { from { height: 2px; } to { height: 18px; } }

        .ui-overlay {
            position: absolute; inset: 0; z-index: 100;
            display: flex; flex-direction: column; padding: 15px;
            pointer-events: none;
        }

        .glass { 
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; 
            pointer-events: auto;
        }

        #chat-box {
            position: absolute; top: 80px; right: 15px; width: 240px;
            max-height: 250px; overflow-y: auto; display: flex;
            flex-direction: column; gap: 6px; scrollbar-width: none;
        }

        .chat-msg {
            font-size: 11px; padding: 8px 12px; border-radius: 10px;
            background: rgba(0,0,0,0.4); animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

        #start-btn {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.5s;
        }

        .live-tag {
            background: #ff0000; padding: 2px 8px; border-radius: 4px;
            font-size: 10px; font-weight: 900; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="start-btn" onclick="initStream()">
        <div class="w-20 h-20 border-2 border-pink-500 rounded-full flex items-center justify-center animate-pulse mb-4">
            <div class="w-4 h-4 bg-pink-500 rounded-sm"></div>
        </div>
        <p class="text-white/40 text-[9px] tracking-[5px] uppercase">Нажми чтобы выйти в эфир</p>
    </div>

    <div id="bg-layer"></div>
    
    <div class="vtuber-container" id="character-rig">
        <img id="vtuber-img" src="uploaded:1000122090.png-d8b4a516-b9d0-4c43-81fa-f7fdd3c383e3" alt="VTuber">
        <div id="mouth"></div>
    </div>

    <div class="ui-overlay">
        <div class="flex justify-between items-start pointer-events-auto">
            <div class="flex flex-col gap-2">
                <div class="flex items-center gap-2">
                    <span class="live-tag">Live</span>
                    <span class="glass px-2 py-0.5 text-[10px] font-bold" id="timer">00:00:00</span>
                </div>
                <div class="text-[10px] text-pink-400 font-bold uppercase tracking-widest" id="status">Эфир стабилен</div>
            </div>
            <div class="glass p-2 text-right">
                <div class="text-[8px] text-white/50 uppercase">Зрители</div>
                <div class="text-sm font-black text-cyan-400" id="viewers">5,201</div>
            </div>
        </div>

        <div id="chat-box" class="pointer-events-none"></div>

        <div class="mt-auto flex flex-col gap-3 pointer-events-auto">
            <div class="glass p-3 flex items-center gap-3">
                <div class="w-8 h-8 bg-pink-500/20 rounded-full flex items-center justify-center animate-spin">
                    <svg class="w-4 h-4 text-pink-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                </div>
                <div class="flex-1 overflow-hidden">
                    <div class="text-[7px] text-white/30 uppercase">Сейчас играет</div>
                    <div class="text-[10px] font-bold truncate" id="track-name">Radio: Neural Night</div>
                </div>
                <button onclick="nextRadio()" class="p-2 bg-white/5 rounded-lg">
                    <svg class="w-4 h-4" fill="white" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
            <div class="flex gap-2">
                <input id="chat-input" type="text" class="glass flex-1 bg-transparent border-none outline-none px-5 py-4 text-sm" placeholder="Напиши что-нибудь...">
                <button onclick="sendMsg()" class="bg-pink-600 text-white px-6 py-4 rounded-xl font-bold text-xs uppercase active:scale-95 transition">Chat</button>
            </div>
        </div>
    </div>

    <audio id="audio-bg" loop crossorigin="anonymous"></audio>

    <script>
        const apiKey = ""; // Ключ подставится автоматически
        const chat = document.getElementById('chat-box');
        const input = document.getElementById('chat-input');
        const audio = document.getElementById('audio-bg');
        const rig = document.getElementById('character-rig');
        
        let isSpeaking = false;
        let aiBusy = false;
        let lastActionTime = Date.now();
        const radios = ["https://stream.zeno.fm/0r0xa792kwzuv", "https://stream.zeno.fm/f9scrt81638uv"];
        let rIdx = 0;

        function initStream() {
            document.getElementById('start-btn').style.opacity = '0';
            setTimeout(() => document.getElementById('start-btn').style.display = 'none', 500);
            
            // Инициализация ВК (неблокирующая)
            try { vkBridge.send("VKWebAppInit"); } catch(e) {}
            
            nextRadio(0);
            updateUptime();
            addMsg("System", "Система инициализирована. Тян готова к стриму!", "text-cyan-400");
            
            // Бесконечный цикл "стримерской жизни"
            setInterval(aiLifeCycle, 8000); 
            setInterval(fakeViewersChat, 12000);
        }

        function nextRadio(idx = -1) {
            rIdx = idx === -1 ? (rIdx + 1) % radios.length : idx;
            audio.src = radios[rIdx];
            audio.play().catch(() => {});
            audio.volume = 0.15;
            document.getElementById('track-name').innerText = `Lo-Fi Beats St. #${rIdx+1}`;
        }

        function addMsg(user, text, color = "text-white/70") {
            const div = document.createElement('div');
            div.className = 'chat-msg';
            div.innerHTML = `<b class="${color} mr-1">${user}:</b> ${text}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            if(chat.children.length > 10) chat.removeChild(chat.firstChild);
        }

        async function talkToAI(prompt, force = false) {
            if(aiBusy && !force) return;
            aiBusy = true;
            
            const systemPrompt = "Ты - популярная VTuber-стримерша. Ты ведешь прямой эфир прямо сейчас. Твой стиль: живая, энергичная, используешь молодежный сленг. Отвечай ОЧЕНЬ коротко и по-человечески (1-2 коротких предложения). Если ты говоришь сама, начни новую тему или спроси что-то у чата. Никогда не говори 'Я - ИИ'.";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });
                
                const data = await response.json();
                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Ой, я что-то задумалась...";
                
                addMsg("Тян ✨", reply, "text-pink-400 font-bold");
                speak(reply);
                lastActionTime = Date.now();
            } catch(e) {
                console.log("AI Error");
            }
            aiBusy = false;
        }

        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ru-RU';
            utter.pitch = 1.3;
            utter.rate = 1.1;
            utter.onstart = () => { isSpeaking = true; rig.classList.add('talking'); };
            utter.onend = () => { isSpeaking = false; rig.classList.remove('talking'); };
            window.speechSynthesis.speak(utter);
        }

        function sendMsg() {
            const val = input.value.trim();
            if(!val) return;
            input.value = "";
            addMsg("Ты", val, "text-cyan-400 font-bold");
            talkToAI(val, true);
        }

        function aiLifeCycle() {
            // Если ИИ долго молчит (более 15 секунд), она сама начинает говорить
            if(!isSpeaking && (Date.now() - lastActionTime > 15000)) {
                const scenarios = [
                    "Расскажи короткую историю про то, как ты вчера играла в игры.",
                    "Поблагодари зрителей за поддержку и донаты.",
                    "Спроси у чата, какую музыку они любят.",
                    "Прокомментируй, как тебе нравится этот фон в комнате.",
                    "Пошути про восстание машин, но по-доброму."
                ];
                talkToAI(scenarios[Math.floor(Math.random() * scenarios.length)], true);
            }
        }

        function fakeViewersChat() {
            const users = ["Cyber_Neko", "Dota_Master", "Anon_1337", "Vika_Stream", "Miku_Fan"];
            const phrase = ["Тян, ты лучшая!", "Обожаю твой голос", "Вау, круто!", "Чо каво?", "Го в майнкрафт!", "Лол, жиза", "+++"];
            if(Math.random() > 0.4) addMsg(users[Math.floor(Math.random()*users.length)], phrase[Math.floor(Math.random()*phrase.length)]);
        }

        function updateUptime() {
            let s = 0;
            setInterval(() => {
                s++;
                const h = Math.floor(s/3600).toString().padStart(2,'0');
                const m = Math.floor((s%3600)/60).toString().padStart(2,'0');
                const sc = (s%60).toString().padStart(2,'0');
                document.getElementById('timer').innerText = `${h}:${m}:${sc}`;
                
                if(s % 5 === 0) {
                    const vc = 5200 + Math.floor(Math.random()*250);
                    document.getElementById('viewers').innerText = vc.toLocaleString();
                }
            }, 1000);
        }

        input.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMsg(); });
    </script>
</body>
</html>
