<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HIT VISUAL | TURBO LIVE</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=JetBrains+Mono&display=swap');
        
        :root { --neon: #00f2ff; --bg: #05070a; --vh: 1vh; }

        html, body {
            height: 100vh; height: calc(var(--vh, 1vh) * 100);
            margin: 0; padding: 0; background: var(--bg);
            overflow: hidden; display: flex; flex-direction: column;
            color: #fff; font-family: 'Unbounded', sans-serif;
        }

        .sync { font-family: 'Unbounded', sans-serif; font-weight: 900; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        .viewport {
            flex: 1.3; margin: 10px; background: #000; border-radius: 28px;
            position: relative; overflow: hidden; border: 1px solid rgba(0, 242, 255, 0.2);
            display: flex; align-items: center; justify-content: center;
        }

        #main-img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.5s ease; opacity: 0; }
        #bg-cache { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 5; opacity: 1; }

        .host-cam {
            position: absolute; bottom: 15px; right: 15px; width: 65px; height: 85px;
            background: rgba(0,0,0,0.8); border: 1.5px solid var(--neon);
            border-radius: 12px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 30;
        }
        .v-bar { width: 3px; background: var(--neon); height: 2px; transition: height 0.1s; margin: 0 1px; }

        .master-panel {
            flex: 0.7; padding: 15px 20px calc(env(safe-area-inset-bottom) + 15px);
            background: #0d1117; border-radius: 30px 30px 0 0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        input {
            background: rgba(255,255,255,0.1) !important;
            border: 1px solid var(--neon) !important;
            width: 100%; padding: 14px; border-radius: 15px;
            outline: none; color: #fff !important; font-size: 15px;
            font-family: 'JetBrains Mono', monospace;
        }

        .btn-dl {
            position: absolute; top: 15px; right: 15px; z-index: 50;
            background: rgba(0,0,0,0.5); border: 1px solid #fff;
            width: 38px; height: 38px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
        }

        #loader {
            position: fixed; inset: 0; background: #05070a;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; transition: opacity 0.5s;
        }
    </style>
</head>
<body onclick="initShow()">

    <div id="loader">
        <div class="sync text-cyan-400 text-3xl mb-2 italic">HIT VISUAL</div>
        <div class="text-[8px] mono text-white/30 tracking-[5px] mb-8 uppercase">Neural Turbo Broadcast</div>
        <button class="px-10 py-4 bg-cyan-400 text-black sync text-[11px] rounded-2xl animate-pulse uppercase">Эфир</button>
    </div>

    <div class="pt-10 pb-2 px-6 flex justify-between items-center">
        <div>
            <div class="text-[12px] sync text-white flex items-center gap-2">
                <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span> HIT VISUAL LIVE
            </div>
            <div class="text-[8px] mono text-white/30 mt-1 uppercase tracking-wider">Radio: Chillsynth 88.5</div>
        </div>
        <div id="mini-viz" class="flex items-end h-[12px]"></div>
    </div>

    <div class="viewport">
        <button class="btn-dl" onclick="downloadCurrent(event)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        </button>
        
        <!-- Слой для плавного перехода -->
        <img id="bg-cache" src="">
        <img id="main-img" src="">
        
        <div class="host-cam">
            <div class="text-[6px] font-bold text-cyan-400 mb-1">AI HOST</div>
            <div id="viz" class="flex items-end h-[20px]"></div>
        </div>
    </div>

    <div class="master-panel">
        <div id="ai-text" class="text-[11px] leading-relaxed text-white/90 italic mb-4 min-h-[34px] border-l-2 border-cyan-400 pl-3">
            Подключаюсь к нейросети... Пожалуйста, подождите.
        </div>

        <div class="flex gap-2">
            <input type="text" id="m-input" placeholder="Ваша идея для эфира...">
            <button onclick="masterGo()" class="bg-cyan-400 text-black px-5 rounded-15 font-black sync text-[10px] rounded-xl active:scale-90 transition-all">ПУСК</button>
        </div>
    </div>

    <audio id="radio" loop src="https://stream.nightride.fm/chillsynth.mp3"></audio>

<script>
    const vh = () => document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
    window.addEventListener('resize', vh); vh();
    vkBridge.send("VKWebAppInit");

    let isSpeaking = false, started = false;
    const radio = document.getElementById('radio');
    const mainImg = document.getElementById('main-img');
    const bgCache = document.getElementById('bg-cache');
    const aiLabel = document.getElementById('ai-text');

    function setupBars(id, n) {
        const c = document.getElementById(id);
        for(let i=0; i<n; i++) {
            const b = document.createElement('div'); b.className = 'v-bar'; c.appendChild(b);
        }
    }
    setupBars('viz', 5); setupBars('mini-viz', 4);

    setInterval(() => {
        const bars = document.getElementsByClassName('v-bar');
        for(let b of bars) b.style.height = (isSpeaking ? Math.random()*22 + 2 : 2) + 'px';
    }, 100);

    function initShow() {
        if(started) return;
        started = true;
        document.getElementById('loader').style.opacity = '0';
        setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
        
        radio.volume = 0.4; radio.play();
        
        // Разблокировка голоса
        if(window.speechSynthesis) window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
        
        runLive();
    }

    function aiSpeak(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(text);
        m.lang = 'ru-RU'; m.rate = 1.05;
        m.onstart = () => { isSpeaking = true; radio.volume = 0.08; };
        m.onend = () => { isSpeaking = false; radio.volume = 0.4; };
        window.speechSynthesis.speak(m);
    }

    const phrases = [
        "Посмотрите на этот кадр. Настоящая эстетика будущего.",
        "Нейросеть выдает потрясающий результат. Как вам такой визуал?",
        "Продолжаем наш бесконечный подкаст. В эфире новый арт.",
        "Это HIT VISUAL. Мы создаем цифровую реальность прямо сейчас.",
        "Мастер-система работает на полную мощность. Взгляните на детали."
    ];

    async function runLive() {
        const keywords = ["cyberpunk", "vaporwave", "future city", "neon art", "high-tech luxury"];
        const k = keywords[Math.floor(Math.random()*keywords.length)];
        
        // Ускоренная генерация: промпт короче, параметры легче
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(k + " hit visual style 4k")}?seed=${Math.random()}&nologo=true&width=800&height=1000`;
        
        const tempImg = new Image();
        tempImg.src = url;
        
        // Предзагрузка в фоне
        tempImg.onload = () => {
            // Когда новая картинка готова — меняем
            bgCache.src = mainImg.src; // Старую картинку — под низ
            mainImg.style.opacity = 0;
            
            setTimeout(() => {
                mainImg.src = url;
                mainImg.style.opacity = 1;
                
                const msg = phrases[Math.floor(Math.random()*phrases.length)];
                aiLabel.innerText = msg;
                aiSpeak(msg);
                
                // Следующая смена через 10 сек
                setTimeout(runLive, 10000);
            }, 500);
        };
    }

    function masterGo() {
        const val = document.getElementById('m-input').value;
        if(!val) return;
        
        aiSpeak("Мастер перехватывает поток. Внимание на экран.");
        mainImg.style.opacity = 0.4;
        
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(val + " high quality hit visual")}?seed=${Math.random()}&nologo=true&width=800&height=1000`;
        mainImg.src = url;
        mainImg.onload = () => {
            mainImg.style.opacity = 1;
            vkBridge.send("VKWebAppTapticNotificationOccurred", {"type": "success"});
        };
    }

    async function downloadCurrent(e) {
        e.stopPropagation();
        window.open(mainImg.src, '_blank');
    }
</script>
</body>
</html>
