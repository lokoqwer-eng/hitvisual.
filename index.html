<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HIT VISUAL LUXURY</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Montserrat:wght@400;600;700&display=swap');
        :root { --neon: #00e5ff; --pink: #ff007b; --bg: #05070a; }
        body { background: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; height: 100vh; overflow: hidden; margin: 0; }
        .sync { font-family: 'Syncopate', sans-serif; }
        
        /* Исправление: Красивые алерты вместо нативных */
        #custom-alert {
            display: none; position: fixed; top: 20px; left: 20px; right: 20px; 
            background: rgba(255, 0, 123, 0.9); backdrop-filter: blur(10px);
            padding: 15px; border-radius: 15px; z-index: 2000; text-align: center;
            font-size: 11px; font-weight: bold; text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(255, 0, 123, 0.3);
        }

        .art-viewport {
            flex: 1; margin: 15px; background: #000; border-radius: 30px;
            position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: center;
        }

        #main-img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s ease; }
        
        .loader-ring {
            width: 50px; height: 50px; border: 3px solid rgba(0, 229, 255, 0.1);
            border-top-color: var(--neon); border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .ui-panel {
            background: rgba(13, 17, 23, 0.95); backdrop-filter: blur(20px);
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
            border-radius: 35px 35px 0 0; border-top: 1px solid rgba(255,255,255,0.05);
        }

        input { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 15px; padding: 15px; width: 100%; outline: none; }
        .btn-gen { background: linear-gradient(135deg, var(--neon), #00a2ff); color: #000; font-weight: 800; border-radius: 15px; padding: 18px; width: 100%; }
        .btn-gen:disabled { filter: grayscale(1); opacity: 0.5; }
        
        .chip { padding: 8px 15px; background: rgba(255,255,255,0.05); border-radius: 12px; font-size: 10px; font-weight: 700; }
        .chip.active { background: var(--neon); color: #000; }
    </style>
</head>
<body>

    <div id="custom-alert" class="sync">Ошибка связи. Пробуем еще раз...</div>

    <div class="pt-10 px-6 flex justify-between items-center">
        <div class="sync text-[10px] tracking-[4px] text-cyan-400">HIT VISUAL LUXURY</div>
        <div id="status-dot" class="w-2 h-2 bg-green-500 rounded-full shadow-[0_0_8px_green]"></div>
    </div>

    <div class="art-viewport" id="viewport">
        <div id="loader" class="hidden flex flex-col items-center">
            <div class="loader-ring"></div>
            <div class="mt-4 text-[8px] sync opacity-40 tracking-[3px]">GENERATING</div>
        </div>
        <div id="idle-text" class="sync opacity-20 text-[9px] tracking-[5px] uppercase">Ready for Art</div>
        <img id="main-img" src="" alt="Result" onclick="this.parentElement.classList.toggle('fs')">
    </div>

    <div class="ui-panel">
        <div class="flex gap-2 overflow-x-auto mb-5 no-scrollbar">
            <button onclick="setFast('cyberpunk city')" class="chip active">CITY</button>
            <button onclick="setFast('cyberpunk girl')" class="chip">AVATAR</button>
            <button onclick="setFast('luxury car')" class="chip">CAR</button>
        </div>

        <input type="text" id="prompt-in" class="mb-5" placeholder="Опишите идею...">

        <div class="flex gap-4">
            <button id="gen-btn" onclick="startGeneration()" class="btn-gen sync text-[10px]">ПУСК</button>
            <button id="save-btn" onclick="saveArt()" class="btn-gen sync text-[10px] bg-none bg-white/10 text-white hidden">💾</button>
        </div>
    </div>

    <script>
        vkBridge.send("VKWebAppInit");

        let isWorking = false;
        let attempt = 0;

        function showAlert(msg, dur = 3000) {
            const a = document.getElementById('custom-alert');
            a.innerText = msg;
            a.style.display = 'block';
            setTimeout(() => { a.style.display = 'none'; }, dur);
        }

        function setFast(p) {
            document.getElementById('prompt-in').value = p;
        }

        async function startGeneration() {
            if (isWorking) return;
            const prompt = document.getElementById('prompt-in').value;
            if (!prompt) return showAlert("Введите промпт!");

            isWorking = true;
            attempt = 0;
            updateUI(true);
            generate(prompt);
        }

        function updateUI(loading) {
            const btn = document.getElementById('gen-btn');
            const loader = document.getElementById('loader');
            const idle = document.getElementById('idle-text');
            const img = document.getElementById('main-img');
            const dot = document.getElementById('status-dot');

            btn.disabled = loading;
            btn.innerText = loading ? "ОЖИДАНИЕ..." : "ПУСК";
            dot.className = loading ? "w-2 h-2 bg-yellow-500 animate-pulse" : "w-2 h-2 bg-green-500";
            
            if (loading) {
                loader.classList.remove('hidden');
                idle.classList.add('hidden');
                img.style.opacity = "0";
            } else {
                loader.classList.add('hidden');
                img.style.opacity = "1";
            }
        }

        function generate(prompt) {
            attempt++;
            const seed = Math.floor(Math.random() * 1000000);
            // Добавляем уникальный параметр time, чтобы браузер не брал картинку из кэша ошибок
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed}&width=1024&height=1024&nologo=true&t=${Date.now()}`;

            const img = new Image();
            img.crossOrigin = "anonymous";
            
            // Тайм-аут на 15 секунд
            const timer = setTimeout(() => {
                if (attempt < 2) {
                    showAlert("СЕРВЕР ЗАНЯТ. ПОВТОР...");
                    generate(prompt);
                } else {
                    fail();
                }
            }, 15000);

            img.onload = () => {
                clearTimeout(timer);
                document.getElementById('main-img').src = img.src;
                document.getElementById('save-btn').classList.remove('hidden');
                isWorking = false;
                updateUI(false);
                vkBridge.send("VKWebAppTapticNotificationOccurred", {"type": "success"});
            };

            img.onerror = () => {
                clearTimeout(timer);
                if (attempt < 2) {
                    generate(prompt);
                } else {
                    fail();
                }
            };

            img.src = url;
        }

        function fail() {
            isWorking = false;
            updateUI(false);
            showAlert("ОШИБКА ИИ. ПОПРОБУЙТЕ ПОЗЖЕ");
            document.getElementById('idle-text').classList.remove('hidden');
        }

        function saveArt() {
            const src = document.getElementById('main-img').src;
            if (src) vkBridge.send("VKWebAppShowImages", { images: [src] });
        }
    </script>
</body>
</html>
