
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <title>HIT VISUAL LUXURY ULTIMATE</title>
    
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Montserrat:wght@400;600;700&display=swap');
        
        :root {
            --neon: #00e5ff;
            --pink: #ff007b;
            --bg: #ffffff;
            --text: #0f172a;
            --card: rgba(255, 255, 255, 0.98);
        }

        body.dark {
            --bg: #0f172a;
            --text: #f8fafc;
            --card: rgba(15, 23, 42, 0.98);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        .sync { font-family: 'Syncopate', sans-serif; }

        .glow-title {
            font-size: 10px;
            letter-spacing: 0.5em;
            background: linear-gradient(90deg, var(--neon), var(--pink), #7000ff, var(--neon));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow 4s linear infinite;
        }
        @keyframes rainbow { to { background-position: 200% center; } }

        .art-viewport {
            flex: 1;
            margin: 12px;
            background: #000;
            border-radius: 28px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
        }

        #main-img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: none;
        }

        .art-viewport.fs {
            position: fixed; inset: 0; margin: 0; z-index: 100; border-radius: 0;
        }
        .art-viewport.fs #main-img { object-fit: contain; }

        .ui-panel {
            background: var(--card);
            backdrop-filter: blur(20px);
            padding: 15px 15px calc(20px + env(safe-area-inset-bottom));
            border-radius: 32px 32px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
            z-index: 50;
        }

        .chip {
            padding: 8px 14px;
            background: rgba(0,0,0,0.05);
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
            transition: 0.2s;
        }
        body.dark .chip { background: rgba(255,255,255,0.1); }
        .chip.active { background: var(--text); color: var(--bg); }

        .btn {
            width: 100%; padding: 16px; border-radius: 18px;
            font-family: 'Syncopate', sans-serif; font-size: 10px;
            font-weight: 700; transition: 0.3s;
        }
        .btn-primary { background: var(--text); color: var(--bg); }
        
        .history-scroll {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px;
            scrollbar-width: none;
        }
        .history-scroll::-webkit-scrollbar { display: none; }
        .history-thumb {
            width: 54px; height: 54px; border-radius: 12px; flex-shrink: 0;
            object-fit: cover; border: 2px solid transparent; cursor: pointer;
        }

        #achievement {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: var(--text); color: var(--bg);
            padding: 12px 24px; border-radius: 50px; font-size: 12px;
            font-weight: 700; z-index: 200; transition: top 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        #editor {
            position: fixed; inset: 0; background: #000; z-index: 150;
            display: none; flex-direction: column; padding: 20px;
        }

        /* Модалка рекламы */
        #ad-modal {
            display: none;
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000;
            align-items: center; justify-content: center; padding: 20px;
        }
    </style>
</head>
<body class="dark">

    <div id="achievement" class="sync">🏆 ДОСТИЖЕНИЕ!</div>

    <!-- Рекламное окно -->
    <div id="ad-modal">
        <div class="bg-white dark:bg-slate-900 rounded-[40px] p-8 max-w-sm w-full text-center relative overflow-hidden">
            <button onclick="closeAd(false)" class="absolute top-6 right-6 text-2xl opacity-30">✕</button>
            <div class="text-6xl mb-6">🎬</div>
            <h3 class="sync text-[12px] mb-4 tracking-tighter">ЛИМИТ ИСЧЕРПАН</h3>
            <p class="text-sm opacity-60 mb-8 leading-relaxed">Посмотрите короткую рекламу, чтобы разблокировать следующую генерацию</p>
            <button id="ad-watch-btn" class="w-full py-5 bg-black dark:bg-white text-white dark:text-black rounded-2xl font-bold sync text-[10px] tracking-widest disabled:opacity-50">
                СМОТРЕТЬ (15 СЕК)
            </button>
            <div id="ad-timer" class="mt-4 text-[10px] opacity-40 font-bold uppercase tracking-widest hidden">
                ОСТАЛОСЬ <span id="ad-sec">15</span> СЕК
            </div>
        </div>
    </div>

    <!-- Шапка -->
    <div class="pt-10 pb-2 px-6 flex justify-between items-center">
        <div class="glow-title sync uppercase">HIT VISUAL LUXURY</div>
        <button onclick="toggleTheme()" id="theme-btn" class="text-xl">☀️</button>
    </div>

    <div class="art-viewport" id="viewport" onclick="toggleFS()">
        <div id="loader" class="hidden flex-col items-center">
            <div class="w-12 h-12 border-4 border-cyan-500/20 border-t-cyan-500 rounded-full animate-spin"></div>
            <div class="mt-4 text-[8px] tracking-[4px] text-white/40 font-bold sync">RENDERING...</div>
        </div>
        <div id="idle" class="sync opacity-20 text-[9px] tracking-widest text-white text-center px-10">
            ОПИШИТЕ ИДЕЮ
        </div>
        <img id="main-img" src="" alt="AI Art">
    </div>

    <div class="ui-panel">
        <!-- Лимиты -->
        <div class="flex justify-between items-center mb-4 px-1">
            <span class="text-[9px] font-bold uppercase opacity-40 sync tracking-widest">Сегодня</span>
            <span id="limit-badge" class="chip !py-1 !px-3 bg-cyan-500/10 text-cyan-500 border border-cyan-500/20">✨ 4 БЕСПЛАТНО</span>
        </div>

        <div class="flex gap-2 overflow-x-auto mb-4 no-scrollbar">
            <button onclick="loadTemplate('cyber')" class="chip">🌃 КИБЕРПАНК</button>
            <button onclick="loadTemplate('fantasy')" class="chip">🐉 ФЭНТЕЗИ</button>
            <button onclick="loadTemplate('photo')" class="chip">📸 ПОРТРЕТ</button>
            <button onclick="loadTemplate('anime')" class="chip">🌸 АНИМЕ</button>
        </div>

        <div class="space-y-3 mb-4">
            <div class="bg-black/5 dark:bg-white/5 rounded-2xl p-4 border border-black/10 dark:border-white/10">
                <input type="text" id="prompt-in" class="w-full bg-transparent outline-none text-[15px]" placeholder="Что нарисовать?">
            </div>
            <div class="bg-red-500/5 rounded-xl p-3 border border-red-500/20">
                <input type="text" id="negative-in" class="w-full bg-transparent outline-none text-[12px] text-red-400" placeholder="❌ Исключить...">
            </div>
        </div>

        <div class="flex gap-2 mb-4">
            <button onclick="setRatio('1:1', this)" class="chip ratio-btn active">1:1</button>
            <button onclick="setRatio('9:16', this)" class="chip ratio-btn">9:16</button>
            <button onclick="setRatio('16:9', this)" class="chip ratio-btn">16:9</button>
        </div>

        <div class="history-scroll" id="history-box"></div>

        <div class="grid grid-cols-2 gap-3">
            <button id="gen-btn" onclick="handleGenerate()" class="btn btn-primary">СОЗДАТЬ</button>
            <div class="flex gap-2">
                <button id="upscale-btn" onclick="handleGenerate(true)" class="btn bg-cyan-500/10 text-cyan-500 border border-cyan-500/20 hidden">2X</button>
                <button id="edit-btn" onclick="openEditor()" class="btn bg-purple-500/10 text-purple-500 border border-purple-500/20 hidden">EDIT</button>
            </div>
        </div>
        <button id="save-btn" onclick="downloadArt()" class="btn border border-black/10 dark:border-white/10 mt-3 hidden uppercase">СОХРАНИТЬ</button>
    </div>

    <!-- Редактор -->
    <div id="editor">
        <div class="flex justify-between items-center mb-6">
            <h2 class="sync text-white text-[10px]">PHOTO EDITOR</h2>
            <button onclick="closeEditor()" class="text-white text-2xl">✕</button>
        </div>
        <div class="flex-1 flex items-center justify-center overflow-hidden rounded-2xl bg-white/5">
            <canvas id="edit-canvas" class="max-w-full max-h-full object-contain"></canvas>
        </div>
        <div class="mt-6 grid grid-cols-4 gap-2">
            <button onclick="applyFilter('none')" class="chip text-white bg-white/10">ORIGIN</button>
            <button onclick="applyFilter('grayscale(100%)')" class="chip text-white bg-white/10">B&W</button>
            <button onclick="applyFilter('sepia(80%)')" class="chip text-white bg-white/10">SEPIA</button>
            <button onclick="applyFilter('saturate(180%)')" class="chip text-white bg-white/10">VIVID</button>
        </div>
        <button onclick="saveEdited()" class="btn btn-primary mt-6">СКАЧАТЬ ОТРЕДАКТИРОВАННОЕ</button>
    </div>

    <script>
        vkBridge.send("VKWebAppInit");

        // --- СИСТЕМА МОНЕТИЗАЦИИ ---
        const DAILY_LIMIT = 4;
        let genCount = parseInt(localStorage.getItem('hit_gen_count')) || 0;
        let lastDate = localStorage.getItem('hit_gen_date') || '';
        let adCallback = null;

        function checkReset() {
            const now = new Date().toDateString();
            if(lastDate !== now) {
                genCount = 0;
                lastDate = now;
                localStorage.setItem('hit_gen_count', '0');
                localStorage.setItem('hit_gen_date', now);
            }
            updateLimitBadge();
        }

        function updateLimitBadge() {
            const rem = Math.max(0, DAILY_LIMIT - genCount);
            const badge = document.getElementById('limit-badge');
            badge.innerText = rem > 0 ? `✨ ${rem} БЕСПЛАТНО` : `🎬 ПОСЛЕ РЕКЛАМЫ`;
            if(rem === 0) badge.classList.add('animate-pulse');
            else badge.classList.remove('animate-pulse');
        }

        function showAd(callback) {
            adCallback = callback;
            const modal = document.getElementById('ad-modal');
            const watchBtn = document.getElementById('ad-watch-btn');
            const timer = document.getElementById('ad-timer');
            const sec = document.getElementById('ad-sec');
            
            modal.style.display = 'flex';
            watchBtn.disabled = true;
            timer.classList.remove('hidden');
            
            let left = 15;
            sec.innerText = left;
            
            const itv = setInterval(() => {
                left--;
                sec.innerText = left;
                if(left <= 0) {
                    clearInterval(itv);
                    watchBtn.disabled = false;
                    watchBtn.innerText = "ПРОДОЛЖИТЬ ✨";
                    watchBtn.onclick = () => { closeAd(true); };
                }
            }, 1000);
        }

        function closeAd(success) {
            document.getElementById('ad-modal').style.display = 'none';
            if(adCallback) adCallback(success);
            adCallback = null;
        }

        // --- ЛОГИКА ПРИЛОЖЕНИЯ ---
        const img = document.getElementById('main-img');
        const promptIn = document.getElementById('prompt-in');
        const negIn = document.getElementById('negative-in');
        const historyBox = document.getElementById('history-box');
        const viewport = document.getElementById('viewport');
        const genBtn = document.getElementById('gen-btn');
        
        let history = JSON.parse(localStorage.getItem('hit_history')) || [];
        let curW = 1024, curH = 1024;

        async function handleGenerate(isUpscale = false) {
            checkReset();
            
            if(genCount >= DAILY_LIMIT) {
                showAd((ok) => { if(ok) runGen(isUpscale); });
            } else {
                runGen(isUpscale);
            }
        }

        async function runGen(isUpscale) {
            const p = promptIn.value;
            if(!p) return;

            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('idle').classList.add('hidden');
            img.style.display = 'none';
            genBtn.disabled = true;
            genBtn.innerText = "РИСУЕМ...";

            const seed = Math.floor(Math.random()*9999999);
            const w = isUpscale ? curW * 1.5 : curW;
            const h = isUpscale ? curH * 1.5 : curH;
            const finalP = negIn.value ? `${p} --no ${negIn.value}` : p;
            
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(finalP)}?seed=${seed}&width=${Math.round(w)}&height=${Math.round(h)}&nologo=true&model=flux&enhance=true`;

            const t = new Image();
            t.crossOrigin = "anonymous";
            t.src = url;
            t.onload = () => {
                img.src = url;
                img.style.display = 'block';
                document.getElementById('loader').classList.add('hidden');
                genBtn.disabled = false;
                genBtn.innerText = "СОЗДАТЬ";
                
                document.getElementById('upscale-btn').classList.remove('hidden');
                document.getElementById('edit-btn').classList.remove('hidden');
                document.getElementById('save-btn').classList.remove('hidden');

                addToHistory(url);
                genCount++;
                localStorage.setItem('hit_gen_count', genCount);
                updateLimitBadge();
                vkBridge.send("VKWebAppTapticNotificationOccurred", {"type": "success"});
            };
        }

        // Вспомогательные функции (Theme, Ratio, History, Editor, Download) - Сохранены из прошлой версии
        function toggleTheme() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            document.getElementById('theme-btn').innerText = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function setRatio(r, btn) {
            document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            viewport.style.height = 'auto';
            if(r === '1:1') { curW=1024; curH=1024; viewport.style.aspectRatio = "1/1"; }
            if(r === '9:16') { curW=768; curH=1344; viewport.style.aspectRatio = "9/16"; }
            if(r === '16:9') { curW=1216; curH=688; viewport.style.aspectRatio = "16/9"; }
            setTimeout(() => viewport.style.height = '', 100);
        }

        function loadTemplate(type) {
            const temps = {
                cyber: "киберпанк город, неоны, 8k",
                fantasy: "фэнтези мир, дракон, магия",
                photo: "портрет девушки, студийный свет",
                anime: "аниме арт, яркие цвета"
            };
            promptIn.value = temps[type];
            promptIn.focus();
        }

        function addToHistory(url) {
            if(history.includes(url)) return;
            history.unshift(url);
            if(history.length > 10) history.pop();
            localStorage.setItem('hit_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            historyBox.innerHTML = history.map(url => `
                <img src="${url}" class="history-thumb" onclick="loadFromHistory('${url}')">
            `).join('');
        }

        function loadFromHistory(url) {
            img.src = url;
            img.style.display = 'block';
            document.getElementById('idle').classList.add('hidden');
            document.getElementById('save-btn').classList.remove('hidden');
        }

        async function downloadArt() {
            vkBridge.send("VKWebAppShowImages", { images: [img.src] });
        }

        function openEditor() {
            const canvas = document.getElementById('edit-canvas');
            const ctx = canvas.getContext('2d');
            document.getElementById('editor').style.display = 'flex';
            const t = new Image(); t.crossOrigin = "anonymous"; t.src = img.src;
            t.onload = () => { canvas.width = t.width; canvas.height = t.height; ctx.drawImage(t, 0, 0); };
        }

        function applyFilter(f) {
            const canvas = document.getElementById('edit-canvas');
            const ctx = canvas.getContext('2d');
            const t = new Image(); t.crossOrigin = "anonymous"; t.src = img.src;
            t.onload = () => { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.filter = f; ctx.drawImage(t,0,0); };
        }

        function closeEditor() { document.getElementById('editor').style.display = 'none'; }
        function toggleFS() { if(img.src) viewport.classList.toggle('fs'); }
        
        window.onload = () => { checkReset(); renderHistory(); if(localStorage.getItem('theme') === 'light') toggleTheme(); };
    </script>
</body>
</html>
