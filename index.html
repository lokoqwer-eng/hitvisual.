<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HIT VISUAL | AI LIVE SYSTEM</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=JetBrains+Mono&display=swap');
        
        :root { --neon: #00f2ff; --bg: #05070a; --vh: 1vh; }

        html, body {
            height: 100vh; height: calc(var(--vh, 1vh) * 100);
            margin: 0; padding: 0; background: var(--bg);
            overflow: hidden; display: flex; flex-direction: column;
            color: #fff; font-family: 'Unbounded', sans-serif;
        }

        .sync { font-family: 'Unbounded', sans-serif; font-weight: 900; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        .viewport {
            flex: 1; margin: 10px; background: #000; border-radius: 24px;
            position: relative; overflow: hidden; border: 1px solid rgba(0, 242, 255, 0.25);
            display: flex; align-items: center; justify-content: center;
        }

        #main-img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.8s ease; opacity: 0; }

        .host-cam {
            position: absolute; bottom: 15px; right: 15px; width: 65px; height: 85px;
            background: rgba(0,0,0,0.85); border: 1.5px solid var(--neon);
            border-radius: 12px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 30;
        }
        .v-bar { width: 3px; background: var(--neon); height: 2px; transition: height 0.1s; margin: 0 1px; }

        .master-panel {
            padding: 20px 20px calc(env(safe-area-inset-bottom) + 15px);
            background: #0d1117; border-radius: 30px 30px 0 0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        input {
            background: rgba(255,255,255,0.08) !important;
            border: 1px solid var(--neon) !important;
            width: 100%; padding: 14px; border-radius: 16px;
            outline: none; color: #ffffff !important; font-size: 15px;
            font-family: 'JetBrains Mono', monospace;
        }

        .btn-download {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0,0,0,0.6); border: 1px solid #fff;
            color: #fff; width: 35px; height: 35px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            z-index: 40; backdrop-filter: blur(5px);
        }

        #loader {
            position: fixed; inset: 0; background: #05070a;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; transition: opacity 0.5s;
        }
    </style>
</head>
<body onclick="startShow()">

    <div id="loader">
        <div class="sync text-cyan-400 text-3xl mb-2">HIT VISUAL</div>
        <div class="text-[9px] mono text-white/30 tracking-[4px] mb-8 uppercase">Neural Broadcast Master</div>
        <div class="px-8 py-4 bg-cyan-400 text-black sync text-[11px] rounded-2xl animate-pulse">ПОДКЛЮЧИТЬСЯ</div>
    </div>

    <!-- Header -->
    <div class="pt-10 pb-2 px-6 flex justify-between items-center">
        <div>
            <div class="text-[14px] sync text-white">HIT VISUAL</div>
            <div class="flex items-center gap-2 mt-1">
                <div class="w-1.5 h-1.5 bg-red-600 rounded-full animate-ping"></div>
                <div id="radio-label" class="text-[8px] mono text-white/40 uppercase">Radio: Ready</div>
            </div>
        </div>
        <div id="top-viz" class="flex items-end h-[14px]"></div>
    </div>

    <!-- Viewport -->
    <div class="viewport">
        <button class="btn-download" onclick="downloadImage(event)" title="Скачать фото">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        </button>
        
        <img id="main-img" src="">
        
        <div id="spinner" class="absolute hidden">
            <div class="w-10 h-10 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
        </div>

        <div class="host-cam">
            <div class="text-[6px] font-bold text-cyan-400 mb-2 uppercase">AI Host</div>
            <div class="flex items-end h-[20px]" id="viz"></div>
        </div>
    </div>

    <!-- Master UI -->
    <div class="master-panel">
        <div id="ai-text" class="text-[11px] leading-relaxed text-white/80 italic mb-4 min-h-[30px] border-l-2 border-cyan-500 pl-3">
            Система готова к эфиру...
        </div>

        <div class="flex gap-2">
            <input type="text" id="master-input" placeholder="Введите ваш промпт...">
            <button onclick="masterAction()" class="bg-cyan-400 text-black px-4 rounded-16 font-black sync text-[10px] whitespace-nowrap rounded-xl">
                ПУСК
            </button>
        </div>
        <div class="mt-2 text-[7px] mono text-white/20 uppercase tracking-widest text-center">Master Console v5.2</div>
    </div>

    <audio id="audio-stream" loop src="https://stream.nightride.fm/chillsynth.mp3"></audio>

<script>
    const vh = () => document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
    window.addEventListener('resize', vh); vh();

    vkBridge.send("VKWebAppInit");

    let isSpeaking = false;
    let started = false;
    const radio = document.getElementById('audio-stream');
    const mainImg = document.getElementById('main-img');
    const aiLabel = document.getElementById('ai-text');

    // Визуализация голоса
    function addBars(id, count) {
        const c = document.getElementById(id);
        for(let i=0; i<count; i++) {
            const b = document.createElement('div'); b.className = 'v-bar'; c.appendChild(b);
        }
    }
    addBars('viz', 6); addBars('top-viz', 4);

    setInterval(() => {
        const bars = document.getElementsByClassName('v-bar');
        for(let b of bars) b.style.height = (isSpeaking ? Math.random()*22 + 2 : 2) + 'px';
    }, 100);

    // СТАРТ
    function startShow() {
        if(started) return;
        started = true;
        
        document.getElementById('loader').style.opacity = '0';
        setTimeout(() => document.getElementById('loader').style.display = 'none', 500);

        // Разблокировка голоса и аудио
        radio.volume = 0.5;
        radio.play();
        document.getElementById('radio-label').innerText = "Radio: Chillsynth LIVE";

        // Критическая разблокировка TTS для ВК
        if (window.speechSynthesis) {
            const s = new SpeechSynthesisUtterance("");
            window.speechSynthesis.speak(s);
        }

        runAutoCycle();
    }

    function setRadioVol(v) {
        const curr = radio.volume;
        const steps = 10;
        const diff = v - curr;
        let step = 0;
        const int = setInterval(() => {
            step++;
            radio.volume = curr + (diff * (step/steps));
            if(step >= steps) clearInterval(int);
        }, 50);
    }

    function aiSpeak(text) {
        if (!window.speechSynthesis) {
            aiLabel.innerText = "📝 " + text;
            return;
        }
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(text);
        m.lang = 'ru-RU';
        
        m.onstart = () => { isSpeaking = true; setRadioVol(0.1); };
        m.onend = () => { isSpeaking = false; setRadioVol(0.5); };
        m.onerror = () => { isSpeaking = false; setRadioVol(0.5); };
        
        window.speechSynthesis.speak(m);
    }

    async function runAutoCycle() {
        const tags = ["cyberpunk city", "neon girl", "space station", "retro car", "digital art"];
        const tag = tags[Math.floor(Math.random()*tags.length)];
        
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(tag + " luxury hit visual")}?seed=${Math.random()}&nologo=true&width=1024&height=1280`;
        
        document.getElementById('spinner').classList.remove('hidden');
        mainImg.src = url;
        mainImg.onload = () => {
            document.getElementById('spinner').classList.add('hidden');
            mainImg.style.opacity = 1;
            const msg = `Сгенерирован новый объект: ${tag}. Система работает в штатном режиме.`;
            aiLabel.innerText = msg;
            aiSpeak(msg);
            
            setTimeout(() => {
                mainImg.style.opacity = 0;
                setTimeout(runAutoCycle, 1500);
            }, 12000);
        };
    }

    function masterAction() {
        const val = document.getElementById('master-input').value;
        if(!val) return;
        
        aiSpeak("Мастер меняет поток. Генерирую ваш запрос.");
        document.getElementById('spinner').classList.remove('hidden');
        mainImg.style.opacity = 0.3;
        
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(val + " high quality hit visual")}?seed=${Math.random()}&nologo=true&width=1024&height=1280`;
        mainImg.src = url;
        mainImg.onload = () => {
            document.getElementById('spinner').classList.add('hidden');
            mainImg.style.opacity = 1;
            vkBridge.send("VKWebAppTapticNotificationOccurred", {"type": "success"});
        };
    }

    // РАБОЧАЯ ФУНКЦИЯ СКАЧИВАНИЯ
    async function downloadImage(e) {
        e.stopPropagation();
        const currentUrl = mainImg.src;
        if(!currentUrl) return;

        try {
            const response = await fetch(currentUrl);
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `HIT_VISUAL_${Date.now()}.png`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            
            vkBridge.send("VKWebAppShowNativeAds", {ad_format:"interstitial"}); // Бонус: можно показать рекламу при скачивании
        } catch (err) {
            // Если прямой блоб не сработал (CORS), открываем в новом окне
            window.open(currentUrl, '_blank');
        }
    }
</script>
</body>
</html>
