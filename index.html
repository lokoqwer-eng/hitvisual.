<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HIT VISUAL LUX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&display=swap');
        
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .unbounded { font-family: 'Unbounded', sans-serif; }

        .header {
            padding: 30px 0 15px;
            text-align: center;
        }

        .canvas-container {
            flex: 1;
            margin: 0 25px;
            background: linear-gradient(145deg, #0f0f0f, #050505);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        #result-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .ui-panel {
            background: #0a0a0a;
            padding: 30px 25px calc(30px + env(safe-area-inset-bottom));
            border-radius: 45px 45px 0 0;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .input-box {
            background: rgba(255,255,255,0.03);
            border-radius: 24px;
            padding: 20px 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .input-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 16px;
        }

        .btn-generate {
            background: #ffffff;
            color: #000;
            width: 100%;
            padding: 22px;
            border-radius: 24px;
            font-weight: 900;
            text-transform: uppercase;
            font-family: 'Unbounded';
            letter-spacing: 1px;
            font-size: 14px;
            box-shadow: 0 10px 30px rgba(255,255,255,0.1);
        }

        .loader {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255,255,255,0.05);
            border-top-color: #00f2ff;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .status-text {
            font-family: 'Unbounded';
            font-size: 11px;
            letter-spacing: 4px;
            opacity: 0.15;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="unbounded text-[10px] tracking-[0.6em] opacity-30">HIT VISUAL LUX • V10</div>
    </div>

    <div class="canvas-container">
        <div class="loader" id="loader"></div>
        <div id="status" class="status-text">Ready to Create</div>
        <img id="result-image" src="" alt="Результат">
    </div>

    <div class="ui-panel">
        <div class="input-box">
            <input type="text" id="prompt-input" placeholder="Опишите ваш замысел...">
        </div>
        <button id="main-button" onclick="handleGeneration()" class="btn-generate">Сгенерировать</button>
    </div>

    <script>
        const apiKey = ""; // Ключ для работы на внешних сайтах

        async function handleGeneration() {
            const promptInput = document.getElementById('prompt-input');
            const prompt = promptInput.value;
            if (!prompt) return;

            const loader = document.getElementById('loader');
            const status = document.getElementById('status');
            const img = document.getElementById('result-image');
            const btn = document.getElementById('main-button');

            loader.style.display = 'block';
            status.style.display = 'none';
            img.style.display = 'none';
            btn.innerText = "Генерация...";
            btn.disabled = true;

            try {
                // Используем Imagen 4.0
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        instances: [{ prompt: prompt }],
                        parameters: { sampleCount: 1 }
                    })
                });

                if (!response.ok) throw new Error('Ошибка сети');

                const data = await response.json();
                
                if (data.predictions && data.predictions[0]) {
                    img.src = `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
                    img.style.display = 'block';
                    loader.style.display = 'none';
                }
            } catch (error) {
                status.innerText = "Ошибка ИИ";
                status.style.display = 'block';
                loader.style.display = 'none';
            } finally {
                btn.innerText = "Сгенерировать";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
