<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI VTuber Stream LIVE</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        
        body { 
            background: #050505; color: #fff; font-family: 'Montserrat', sans-serif; 
            margin: 0; overflow: hidden; height: 100vh;
        }

        /* ДИНАМИЧЕСКИЙ ФОН */
        #main-bg {
            position: fixed; inset: 0;
            background-color: #1a1a2e;
            background-image: url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=1200');
            background-size: cover; background-position: center;
            filter: brightness(0.4) blur(2px); z-index: 1;
        }

        /* АВАТАР */
        .character-zone {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px; height: 85%;
            z-index: 10; display: flex; align-items: flex-end; justify-content: center;
            pointer-events: none;
        }

        #avatar-img {
            height: 100%; object-fit: contain;
            animation: idle 4s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(0,242,255,0.3));
        }

        @keyframes idle {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.01); }
        }

        .speaking #avatar-img {
            animation: talk-vibe 0.2s infinite alternate;
        }
        @keyframes talk-vibe {
            from { transform: scale(1.01); filter: drop-shadow(0 0 30px rgba(255,0,122,0.5)); }
            to { transform: scale(1.03); filter: drop-shadow(0 0 40px rgba(255,0,122,0.7)); }
        }

        /* ИНТЕРФЕЙС */
        .overlay { position: absolute; inset: 0; z-index: 100; padding: 15px; pointer-events: none; display: flex; flex-direction: column; }
        .glass-ui { 
            background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); 
            border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; 
            pointer-events: auto;
        }

        #stream-chat {
            position: absolute; top: 90px; right: 15px; width: 250px;
            max-height: 280px; overflow-y: auto; display: flex;
            flex-direction: column; gap: 8px; scrollbar-width: none;
        }

        .bubble {
            font-size: 11px; padding: 10px; border-radius: 14px;
            background: rgba(20,20,30,0.8); border-left: 3px solid #ff007a;
            animation: pop-in 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        @keyframes pop-in { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        #start-gate {
            position: fixed; inset: 0; background: #000; z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.5s;
        }
    </style>
</head>
<body>

    <div id="start-gate" onclick="initFullStream()">
        <div class="relative">
            <div class="w-24 h-24 border-2 border-pink-500 rounded-full animate-ping absolute"></div>
            <div class="w-24 h-24 border-4 border-pink-500 rounded-full flex items-center justify-center relative bg-black">
                <div class="w-0 h-0 border-t-[10px] border-t-transparent border-l-[18px] border-l-pink-500 border-b-[10px] border-b-transparent ml-2"></div>
            </div>
        </div>
        <p class="mt-8 text-white font-bold tracking-[5px] uppercase text-xs">Запустить поток</p>
    </div>

    <div id="main-bg"></div>
    
    <div class="character-zone" id="rig">
        <!-- Попытка загрузить аватар пользователя с фоллбэком -->
        <img id="avatar-img" 
             src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=600&h=900&fit=crop" 
             onerror="this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=Lucky'">
    </div>

    <div class="overlay">
        <div class="flex justify-between items-start pointer-events-auto">
            <div class="flex flex-col gap-2">
                <div class="flex items-center gap-2">
                    <span class="bg-red-600 px-3 py-1 rounded-full text-[10px] font-black uppercase shadow-lg shadow-red-600/30">Live</span>
                    <span class="glass-ui px-3 py-1 text-[11px] font-bold" id="clock">00:00:00</span>
                </div>
                <div class="text-[9px] text-pink-500 font-black uppercase tracking-tighter" id="net-status">Соединение: Отличное</div>
            </div>
            <div class="glass-ui p-3 text-right">
                <div class="text-[8px] text-white/40 uppercase font-bold tracking-widest">Зрители</div>
                <div class="text-lg font-black text-white" id="viewers">4,912</div>
            </div>
        </div>

        <div id="stream-chat" class="pointer-events-none"></div>

        <div class="mt-auto flex flex-col gap-4 pointer-events-auto">
            <div class="glass-ui p-4 flex items-center gap-4 border-l-4 border-l-cyan-400">
                <div class="w-10 h-10 bg-cyan-400/20 rounded-full flex items-center justify-center">
                    <svg class="w-5 h-5 text-cyan-400 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>
                </div>
                <div class="flex-1 overflow-hidden">
                    <div class="text-[8px] text-white/30 uppercase font-bold">Текущий трек</div>
                    <div class="text-[11px] font-bold truncate text-cyan-300">Synthwave Night City FM</div>
                </div>
                <button onclick="nextStation()" class="bg-white/5 p-2 rounded-xl hover:bg-white/10">
                    <svg class="w-6 h-6" fill="white" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
            <div class="flex gap-2">
                <input id="msg-input" type="text" class="glass-ui flex-1 bg-transparent border-none outline-none px-6 py-4 text-sm placeholder:text-white/20" placeholder="Напиши своей Тян...">
                <button onclick="handleUserChat()" class="bg-pink-600 text-white px-8 py-4 rounded-2xl font-black text-[11px] uppercase active:scale-95 transition-all shadow-lg shadow-pink-600/40">Чат</button>
            </div>
        </div>
    </div>

    <audio id="player" loop crossorigin="anonymous"></audio>

    <script>
        const chatContainer = document.getElementById('stream-chat');
        const msgInput = document.getElementById('msg-input');
        const musicPlayer = document.getElementById('player');
        const rig = document.getElementById('rig');
        
        let isSpeaking = false;
        let lastBrainUpdate = Date.now();
        const stations = ["https://stream.zeno.fm/0r0xa792kwzuv", "https://stream.zeno.fm/f9scrt81638uv"];
        let currentStation = 0;

        async function initFullStream() {
            document.getElementById('start-gate').style.opacity = '0';
            setTimeout(() => document.getElementById('start-gate').style.display = 'none', 500);
            
            // Разблокировка звука
            if (window.speechSynthesis) {
                const unlock = new SpeechSynthesisUtterance("");
                window.speechSynthesis.speak(unlock);
            }

            // VK Bridge
            if (window.vkBridge) {
                try {
                    await vkBridge.send("VKWebAppInit");
                    vkBridge.send("VKWebAppTapticNotificationOccurred", {type: "success"}).catch(()=>{});
                } catch(e) { console.warn("VK Bridge Init Skip"); }
            }
            
            nextStation(0);
            runUptime();
            postToChat("System", "🔴 Прямой эфир начался! Всем привет!", "text-cyan-400");
            
            // Циклы жизни ИИ
            setInterval(aiBrainCycle, 15000); 
            setInterval(simulateFans, 10000);
        }

        function nextStation(idx = -1) {
            currentStation = idx === -1 ? (currentStation + 1) % stations.length : idx;
            musicPlayer.src = stations[currentStation];
            musicPlayer.play().catch(() => {});
            musicPlayer.volume = 0.15;
        }

        function postToChat(user, text, color = "text-white/70") {
            const div = document.createElement('div');
            div.className = 'bubble';
            div.innerHTML = `<b class="${color} mr-2">${user}:</b> ${text}`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            if(chatContainer.children.length > 12) chatContainer.removeChild(chatContainer.firstChild);
        }

        async function requestAI(prompt, isPassive = false) {
            if(isSpeaking && isPassive) return;
            
            const context = "Ты - милая, слегка дерзкая VTuber Тян. Ты сейчас ведешь стрим. Отвечай максимально коротко (до 8-10 слов). Используй эмодзи. Если ты говоришь сама, то прокомментируй стрим или музыку.";
            
            try {
                // Используем Pollinations - самый надежный бесплатный API для таких задач
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?system=${encodeURIComponent(context)}&seed=${Math.random()}`);
                const reply = await res.text();
                
                if (reply) {
                    postToChat("Тян ✨", reply, "text-pink-500 font-bold");
                    speakText(reply);
                    lastBrainUpdate = Date.now();
                }
            } catch(e) {
                if(!isPassive) postToChat("System", "📡 Проблемы со связью в нейросети...", "text-red-400");
            }
        }

        function speakText(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'ru-RU';
            msg.pitch = 1.3;
            msg.rate = 1.1;
            
            msg.onstart = () => { isSpeaking = true; rig.classList.add('speaking'); };
            msg.onend = () => { isSpeaking = false; rig.classList.remove('speaking'); };
            window.speechSynthesis.speak(msg);
        }

        function handleUserChat() {
            const val = msgInput.value.trim();
            if(!val) return;
            msgInput.value = "";
            postToChat("Ты", val, "text-cyan-400 font-bold");
            requestAI(val);
        }

        function aiBrainCycle() {
            // Если 15 секунд никто не писал - она начинает говорить сама
            if(!isSpeaking && (Date.now() - lastBrainUpdate > 15000)) {
                requestAI("Скажи что-то случайное своему чату как стримерша", true);
            }
        }

        function simulateFans() {
            const fans = ["Alex_Cyber", "MikuLover", "Vova_Dota", "NekoGirl"];
            const texts = ["Тян, ты топ!", "Лучший стрим!", "Обожаю этот трек", "Какая милая!", "Лол, жиза", "❤️❤️❤️"];
            if(Math.random() > 0.4) postToChat(fans[Math.floor(Math.random()*fans.length)], texts[Math.floor(Math.random()*texts.length)]);
        }

        function runUptime() {
            let totalSeconds = 0;
            setInterval(() => {
                totalSeconds++;
                const h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
                const m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
                const s = (totalSeconds % 60).toString().padStart(2, '0');
                document.getElementById('clock').innerText = `${h}:${m}:${s}`;
                
                if(totalSeconds % 4 === 0) {
                    const vc = 4900 + Math.floor(Math.random() * 200);
                    document.getElementById('viewers').innerText = vc.toLocaleString();
                }
            }, 1000);
        }

        msgInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleUserChat(); });
    </script>
</body>
</html>
