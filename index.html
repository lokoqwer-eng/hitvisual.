
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HIT VISUAL NEON LUX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&display=swap');
        
        :root {
            --neon-cyan: #00f2ff;
            --neon-purple: #bc13fe;
            --bg-dark: #050505;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .unbounded { font-family: 'Unbounded', sans-serif; }

        /* Неоновое свечение для заголовка */
        .neon-text {
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5), 0 0 20px rgba(0, 242, 255, 0.3);
        }

        .canvas-container {
            flex: 1;
            margin: 20px;
            background: #000;
            border: 2px solid rgba(0, 242, 255, 0.1);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 1), inset 0 0 20px rgba(0, 242, 255, 0.05);
        }

        /* Анимированная градиентная рамка */
        .canvas-container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--neon-cyan), transparent, var(--neon-purple), transparent);
            background-size: 400% 400%;
            z-index: -1;
            animation: gradient-border 10s ease infinite;
            border-radius: 32px;
            opacity: 0.3;
        }

        @keyframes gradient-border {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #result-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            filter: contrast(1.1) brightness(1.1);
        }

        .ui-panel {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            padding: 30px 25px calc(30px + env(safe-area-inset-bottom));
            border-radius: 40px 40px 0 0;
            border-top: 1px solid rgba(0, 242, 255, 0.2);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
        }

        .input-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 18px 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 242, 255, 0.1);
            transition: all 0.3s;
        }

        .input-box:focus-within {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .input-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 16px;
        }

        /* Топовая неоновая кнопка */
        .btn-generate {
            background: #000;
            color: var(--neon-cyan);
            width: 100%;
            padding: 20px;
            border-radius: 20px;
            font-weight: 900;
            text-transform: uppercase;
            font-family: 'Unbounded';
            letter-spacing: 2px;
            font-size: 14px;
            border: 2px solid var(--neon-cyan);
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        .btn-generate:active {
            transform: scale(0.98);
            box-shadow: 0 0 5px var(--neon-cyan);
        }

        .btn-generate:disabled {
            opacity: 0.5;
            border-color: #333;
            color: #333;
            box-shadow: none;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 242, 255, 0.1);
            border-top-color: var(--neon-cyan);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            display: none;
            filter: drop-shadow(0 0 10px var(--neon-cyan));
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .status-text {
            font-family: 'Unbounded';
            font-size: 10px;
            letter-spacing: 5px;
            color: var(--neon-cyan);
            opacity: 0.4;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="py-8 text-center">
        <div class="unbounded text-[10px] tracking-[0.8em] text-[#00f2ff] neon-text opacity-80">HIT VISUAL LUX • NEON V10</div>
    </div>

    <div class="canvas-container">
        <div class="loader" id="loader"></div>
        <div id="status" class="status-text">SYSTEM READY</div>
        <img id="result-image" src="" alt="AI ART">
    </div>

    <div class="ui-panel">
        <div class="input-box">
            <input type="text" id="prompt-input" placeholder="Введите ваш промпт..." autocomplete="off">
        </div>
        <button id="main-button" onclick="handleGeneration()" class="btn-generate">Сгенерировать</button>
    </div>

    <script>
        // Твой ключ уже в коде!
        const apiKey = "AIzaSyBqsTIIFULj-i4WDUv8JoLmr9z8HhaDY9I";

        async function handleGeneration() {
            const promptInput = document.getElementById('prompt-input');
            const prompt = promptInput.value;
            if (!prompt) return;

            const loader = document.getElementById('loader');
            const status = document.getElementById('status');
            const img = document.getElementById('result-image');
            const btn = document.getElementById('main-button');

            loader.style.display = 'block';
            status.style.display = 'none';
            img.style.display = 'none';
            btn.innerText = "ГЕНЕРАЦИЯ...";
            btn.disabled = true;

            try {
                // Используем Imagen 4.0 (автоматически подхватит системный ключ здесь или твой на GitHub)
                const finalKey = apiKey || (typeof "" !== 'undefined' ? "" : "");
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${finalKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        instances: [{ prompt: prompt }],
                        parameters: { sampleCount: 1 }
                    })
                });

                const data = await response.json();
                
                if (data.predictions && data.predictions[0]) {
                    img.src = `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
                    img.onload = () => {
                        img.style.display = 'block';
                        loader.style.display = 'none';
                    };
                } else {
                    throw new Error();
                }
            } catch (error) {
                status.innerText = "ОШИБКА СИСТЕМЫ";
                status.style.display = 'block';
                loader.style.display = 'none';
            } finally {
                btn.innerText = "СГЕНЕРИРОВАТЬ";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
