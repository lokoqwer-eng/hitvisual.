
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HIT VISUAL LUXURY</title>
    <!-- Подключаем VK Bridge для работы внутри ВК -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Montserrat:wght@300;600;900&display=swap');
        
        :root {
            --neon-blue: #00e5ff;
            --neon-pink: #ff007b;
            --vk-bg: #ebedf0; /* Цвет фона ВК для бесшовности */
        }

        body {
            background-color: var(--vk-bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 229, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 0, 123, 0.05) 0px, transparent 50%);
            color: #0f172a;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .syncopate { font-family: 'Syncopate', sans-serif; }

        /* Радужный текст с поддержкой Safari/VK */
        .glow-text {
            font-size: 10px;
            letter-spacing: 0.8em;
            font-weight: 700;
            background: linear-gradient(90deg, #00e5ff, #ff007b, #7000ff, #00e5ff);
            background-size: 300% auto;
            color: #000;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow 4s linear infinite;
        }

        @keyframes rainbow {
            to { background-position: 300% center; }
        }

        .canvas-area {
            flex: 1;
            margin: 15px;
            background: #0f172a;
            border-radius: 28px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid #fff;
            cursor: pointer;
        }

        #output-img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: none;
            transition: transform 0.5s ease;
        }

        .canvas-area.fullscreen {
            position: fixed;
            inset: 0;
            margin: 0;
            z-index: 9999;
            border-radius: 0;
            background: #000;
        }
        .canvas-area.fullscreen #output-img { object-fit: contain; }

        .ui-dock {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px 20px calc(25px + env(safe-area-inset-bottom));
            border-radius: 35px 35px 0 0;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.05);
            z-index: 100;
        }

        .input-box {
            position: relative;
            background: #fff;
            border-radius: 20px;
            padding: 15px 50px 15px 20px;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
        }

        .input-box input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            font-size: 16px;
        }

        .btn-main {
            background: #000;
            color: #fff;
            width: 100%;
            padding: 18px;
            border-radius: 20px;
            font-family: 'Syncopate', sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            font-weight: 700;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .btn-main:active { transform: scale(0.97); }

        .btn-secondary {
            background: #fff;
            color: #000;
            border: 1px solid #e2e8f0;
            margin-top: 10px;
            display: none;
        }

        .loader { display: none; flex-direction: column; align-items: center; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(0, 229, 255, 0.1);
            border-top: 3px solid var(--neon-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="pt-8 pb-2 text-center">
        <div class="syncopate glow-text">HIT VISUAL LUXURY</div>
    </div>

    <div class="canvas-area" id="canvas" onclick="toggleFs()">
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <div class="status-msg text-[8px] syncopate mt-4 opacity-50">GENERATING...</div>
        </div>
        <div id="idle" class="syncopate opacity-20 text-[9px] tracking-widest text-white">READY FOR INPUT</div>
        <img id="output-img" src="" alt="Art">
    </div>

    <div class="ui-dock">
        <div class="input-box">
            <input type="text" id="p-in" placeholder="ОПИШИТЕ ВАШ ЗАМЫСЕЛ..." autocomplete="off">
            <div style="position:absolute; right:15px; top:50%; transform:translateY(-50%); cursor:pointer" onclick="document.getElementById('p-in').value=''">❌</div>
        </div>
        <button id="b-gen" onclick="generate()" class="btn-main">СОЗДАТЬ</button>
        <button id="b-down" onclick="download()" class="btn-main btn-secondary">СКАЧАТЬ</button>
    </div>

    <script>
        // Инициализация ВК Бридж сразу
        vkBridge.send("VKWebAppInit");

        const pin = document.getElementById('p-in');
        const loader = document.getElementById('loader');
        const idle = document.getElementById('idle');
        const img = document.getElementById('output-img');
        const bgen = document.getElementById('b-gen');
        const bdown = document.getElementById('b-down');
        const canvas = document.getElementById('canvas');

        function toggleFs() {
            if (img.src) canvas.classList.toggle('fullscreen');
        }

        async function generate() {
            const prompt = pin.value;
            if (!prompt) return;

            loader.style.display = 'flex';
            idle.style.display = 'none';
            img.style.display = 'none';
            bdown.style.display = 'none';
            bgen.disabled = true;
            bgen.innerText = "WAIT...";

            const seed = Math.floor(Math.random() * 9999999);
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed}&width=1024&height=1024&nologo=true&model=flux`;

            const tImg = new Image();
            tImg.crossOrigin = "anonymous";
            tImg.src = url;
            
            tImg.onload = () => {
                img.src = url;
                img.style.display = 'block';
                loader.style.display = 'none';
                bgen.disabled = false;
                bgen.innerText = "СОЗДАТЬ";
                bdown.style.display = 'block';
                
                // Легкая вибрация телефона через ВК при успехе
                vkBridge.send("VKWebAppTapticNotificationOccurred", {"type": "success"});
            };
            
            tImg.onerror = () => {
                loader.style.display = 'none';
                idle.style.display = 'block';
                idle.innerText = "ERROR";
                bgen.disabled = false;
                bgen.innerText = "СОЗДАТЬ";
            };
        }

        async function download() {
            // В ВК лучше всего открывать картинку в новом окне или использовать их нативный метод
            vkBridge.send("VKWebAppShowImages", {
                images: [img.src]
            });
        }
    </script>
</body>
</html>
