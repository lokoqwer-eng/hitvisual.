<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI VTuber VK Edition</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=Montserrat:wght@300;600;800&display=swap');
        
        :root { --accent: #00f2ff; }
        body { background: #000; color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; overflow: hidden; height: 100vh; }

        /* ФОН ИЗ ТВОИХ ФАЙЛОВ */
        #room-bg {
            position: absolute; inset: 0;
            background-image: url('uploaded:1000122230.jpg-f341b961-4115-4041-b8bc-3e70cc94bfb8');
            background-size: cover; background-position: center;
            filter: brightness(0.6); z-index: 1;
        }

        /* ЛОГОТИП */
        #group-logo {
            position: absolute; top: 15px; left: 15px;
            width: 60px; height: 60px;
            background-image: url('uploaded:1000122084.png-5b19d047-9013-454e-8fb6-40c30781f53f');
            background-size: contain; background-repeat: no-repeat;
            z-index: 150; filter: drop-shadow(0 0 10px var(--accent));
        }

        /* АВАТАР - КАРТИНКА ПЕРСОНАЖА */
        .avatar-container {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 450px; height: 85%;
            z-index: 10; display: flex; align-items: flex-end; justify-content: center;
            pointer-events: none;
        }

        #vtuber-img {
            height: 100%; object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(0,242,255,0.3));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.02); }
        }

        /* СЛОЙ ДЛЯ ГОВОРЯЩЕГО РТА (ПРИМЕРНОЕ ПОЗИЦИОНИРОВАНИЕ) */
        #mouth-sync {
            position: absolute; bottom: 60%; left: 50%;
            transform: translateX(-50%);
            width: 30px; height: 10px;
            background: #ff4081; border-radius: 50%;
            display: none; z-index: 11;
        }
        .talking #mouth-sync {
            display: block;
            animation: mouth-move 0.12s infinite alternate;
        }
        @keyframes mouth-move { from { height: 4px; } to { height: 18px; } }

        /* ИНТЕРФЕЙС */
        .hud { position: absolute; inset: 0; z-index: 100; pointer-events: none; padding: 20px; display: flex; flex-direction: column; }
        .glass { background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); border: 1px solid rgba(0,242,255,0.2); border-radius: 20px; pointer-events: auto; }
        
        #chat-flow {
            position: absolute; top: 100px; right: 20px;
            width: 260px; max-height: 250px;
            overflow-y: auto; scrollbar-width: none;
            display: flex; flex-direction: column; gap: 8px;
        }
        .msg { font-size: 11px; padding: 10px; border-radius: 14px; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }

        #start-overlay { background: #000; z-index: 2000; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

    <div id="start-overlay" class="fixed inset-0" onclick="startApp()">
        <div class="text-center">
            <div class="w-24 h-24 border-2 border-cyan-500 rounded-full animate-ping mb-6 flex items-center justify-center">
                <span class="text-cyan-500 font-black text-xs uppercase tracking-tighter">Live</span>
            </div>
            <div class="text-[9px] tracking-[6px] text-white/40 uppercase">Подключение к VK Bridge</div>
        </div>
    </div>

    <div id="room-bg"></div>
    <div id="group-logo"></div>

    <div class="avatar-container" id="avatar-box">
        <!-- АВАТАР - ПОСТАВИЛ ОДИН ИЗ ТВОИХ ФАЙЛОВ КАК МОДЕЛЬ -->
        <img id="vtuber-img" src="uploaded:1000122090.png-d8b4a516-b9d0-4c43-81fa-f7fdd3c383e3" alt="VTuber">
        <div id="mouth-sync"></div>
    </div>

    <div class="hud">
        <div class="flex justify-between items-start pointer-events-auto">
            <div class="flex flex-col gap-2">
                <div class="flex items-center gap-2">
                    <div class="bg-red-600 px-3 py-1 rounded text-[10px] font-black uppercase">Live</div>
                    <div class="glass px-3 py-1 text-[11px] text-cyan-400 font-bold" id="uptime">00:00:00</div>
                </div>
            </div>
            <div class="glass px-4 py-2 text-[10px] font-bold">
                <span class="text-white/40">Зрители:</span> <span id="v-count">2,109</span>
            </div>
        </div>

        <div id="chat-flow"></div>

        <div class="mt-auto flex flex-col gap-3 pointer-events-auto">
            <div class="glass p-3 flex items-center gap-3">
                <div class="text-[10px] font-bold text-cyan-500">Radio:</div>
                <div class="text-[10px] truncate flex-1" id="track">Lo-Fi Cyberpunk</div>
                <button onclick="changeTrack()" class="bg-white/10 p-2 rounded-lg hover:bg-white/20">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
            <div class="flex gap-2">
                <input id="chat-input" type="text" class="glass flex-1 bg-transparent border-none outline-none px-6 py-4 text-sm" placeholder="Напиши своей ИИ-Тян...">
                <button onclick="handleSend()" class="bg-cyan-500 text-black px-8 py-4 rounded-2xl font-black text-[10px] uppercase">Send</button>
            </div>
        </div>
    </div>

    <audio id="player" loop crossorigin="anonymous"></audio>

    <script>
        const stations = [
            { name: "Synthwave Night", url: "https://stream.zeno.fm/0r0xa792kwzuv" },
            { name: "Miku Chill", url: "https://stream.zeno.fm/f9scrt81638uv" }
        ];

        let curStation = 0;
        let vkReady = false;
        let isSpeaking = false;
        const player = document.getElementById('player');
        const chat = document.getElementById('chat-flow');
        const input = document.getElementById('chat-input');

        // ИНИЦИАЛИЗАЦИЯ VK BRIDGE
        if (window.vkBridge) {
            vkBridge.send('VKWebAppInit')
                .then(() => { vkReady = true; console.log('VK Init OK'); })
                .catch(() => { vkReady = true; });
        } else { vkReady = true; }

        function startApp() {
            if (!vkReady) return;
            document.getElementById('start-overlay').style.display = 'none';
            
            if (window.vkBridge) {
                vkBridge.send('VKWebAppSetViewSettings', { status_bar_style: 'light' }).catch(()=>{});
            }

            changeTrack(0);
            startTimer();
            addMsg("System", "Нейросеть активна. Эфир запущен!", "text-cyan-400");
            
            setInterval(autoPilot, 25000);
        }

        function changeTrack(idx = -1) {
            curStation = idx === -1 ? (curStation + 1) % stations.length : idx;
            player.src = stations[curStation].url;
            player.play().catch(()=>{});
            document.getElementById('track').innerText = stations[curStation].name;
            player.volume = 0.2;
        }

        function addMsg(user, text, colorClass = "text-white/80") {
            const div = document.createElement('div');
            div.className = `msg glass`;
            div.innerHTML = `<b class="${colorClass} mr-2">${user}:</b> ${text}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            if(chat.children.length > 15) chat.removeChild(chat.firstChild);
        }

        async function talkToAI(prompt, isAuto = false) {
            if(isSpeaking && !isAuto) return;
            
            const sys = `Ты - популярная ИИ-стримерша. Ответы до 10 слов. Ты любишь чат и музыку.`;
            
            try {
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?system=${encodeURIComponent(sys)}&seed=${Math.random()}`);
                const txt = await res.text();
                addMsg("ИИ-Тян", txt, "text-cyan-400 font-bold");
                speak(txt);
            } catch(e) { console.log("AI Error"); }
        }

        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ru-RU';
            utter.pitch = 1.4;
            utter.onstart = () => { isSpeaking = true; document.getElementById('avatar-box').classList.add('talking'); };
            utter.onend = () => { isSpeaking = false; document.getElementById('avatar-box').classList.remove('talking'); };
            window.speechSynthesis.speak(utter);
        }

        function handleSend() {
            const v = input.value.trim();
            if(!v) return;
            input.value = "";
            addMsg("Ты", v, "text-pink-500");
            talkToAI(v);
        }

        function autoPilot() {
            if(!isSpeaking) {
                talkToAI("Расскажи забавный факт или поздоровайся с новыми зрителями", true);
            }
        }

        function startTimer() {
            let s = 0;
            setInterval(() => {
                s++;
                const h = Math.floor(s/3600).toString().padStart(2,'0');
                const m = Math.floor((s%3600)/60).toString().padStart(2,'0');
                const sc = (s%60).toString().padStart(2,'0');
                document.getElementById('uptime').innerText = `${h}:${m}:${sc}`;
                
                if(s % 5 === 0) {
                    const vc = 2100 + Math.floor(Math.random()*100);
                    document.getElementById('v-count').innerText = vc.toLocaleString();
                }
            }, 1000);
        }

        input.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleSend(); });
    </script>
</body>
</html>
