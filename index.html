<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI VTuber Gemini Intelligence</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=Montserrat:wght@300;700&display=swap');
        
        :root { --accent: #00f2ff; --neon-pink: #ff007a; }
        body { background: #000; color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; overflow: hidden; height: 100vh; }

        /* ФОН - ПОСЛЕДНИЙ ЗАГРУЖЕННЫЙ */
        #room-bg {
            position: absolute; inset: 0;
            background-image: url('uploaded:1000122232.jpg-ad22ee37-6829-471a-8e9a-a980d46228a6');
            background-size: cover; background-position: center;
            filter: brightness(0.4) contrast(1.2); z-index: 1;
        }

        /* ЛОГОТИП ГРУППЫ */
        #group-logo {
            position: absolute; top: 20px; left: 20px;
            width: 70px; height: 70px;
            background-image: url('uploaded:1000122084.png-5b19d047-9013-454e-8fb6-40c30781f53f');
            background-size: contain; background-repeat: no-repeat;
            z-index: 150; filter: drop-shadow(0 0 15px var(--accent));
        }

        /* VTUBER МОДЕЛЬ */
        .character-stage {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px; height: 95%;
            display: flex; align-items: flex-end; justify-content: center;
            z-index: 20; pointer-events: none;
        }

        #vtuber-model {
            height: 100%; object-fit: contain;
            animation: idleMove 6s ease-in-out infinite;
            filter: drop-shadow(0 0 25px rgba(0,242,255,0.2));
        }

        @keyframes idleMove {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(0.5deg); }
        }

        /* ИНДИКАТОР РЕЧИ */
        #mouth-fx {
            position: absolute; bottom: 62%; left: 50%; transform: translateX(-50%);
            width: 35px; height: 10px; background: var(--neon-pink);
            border-radius: 50%; z-index: 25; display: none;
            box-shadow: 0 0 20px var(--neon-pink);
        }
        .speaking #mouth-fx { display: block; animation: speakAnim 0.12s infinite alternate; }
        @keyframes speakAnim { from { height: 4px; } to { height: 22px; border-radius: 30%; } }

        /* ИНТЕРФЕЙС ЧАТА - ВЫШЕ И СБОКУ */
        #chat-sidebar {
            position: absolute; top: 100px; right: 20px;
            width: 260px; max-height: 280px;
            overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
            scrollbar-width: none; z-index: 100;
        }
        .msg-bubble { 
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 15px;
            padding: 10px 14px; font-size: 11px; animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }

        /* ПАНЕЛЬ УПРАВЛЕНИЯ */
        .control-panel {
            position: absolute; bottom: 30px; left: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 12px; z-index: 100;
        }
        .glass { background: rgba(0,0,0,0.5); backdrop-filter: blur(15px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }

        #splash-screen {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.5s;
        }
    </style>
</head>
<body>

    <div id="splash-screen" onclick="startSystem()">
        <div class="w-32 h-32 border-4 border-cyan-500 rounded-full flex items-center justify-center animate-pulse mb-6">
            <span class="text-cyan-400 font-black text-2xl">START</span>
        </div>
        <p class="text-white/30 text-[10px] tracking-[8px] uppercase">Инициализация Gemini AI</p>
    </div>

    <div id="room-bg"></div>
    <div id="group-logo"></div>

    <div class="character-stage" id="character-rig">
        <img id="vtuber-model" src="uploaded:1000122090.png-d8b4a516-b9d0-4c43-81fa-f7fdd3c383e3" alt="Model">
        <div id="mouth-fx"></div>
    </div>

    <div id="chat-sidebar"></div>

    <div class="control-panel">
        <div class="flex justify-between items-end mb-4">
            <div class="flex flex-col gap-1">
                <div class="bg-red-600 text-white text-[9px] font-black px-2 py-0.5 rounded uppercase w-fit">Live</div>
                <div class="text-xl font-bold" id="clock">00:00:00</div>
            </div>
            <div class="glass px-4 py-2 text-[10px] font-bold text-cyan-400">
                Viewers: <span id="v-count">3,812</span>
            </div>
        </div>

        <div class="glass p-4 flex items-center gap-4">
            <div class="w-10 h-10 bg-cyan-500/20 rounded-full flex items-center justify-center">
                <svg class="w-5 h-5 text-cyan-400 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
            </div>
            <div class="flex-1 overflow-hidden">
                <div class="text-[9px] text-white/40 uppercase mb-0.5">Now Playing</div>
                <div class="text-[12px] font-bold truncate" id="track-name">Radio: Synthwave Stream</div>
            </div>
            <button onclick="changeRadio()" class="p-2 bg-white/5 rounded-xl hover:bg-white/10">
                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>

        <div class="flex gap-2">
            <input id="user-input" type="text" class="glass flex-1 bg-transparent border-none outline-none px-6 py-4 text-sm" placeholder="Спроси свою помощницу...">
            <button onclick="handleMsg()" class="bg-cyan-500 text-black px-8 py-4 rounded-2xl font-black text-[11px] uppercase shadow-lg shadow-cyan-500/20 active:scale-95 transition">Talk</button>
        </div>
    </div>

    <audio id="audio-engine" loop crossorigin="anonymous"></audio>

    <script>
        const apiKey = ""; // Экосистема сама подставит ключ
        const chat = document.getElementById('chat-sidebar');
        const input = document.getElementById('user-input');
        const audio = document.getElementById('audio-engine');
        const rig = document.getElementById('character-rig');
        
        let isSpeaking = false;
        let radioIdx = 0;
        const radios = [
            "https://stream.zeno.fm/0r0xa792kwzuv",
            "https://stream.zeno.fm/f9scrt81638uv",
            "https://icecast.skyrock.net/s/natio_mp3_128k"
        ];

        function startSystem() {
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('splash-screen').style.display = 'none', 500);
            
            try { vkBridge.send("VKWebAppInit"); } catch(e) {}
            
            changeRadio(0);
            updateTimer();
            addMsg("SYSTEM", "Я готова! Спрашивай что угодно, я помогу.", "text-cyan-400");
            
            // Автономные мысли ИИ (раз в 30 сек)
            setInterval(aiAutopilot, 30000);
        }

        function changeRadio(idx = -1) {
            radioIdx = idx === -1 ? (radioIdx + 1) % radios.length : idx;
            audio.src = radios[radioIdx];
            audio.play().catch(() => {});
            audio.volume = 0.25;
            document.getElementById('track-name').innerText = `Radio Station #${radioIdx + 1}`;
        }

        function addMsg(user, text, color = "text-white/70") {
            const div = document.createElement('div');
            div.className = 'msg-bubble';
            div.innerHTML = `<b class="${color} mr-2">${user}:</b> ${text}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            if(chat.children.length > 10) chat.removeChild(chat.firstChild);
        }

        // ВЫЗОВ GEMINI 2.5 FLASH ПРЯМО ВНУТРИ
        async function callGemini(userText) {
            const systemPrompt = "Ты - продвинутая ИИ-ассистентка и VTuber. Тебя зовут Тян. Твой стиль: милая, умная, иногда дерзкая. Отвечай коротко (до 10 слов). Если тебя просят сменить музыку - предложи нажать кнопку радио.";
            
            let retry = 0;
            const delays = [1000, 2000, 4000];

            while(retry < 4) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userText }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });
                    
                    const data = await response.json();
                    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Хм, я задумалась...";
                    
                    addMsg("Тян", reply, "text-cyan-400 font-bold");
                    speak(reply);
                    return;
                } catch(e) {
                    if(retry === 3) addMsg("SYSTEM", "Ошибка связи с мозгом...");
                    await new Promise(r => setTimeout(r, delays[retry] || 5000));
                    retry++;
                }
            }
        }

        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ru-RU';
            utter.pitch = 1.3;
            utter.rate = 1.05;
            utter.onstart = () => { isSpeaking = true; rig.classList.add('speaking'); };
            utter.onend = () => { isSpeaking = false; rig.classList.remove('speaking'); };
            window.speechSynthesis.speak(utter);
        }

        function handleMsg() {
            const val = input.value.trim();
            if(!val) return;
            input.value = "";
            addMsg("Ты", val, "text-pink-500");
            callGemini(val);
        }

        function aiAutopilot() {
            if(!isSpeaking) {
                callGemini("Скажи зрителям что-нибудь милое или прокомментируй, что ты их видишь.");
            }
        }

        function updateTimer() {
            let s = 0;
            const start = Date.now();
            setInterval(() => {
                const now = Math.floor((Date.now() - start) / 1000);
                const h = Math.floor(now/3600).toString().padStart(2, '0');
                const m = Math.floor((now%3600)/60).toString().padStart(2, '0');
                const sc = (now%60).toString().padStart(2, '0');
                document.getElementById('clock').innerText = `${h}:${m}:${sc}`;
                
                if(now % 6 === 0) {
                    const v = 3800 + Math.floor(Math.random() * 200);
                    document.getElementById('v-count').innerText = v.toLocaleString();
                }
            }, 1000);
        }

        input.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleMsg(); });
    </script>
</body>
</html>
