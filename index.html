<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Digital Streamer Pro (Audio Fixed)</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=Montserrat:wght@400;700&display=swap');
        
        body { background: #050505; color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        
        #game-bg {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; filter: brightness(0.2); z-index: 1;
        }

        .avatar-container {
            position: absolute; bottom: -20px; left: 50%;
            transform: translateX(-50%); height: 90vh;
            z-index: 20; pointer-events: none;
            opacity: 0; transition: opacity 1.5s ease;
        }

        #sprite-body { height: 100%; filter: drop-shadow(0 0 40px rgba(0, 242, 255, 0.4)); animation: bodyIdle 5s ease-in-out infinite; }

        @keyframes bodyIdle {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(0.4deg); }
        }

        .face-overlay {
            position: absolute; top: 16%; width: 120px; height: 60px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        }

        .eye { 
            width: 14px; height: 14px; background: #fff; border-radius: 50%; 
            position: relative; animation: blink 4s infinite;
            box-shadow: 0 0 15px #00f2ff;
        }
        .eye::after { content: ''; position: absolute; width: 5px; height: 5px; background: #000; border-radius: 50%; left: 3px; top: 3px; }

        @keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(0.1); } }

        #mouth {
            width: 20px; height: 4px; background: #ff4081; border-radius: 10px;
            transition: all 0.1s ease; box-shadow: 0 0 15px #ff4081;
        }

        .talking #mouth { animation: mouthMove 0.15s infinite alternate; }
        @keyframes mouthMove { from { height: 3px; width: 18px; } to { height: 16px; width: 24px; border-radius: 40%; } }

        .glass { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; pointer-events: auto; }
        .chat-line { font-size: 11px; margin-bottom: 4px; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-15px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

    <div id="gate" class="fixed inset-0 bg-black z-[2000] flex flex-col items-center justify-center cursor-pointer" onclick="goLive()">
        <div class="relative w-32 h-32 mb-8">
            <div class="absolute inset-0 border-4 border-cyan-500/20 rounded-full animate-ping"></div>
            <div class="absolute inset-2 border-2 border-cyan-400 rounded-full flex items-center justify-center font-black text-cyan-400">LIVE</div>
        </div>
        <div class="unbounded text-[10px] tracking-[8px] text-white/40 uppercase">Начать вещание</div>
        <div class="mt-4 text-[9px] text-cyan-500/60 font-bold uppercase italic">Кликни для активации голоса</div>
    </div>

    <img id="game-bg" src="https://image.pollinations.ai/prompt/aesthetic%20anime%20gaming%20room%20neon?width=1024&height=1792&nologo=true" alt="Background">

    <div id="avatar-preloader" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center z-25">
        <div class="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <div class="text-[9px] font-bold text-cyan-400 uppercase tracking-widest animate-pulse">Загрузка нейро-модели...</div>
    </div>

    <div id="avatar-root" class="avatar-container">
        <img id="sprite-body" src="" alt="VTuber Avatar">
        <div class="face-overlay">
            <div class="flex justify-around w-full">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
            <div id="mouth"></div>
        </div>
    </div>

    <div class="relative z-[100] h-screen p-6 flex flex-col justify-between pointer-events-none">
        <div class="flex justify-between items-start pointer-events-auto">
            <div class="flex flex-col gap-2">
                <div class="flex items-center gap-2">
                    <div class="bg-red-600 px-3 py-1 rounded-md text-[10px] font-black italic">REC</div>
                    <div class="glass px-3 py-1 text-[10px] font-bold text-cyan-400" id="timer">00:00:00</div>
                </div>
            </div>
            <button onclick="forceAudioUnlock()" class="glass px-4 py-2 text-[9px] font-black text-cyan-400 uppercase active:scale-95">
                🔊 Исправить звук
            </button>
        </div>

        <div class="flex flex-col gap-4">
            <div id="chat-box" class="max-h-[180px] overflow-y-auto pr-4 pointer-events-auto"></div>
            <div class="glass p-2 flex gap-2 pointer-events-auto">
                <input id="chat-input" type="text" class="bg-transparent border-none outline-none flex-1 px-4 text-sm text-white" placeholder="Напиши ИИ-тян...">
                <button onclick="handleUserMessage()" class="bg-cyan-500 text-black px-8 py-3 rounded-xl font-black text-[10px] uppercase">Send</button>
            </div>
        </div>
    </div>

    <audio id="bg-music" loop src="https://stream.zeno.fm/0r0xa792kwzuv"></audio>

    <script>
        const avatarRoot = document.getElementById('avatar-root');
        const sprite = document.getElementById('sprite-body');
        const preloader = document.getElementById('avatar-preloader');
        const chatBox = document.getElementById('chat-box');
        const chatInput = document.getElementById('chat-input');
        const music = document.getElementById('bg-music');
        
        let isSpeaking = false;
        let lastAction = Date.now();
        let selectedVoice = null;

        // Предзагрузка аватара
        const avatarUrl = "https://image.pollinations.ai/prompt/cute%20vtuber%20anime%20girl%20white%20hair%20blue%20eyes%20cyberpunk%20outfit%20vibrant%20standing%20white%20background?width=1024&height=1792&nologo=true&seed=88";
        const tempImg = new Image();
        tempImg.src = avatarUrl;
        tempImg.onload = () => {
            sprite.src = avatarUrl;
            preloader.style.display = 'none';
            avatarRoot.style.opacity = '1';
        };

        // Загрузка голосов
        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            selectedVoice = voices.find(v => v.lang.includes('ru')) || voices[0];
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        function forceAudioUnlock() {
            try {
                // Разблокировка Web Audio
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                
                // Разблокировка TTS
                window.speechSynthesis.cancel();
                const silent = new SpeechSynthesisUtterance("");
                silent.volume = 0;
                window.speechSynthesis.speak(silent);
                
                addMessage("SYSTEM", "🔊 АУДИО-ДВИЖОК ПЕРЕЗАПУЩЕН", true);
                speak("Звук активирован! Теперь я тебя слышу и могу говорить!");
            } catch(e) { console.error(e); }
        }

        function goLive() {
            vkBridge.send("VKWebAppInit");
            document.getElementById('gate').style.display = 'none';
            music.play(); music.volume = 0.15;
            forceAudioUnlock();
            startTimer();
            addMessage("SYSTEM", "ЭФИР НАЧАТ! ПРИВЕТ, ЧАТ!");
            
            setInterval(autoPilot, 20000);
            setInterval(simulateDonation, 50000);
        }

        function addMessage(user, text, isBot = false) {
            const div = document.createElement('div');
            div.className = 'chat-line';
            div.innerHTML = `<b class="${isBot ? 'text-cyan-400' : 'text-pink-400'}">${user}:</b> ${text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            
            const utter = new SpeechSynthesisUtterance(text);
            if (selectedVoice) utter.voice = selectedVoice;
            utter.lang = 'ru-RU';
            utter.pitch = 1.35;
            utter.rate = 1.1;

            utter.onstart = () => {
                isSpeaking = true;
                avatarRoot.classList.add('talking');
                music.volume = 0.05;
            };
            utter.onend = () => {
                isSpeaking = false;
                avatarRoot.classList.remove('talking');
                music.volume = 0.15;
            };
            utter.onerror = (e) => {
                console.error("TTS Error:", e);
                isSpeaking = false;
                avatarRoot.classList.remove('talking');
                music.volume = 0.15;
            };
            
            window.speechSynthesis.speak(utter);
        }

        async function aiReply(msg, isAuto = false) {
            try {
                const system = isAuto ? 
                    "Ты цифровая стримерша. В чате тишина. Скажи что-то забавное зрителям. Очень коротко (5-10 слов). На русском." :
                    "Ты стримерша. Ответь зрителю весело и мило. Очень коротко (5-10 слов). На русском.";
                
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(msg)}?system=${encodeURIComponent(system)}`);
                const reply = await response.text();
                
                addMessage("AI_GIRL", reply, true);
                speak(reply);
                lastAction = Date.now();
            } catch(e) { console.error(e); }
        }

        function handleUserMessage() {
            const val = chatInput.value.trim();
            if (!val || isSpeaking) return;
            chatInput.value = '';
            addMessage("USER", val);
            aiReply(val, false);
        }

        function autoPilot() {
            if (Date.now() - lastAction > 20000 && !isSpeaking) {
                aiReply("Ребят, почему молчим? Напишите что-нибудь!", true);
            }
        }

        function simulateDonation() {
            const nicks = ["Gamer99", "Neo", "LoliHunter"];
            const nick = nicks[Math.floor(Math.random()*nicks.length)];
            const amt = Math.floor(Math.random()*300) + 100;
            addMessage("DONATION", `${nick} отправил ${amt} ₽!`, true);
            setTimeout(() => speak(`Ой, ${nick}, спасибо за донатик! Обожаю тебя!`), 800);
        }

        function startTimer() {
            let s = 0;
            setInterval(() => {
                s++;
                const m = Math.floor((s%3600)/60).toString().padStart(2,'0');
                const sec = (s%60).toString().padStart(2,'0');
                document.getElementById('timer').innerText = `00:${m}:${sec}`;
            }, 1000);
        }

        chatInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleUserMessage(); });
    </script>
</body>
</html>
