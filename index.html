<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI VTuber Intelligence</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=Montserrat:wght@300;700&display=swap');
        
        :root { --accent: #00f2ff; }
        body { background: #000; color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; overflow: hidden; height: 100vh; }

        /* ФОН КОМНАТЫ */
        #room {
            position: absolute; inset: 0;
            background-image: url('uploaded:1000122229.jpg-1249a07a-0b10-4a5d-8b1c-24693dc06a62');
            background-size: cover; background-position: center;
            filter: brightness(0.5) contrast(1.1); z-index: 1;
        }

        /* ЛОГОТИП ГРУППЫ */
        #brand-logo {
            position: absolute; top: 20px; left: 20px;
            width: 60px; height: 60px;
            background-image: url('uploaded:1000122084.png-5b19d047-9013-454e-8fb6-40c30781f53f');
            background-size: contain; background-repeat: no-repeat;
            z-index: 150; filter: drop-shadow(0 0 15px var(--accent));
        }

        /* СТРИМЕРША */
        .stage {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            z-index: 20; pointer-events: none;
        }

        .character { transform-origin: bottom center; animation: sway 5s ease-in-out infinite; }
        @keyframes sway { 0%, 100% { transform: rotate(-1deg) translateY(0); } 50% { transform: rotate(1deg) translateY(-10px); } }

        .head {
            width: 120px; height: 150px; background: #ffe4d5; border-radius: 60px 60px 75px 75px;
            position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10;
        }
        .hair {
            position: absolute; top: -15px; left: -10px; width: 140px; height: 120px;
            background: linear-gradient(180deg, var(--accent), #7000ff); border-radius: 70px 70px 30px 30px;
        }
        .eye { width: 24px; height: 24px; background: #fff; border-radius: 50%; position: relative; animation: blink 4s infinite; }
        .eye::after { content: ''; position: absolute; top: 7px; left: 7px; width: 10px; height: 10px; background: #111; border-radius: 50%; }
        @keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(0.1); } }

        .mouth {
            position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%);
            width: 22px; height: 6px; background: #ff4081; border-radius: 10px; transition: 0.1s;
        }
        .talking .mouth { animation: speak 0.1s infinite alternate; }
        @keyframes speak { from { height: 4px; } to { height: 18px; border-radius: 40%; } }

        /* ИНТЕРФЕЙС - НЕ ЗАКРЫВАЕТ ОБЗОР */
        .hud { position: absolute; inset: 0; z-index: 100; pointer-events: none; padding: 20px; display: flex; flex-direction: column; }
        .glass { background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; pointer-events: auto; }
        
        #chat-sidebar { position: absolute; right: 20px; bottom: 100px; width: 220px; max-height: 300px; overflow-y: auto; scrollbar-width: none; }
        .msg { font-size: 10px; margin-bottom: 8px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 8px; border-left: 2px solid var(--accent); }

        .music-info { position: absolute; left: 20px; bottom: 100px; }
    </style>
</head>
<body>

    <div id="gate" class="fixed inset-0 bg-black z-[2000] flex flex-col items-center justify-center cursor-pointer" onclick="init()">
        <div class="w-24 h-24 border-2 border-cyan-500 rounded-full flex items-center justify-center animate-pulse">
            <span class="text-cyan-500 font-bold text-xs">LAUNCH AI</span>
        </div>
        <div class="mt-4 text-[9px] uppercase tracking-[4px] text-white/30">Инициализация нейро-интерфейса</div>
    </div>

    <div id="room"></div>
    <div id="brand-logo"></div>

    <div class="stage">
        <div id="char-rig" class="character">
            <div class="head">
                <div class="hair"></div>
                <div class="flex justify-around mt-16 px-4"><div class="eye"></div><div class="eye"></div></div>
                <div id="mouth" class="mouth"></div>
            </div>
            <div class="w-40 h-48 bg-[#1a1a2e] border-2 border-[#333] rounded-[50px] -mt-6"></div>
        </div>
    </div>

    <div class="hud">
        <!-- TOP PANEL -->
        <div class="flex justify-between items-start">
            <div class="flex flex-col gap-2">
                <div class="flex items-center gap-2">
                    <div class="bg-red-600 px-2 py-0.5 rounded text-[9px] font-black uppercase">Live</div>
                    <div class="glass px-3 py-1 text-[10px] text-cyan-400 font-bold" id="timer">00:00</div>
                </div>
                <div class="text-[10px] text-white/50">Mood: <span id="mood" class="text-green-400">Happy</span></div>
            </div>
        </div>

        <!-- MUSIC PANEL -->
        <div class="music-info glass p-3 pointer-events-auto">
            <div class="text-[8px] text-white/40 uppercase mb-1">Now Playing</div>
            <div class="text-[11px] font-bold text-cyan-400 truncate w-32" id="track-name">Radio Wave</div>
            <div class="flex gap-2 mt-2">
                <button onclick="changeRadio()" class="text-[9px] bg-white/10 px-2 py-1 rounded hover:bg-white/20">Next Station</button>
            </div>
        </div>

        <!-- CHAT SIDEBAR -->
        <div id="chat-sidebar" class="pointer-events-none"></div>

        <!-- INPUT AREA -->
        <div class="mt-auto flex gap-2 pointer-events-auto">
            <input id="user-input" type="text" class="glass flex-1 bg-transparent border-none outline-none px-4 py-3 text-sm" placeholder="Спроси о чем угодно...">
            <button onclick="handleUser()" class="bg-cyan-500 text-black px-6 py-3 rounded-xl font-black text-[10px] uppercase">Talk</button>
        </div>
    </div>

    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script>
        const stations = [
            { name: "Lofi Hip Hop", url: "https://stream.zeno.fm/0r0xa792kwzuv" },
            { name: "Cyberpunk Electro", url: "https://icecast.skyrock.net/s/natio_mp3_128k" },
            { name: "Relax Jazz", url: "https://smoothjazz.com/streams/smoothjazz_128.pls" },
            { name: "Nightcore Radio", url: "https://stream.zeno.fm/f9scrt81638uv" }
        ];

        let currentStation = 0;
        const player = document.getElementById('audio-player');
        const chat = document.getElementById('chat-sidebar');
        const mouth = document.getElementById('mouth');
        const input = document.getElementById('user-input');
        let isSpeaking = false;

        function init() {
            try { vkBridge.send("VKWebAppInit"); } catch(e) {}
            document.getElementById('gate').style.display = 'none';
            changeRadio(0);
            startTimer();
            addMsg("System", "AI Core Online. Listening for your command.");
            
            // Автономный разум: раз в 30 сек она сама что-то решает
            setInterval(aiAutopilot, 30000);
        }

        function changeRadio(idx = -1) {
            currentStation = idx === -1 ? (currentStation + 1) % stations.length : idx;
            player.src = stations[currentStation].url;
            player.play();
            document.getElementById('track-name').innerText = stations[currentStation].name;
            if(idx === -1) aiBrain(`Я переключила радио на ${stations[currentStation].name}, тебе нравится?`, true);
        }

        function addMsg(user, text, isAI = false) {
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<span class="${isAI ? 'text-cyan-400' : 'text-pink-500'} font-bold">${user}:</span> ${text}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function aiBrain(prompt, isAuto = false) {
            if(isSpeaking && !isAuto) return;
            
            const systemPrompt = `Ты - ИИ-ассистент и стримерша. Ты не просто код, ты разумная личность. 
            Твои задачи: 1. Помогать пользователю. 2. Веселить чат. 3. Управлять музыкой.
            Отвечай коротко, дерзко, но мило (до 10 слов). Если пользователь просит сменить музыку - предложи переключить станцию.`;

            try {
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?system=${encodeURIComponent(systemPrompt)}`);
                const reply = await res.text();
                
                // Проверка команд в ответе
                if(reply.toLowerCase().includes("смени музыку") || reply.toLowerCase().includes("переключи")) {
                    changeRadio();
                }

                addMsg("AI_ASSISTANT", reply, true);
                speak(reply);
            } catch(e) { console.error("Neural Error", e); }
        }

        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ru-RU';
            utter.pitch = 1.3;
            utter.onstart = () => { isSpeaking = true; document.getElementById('char-rig').classList.add('talking'); };
            utter.onend = () => { isSpeaking = false; document.getElementById('char-rig').classList.remove('talking'); };
            window.speechSynthesis.speak(utter);
        }

        function handleUser() {
            const val = input.value.trim();
            if(!val) return;
            addMsg("You", val);
            input.value = "";
            aiBrain(val);
        }

        function aiAutopilot() {
            if(!isSpeaking) {
                const thoughts = [
                    "Обожаю эту станцию!",
                    "Хм, в чате сегодня тихо. Расскажите что-нибудь?",
                    "Я тут подумала... а что если мы все в симуляции?",
                    "Может сменим музыку? Я немного устала от этого ритма."
                ];
                aiBrain(thoughts[Math.floor(Math.random()*thoughts.length)], true);
            }
        }

        function startTimer() {
            let s = 0;
            setInterval(() => {
                s++;
                const m = Math.floor(s/60).toString().padStart(2, '0');
                const sc = (s%60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${sc}`;
            }, 1000);
        }

        input.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleUser(); });
    </script>
</body>
</html>
