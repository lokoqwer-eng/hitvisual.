<body>

    <div class="pt-10 pb-4 text-center">
        <div class="unbounded text-[10px] tracking-[0.5em] opacity-30">HIT VISUAL LUX V10</div>
    </div>

    <div class="canvas-card">
        <div class="loader-ring" id="loader"></div>
        <div id="status" class="hint">ОЖИДАНИЕ МАСТЕРА</div>
        <img id="res-img" src="" alt="ART">
    </div>

    <div class="ui-dock">
        <div class="input-pill">
            <input type="text" id="prompt" placeholder="Опишите ваш замысел..." autocomplete="off">
        </div>
        <button id="gen-btn" onclick="generateArt()" class="btn-lux">Генерировать</button>
    </div>

    <script>
        // Вставленный вами ключ
        const apiKey = "AIzaSyBqsTIIFULj-i4WDUv8JoLmr9z8HhaDY9I"; 

        async function generateWithRetry(prompt, retries = 5, delay = 1000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Generate a high quality image based on this prompt: ${prompt}` }] }],
                            // Примечание: Для Imagen 4.0 используется предсказание, но мы адаптируем под flash для стабильности в Canvas среде если нужно.
                            // Для прямой генерации картинок используем модель imagen
                        })
                    });
                    
                    // Однако для генерации картинок в этой версии мы используем прямой эндпоинт imagen:
                    const imgResponse = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                        method: 'POST',
                        body: JSON.stringify({ instances: { prompt: prompt }, parameters: { sampleCount: 1 } })
                    });
                    
                    if (imgResponse.ok) return await imgResponse.json();
                } catch (e) {
                    if (i === retries - 1) throw e;
                    await new Promise(r => setTimeout(r, delay * Math.pow(2, i)));
                }
            }
        }

        async function generateArt() {
            const promptVal = document.getElementById('prompt').value;
            if (!promptVal) return;

            const loader = document.getElementById('loader');
            const status = document.getElementById('status');
            const img = document.getElementById('res-img');
            const btn = document.getElementById('gen-btn');

            loader.style.display = 'block';
            status.style.display = 'none';
            img.style.display = 'none';
            btn.innerText = "Генерация...";
            btn.disabled = true;

            try {
                const data = await generateWithRetry(promptVal);
                if (data && data.predictions && data.predictions[0]) {
                    img.src = `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
                    img.style.display = 'block';
                    loader.style.display = 'none';
                } else {
                    throw new Error();
                }
            } catch (err) {
                status.style.display = 'block';
                status.innerText = "ОШИБКА ДОСТУПА";
                loader.style.display = 'none';
            } finally {
                btn.innerText = "Генерировать";
                btn.disabled = false;
            }
        }
    </script>
</body>
