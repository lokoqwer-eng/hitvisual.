<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI VTuber Stream</title>
    <!-- VK Bridge SDK -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        
        :root { --accent: #00f2ff; }
        body { 
            background: #000; 
            color: #fff; 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            overflow: hidden; 
            height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        /* Фоновое изображение комнаты */
        #bg-layer {
            position: absolute;
            inset: 0;
            background-image: url('uploaded:1000122230.jpg-f341b961-4115-4041-b8bc-3e70cc94bfb8');
            background-size: cover;
            background-position: center;
            filter: brightness(0.5);
            z-index: 1;
        }

        /* Логотип твоего канала */
        #logo-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 65px;
            height: 65px;
            background-image: url('uploaded:1000122084.png-5b19d047-9013-454e-8fb6-40c30781f53f');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 50;
            filter: drop-shadow(0 0 10px var(--accent));
        }

        /* Персонаж (стримерша) */
        #vtuber-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            height: 90%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        #vtuber-img {
            height: 100%;
            object-fit: contain;
            animation: breathe 5s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(0,242,255,0.2));
        }

        @keyframes breathe {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.01); }
        }

        /* Анимация рта при разговоре */
        #talking-indicator {
            position: absolute;
            bottom: 58%;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 12px;
            background: #ff4081;
            border-radius: 50%;
            z-index: 15;
            display: none;
            box-shadow: 0 0 15px #ff4081;
        }

        .active-speech #talking-indicator {
            display: block;
            animation: mouth-flap 0.15s infinite alternate;
        }

        @keyframes mouth-flap {
            from { height: 4px; border-radius: 50%; }
            to { height: 18px; border-radius: 20%; }
        }

        /* Интерфейс стрима */
        .ui-hud {
            position: absolute;
            inset: 0;
            z-index: 100;
            padding: 20px;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            pointer-events: auto;
        }

        #chat-window {
            position: absolute;
            top: 100px;
            right: 20px;
            width: 250px;
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scrollbar-width: none;
        }

        .chat-entry {
            font-size: 11px;
            padding: 10px;
            border-radius: 12px;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        /* Заставка */
        #splash {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Нажми чтобы войти -->
    <div id="splash" onclick="powerOn()">
        <div class="relative w-32 h-32 mb-8">
            <div class="absolute inset-0 border-4 border-cyan-500 rounded-full animate-ping opacity-25"></div>
            <div class="absolute inset-0 border-2 border-cyan-500 rounded-full flex items-center justify-center">
                <span class="text-cyan-400 font-black text-xl uppercase italic">ON</span>
            </div>
        </div>
        <p class="text-white/40 text-[10px] tracking-[5px] uppercase animate-pulse">Нажми для входа</p>
    </div>

    <div id="bg-layer"></div>
    <div id="logo-layer"></div>

    <div id="vtuber-container">
        <!-- Используем изображение персонажа -->
        <img id="vtuber-img" src="uploaded:1000122090.png-d8b4a516-b9d0-4c43-81fa-f7fdd3c383e3" alt="Character">
        <div id="talking-indicator"></div>
    </div>

    <div class="ui-hud">
        <!-- Верхняя панель -->
        <div class="flex justify-between items-start pointer-events-auto">
            <div class="flex flex-col gap-1">
                <div class="bg-red-600 px-3 py-1 rounded text-[10px] font-black uppercase inline-block">Live</div>
                <div class="text-[14px] font-bold text-white shadow-lg" id="timer">00:00:00</div>
            </div>
            <div class="glass-panel px-4 py-2 text-[11px] font-bold text-cyan-400">
                Зрителей: <span id="viewers">2,504</span>
            </div>
        </div>

        <!-- Чат (поднят выше чтобы не закрывать её) -->
        <div id="chat-window" class="pointer-events-none"></div>

        <!-- Управление внизу -->
        <div class="mt-auto flex flex-col gap-4 pointer-events-auto">
            <div class="glass-panel p-3 flex items-center gap-3">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <div class="text-[10px] truncate flex-1 text-white/80" id="current-track">Radio: Neural Beats</div>
                <button onclick="nextRadio()" class="bg-white/10 p-2 rounded-lg">
                    <svg class="w-4 h-4" fill="white" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
            <div class="flex gap-2">
                <input id="msg-input" type="text" class="glass-panel flex-1 bg-transparent border-none outline-none px-6 py-4 text-sm text-white" placeholder="Напиши своей ИИ-Тян...">
                <button onclick="handleSend()" class="bg-cyan-500 text-black px-8 py-4 rounded-2xl font-black text-[11px] uppercase active:scale-95 transition">Send</button>
            </div>
        </div>
    </div>

    <audio id="stream-audio" loop crossorigin="anonymous"></audio>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const msgInput = document.getElementById('msg-input');
        const audio = document.getElementById('stream-audio');
        const vtuberBox = document.getElementById('vtuber-container');
        
        let isSpeaking = false;
        let aiBusy = false;
        let startTime = Date.now();

        const radios = [
            "https://stream.zeno.fm/0r0xa792kwzuv",
            "https://stream.zeno.fm/f9scrt81638uv"
        ];
        let radioIdx = 0;

        // Инициализация VK Bridge в фоновом режиме
        try {
            vkBridge.send('VKWebAppInit');
        } catch(e) { console.log('VK Init skip'); }

        function powerOn() {
            // Мгновенно убираем заставку
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => document.getElementById('splash').style.display = 'none', 300);
            
            // Запускаем звук
            nextRadio(0);
            updateTimer();
            
            addMsg("SYSTEM", "Канал связи установлен. Нейросеть активна.", "text-cyan-400");
            
            // Автономные мысли ИИ
            setInterval(aiAutopilot, 25000);
        }

        function nextRadio(idx = -1) {
            radioIdx = idx === -1 ? (radioIdx + 1) % radios.length : idx;
            audio.src = radios[radioIdx];
            audio.play().catch(() => console.log('Autoplay blocked'));
            audio.volume = 0.2;
        }

        function addMsg(user, text, color = "text-white/70") {
            const div = document.createElement('div');
            div.className = 'chat-entry glass-panel';
            div.innerHTML = `<b class="${color} mr-2">${user}:</b> ${text}`;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            if(chatWindow.children.length > 8) chatWindow.removeChild(chatWindow.firstChild);
        }

        async function fetchAI(prompt, auto = false) {
            if (aiBusy && !auto) return;
            aiBusy = true;

            const system = "Ты - популярная ИИ-стримерша. Ответы до 10 слов. Милая, веселая, любишь музыку.";
            
            try {
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?system=${encodeURIComponent(system)}&seed=${Math.random()}`);
                const text = await response.text();
                
                addMsg("ИИ-Тян", text, "text-cyan-400 font-bold");
                speak(text);
            } catch (e) {
                console.error("AI Error");
                if(!auto) addMsg("SYSTEM", "Ошибка связи. Попробуй еще раз.");
            }
            aiBusy = false;
        }

        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ru-RU';
            utter.pitch = 1.3;
            utter.rate = 1.1;
            
            utter.onstart = () => { isSpeaking = true; vtuberBox.classList.add('active-speech'); };
            utter.onend = () => { isSpeaking = false; vtuberBox.classList.remove('active-speech'); };
            
            window.speechSynthesis.speak(utter);
        }

        function handleSend() {
            const val = msgInput.value.trim();
            if(!val) return;
            msgInput.value = "";
            addMsg("Ты", val, "text-pink-500");
            fetchAI(val);
        }

        function aiAutopilot() {
            if(!isSpeaking) {
                fetchAI("Придумай короткую фразу для зрителей или прокомментируй музыку", true);
            }
        }

        function updateTimer() {
            setInterval(() => {
                const diff = Math.floor((Date.now() - startTime) / 1000);
                const h = Math.floor(diff / 3600).toString().padStart(2, '0');
                const m = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
                const s = (diff % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${h}:${m}:${s}`;
                
                if(diff % 4 === 0) {
                    const v = 2500 + Math.floor(Math.random() * 200);
                    document.getElementById('viewers').innerText = v.toLocaleString();
                }
            }, 1000);
        }

        msgInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleSend(); });
    </script>
</body>
</html>
