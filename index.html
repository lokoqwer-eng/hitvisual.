
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HIT VISUAL | AI REVOLUTION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=JetBrains+Mono&display=swap');
        
        body { background: #000; color: #fff; margin: 0; overflow: hidden; height: 100vh; font-family: 'Unbounded', sans-serif; }
        
        .main-stage { 
            position: absolute; inset: 0; 
            display: flex; align-items: center; justify-content: center;
            background: #080808;
        }

        #art-display {
            width: 100%; height: 100%; object-fit: cover;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0;
        }

        .ui-layer { position: absolute; inset: 0; z-index: 20; pointer-events: none; padding: 20px; }
        
        .live-tag { 
            background: #ff0055; color: white; padding: 3px 12px; border-radius: 4px;
            font-size: 11px; font-weight: 900; letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }

        /* Компактная вебка HIT VISUAL */
        .blogger-cam {
            position: absolute; bottom: 20px; right: 20px;
            width: 90px; height: 90px; border-radius: 15px;
            background: rgba(0,0,0,0.8); border: 1.5px solid #8b5cf6;
            overflow: hidden; pointer-events: auto;
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .visualizer {
            display: flex; align-items: flex-end; justify-content: center; gap: 2px; height: 25px; margin-top: 5px;
        }
        .v-bar { width: 3px; background: #8b5cf6; height: 2px; transition: height 0.1s; border-radius: 1px; }

        /* Экраны заставки */
        #start-overlay {
            position: absolute; inset: 0; z-index: 100; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
        }

        .logo-box { text-align: center; border-bottom: 2px solid #00f2ff; padding-bottom: 5px; margin-bottom: 15px; }
        .logo-top { color: #00f2ff; font-size: 44px; font-weight: 900; line-height: 1; text-shadow: 0 0 30px rgba(0,242,255,0.6); }
        .logo-bottom { color: #fff; font-size: 36px; font-weight: 900; line-height: 1; }

        .info-panel {
            position: absolute; bottom: 25px; left: 25px; font-family: 'JetBrains Mono';
            max-width: 320px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .status-dot { width: 6px; height: 6px; background: #4ade80; border-radius: 50%; display: inline-block; margin-right: 8px; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<div id="start-overlay" onclick="startRevolution()">
    <div class="logo-box">
        <div class="logo-top">HIT</div>
        <div class="logo-bottom">VISUAL</div>
    </div>
    <div class="text-center opacity-40 text-[10px] tracking-[0.5em] uppercase mt-2">Visual Revolution</div>
    <div class="mt-12 px-8 py-3 border border-white/20 rounded-full text-[9px] uppercase tracking-widest hover:bg-white hover:text-black transition-all">
        Запустить поток
    </div>
</div>

<div class="main-stage">
    <img id="art-display" src="">
</div>

<div class="ui-layer">
    <div class="flex justify-between items-start">
        <div class="flex items-center gap-3">
            <div class="live-tag">LIVE</div>
            <div class="bg-black/40 backdrop-blur-md px-3 py-1 rounded text-[10px] border border-white/10">
                <span id="viewers">0</span> VIEWERS
            </div>
        </div>
        <div class="bg-black/40 backdrop-blur-md px-3 py-1 rounded text-[10px] border border-white/10 font-mono text-[#00f2ff]">
            BUFF: <span id="buffer-status">READY</span>
        </div>
    </div>

    <div class="blogger-cam">
        <div class="opacity-20">
            <svg class="w-10 h-10 text-indigo-400" fill="currentColor" viewBox="0 0 20 20"><path d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"/></svg>
        </div>
        <div class="visualizer" id="viz"></div>
    </div>

    <div class="info-panel">
        <div class="flex items-center mb-1">
            <span class="status-dot"></span>
            <span id="status-label" class="text-[9px] text-white/60 tracking-widest uppercase">HIT VISUAL ACTIVE</span>
        </div>
        <div id="sub-text" class="text-[10px] text-white/30 leading-snug">Мы создаем визуальные хиты, которые задают тренды. Присоединяйся к революции.</div>
    </div>
</div>

<script>
const apiKey = "";
let audioCtx, musicGain, speechGain, analyser, dataArray;
let imageBuffer = null;
const radioUrl = "https://lofi.stream.laut.fm/lofi?t302=2023-05-10_19-00-00";

const systemPrompt = `Ты — ведущий блогер-стример группы HIT VISUAL. 
Твоя задача: вдохновлять зрителей на создание визуальных хитов. 
Стиль: экспертный, харизматичный, быстрый. 
Темы: гиперреализм, стиль, свет, визуальная революция. 
Забудь про теорию — давай только чистый визуал. 
Всегда обращайся к 'нашему пространству' и 'сообществу HIT VISUAL'.`;

function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    const radioAudio = new Audio(radioUrl);
    radioAudio.crossOrigin = "anonymous";
    const musicSource = audioCtx.createMediaElementSource(radioAudio);
    musicGain = audioCtx.createGain();
    speechGain = audioCtx.createGain();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 32;
    dataArray = new Uint8Array(analyser.frequencyBinCount);

    musicSource.connect(musicGain);
    musicGain.connect(analyser);
    speechGain.connect(analyser);
    analyser.connect(audioCtx.destination);

    musicGain.gain.value = 0.3;
    radioAudio.play();

    const viz = document.getElementById('viz');
    for(let i=0; i<8; i++) {
        const b = document.createElement('div');
        b.className = 'v-bar';
        viz.appendChild(b);
    }
    updateViz();
}

function updateViz() {
    analyser.getByteFrequencyData(dataArray);
    const bars = document.getElementsByClassName('v-bar');
    for(let i=0; i<bars.length; i++) {
        const val = (dataArray[i] / 255) * 30;
        bars[i].style.height = `${Math.max(2, val)}px`;
    }
    requestAnimationFrame(updateViz);
}

async function geminiText(prompt) {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] }
        })
    });
    const data = await res.json();
    return data.candidates[0].content.parts[0].text;
}

async function geminiImage(prompt) {
    document.getElementById('buffer-status').innerText = "GENERATING";
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ instances: { prompt }, parameters: { sampleCount: 1 } })
    });
    const data = await res.json();
    document.getElementById('buffer-status').innerText = "READY";
    return `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
}

async function speak(text) {
    musicGain.gain.setTargetAtTime(0.05, audioCtx.currentTime, 0.4);
    try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                contents: [{ parts: [{ text }] }],
                generationConfig: { 
                    responseModalities: ["AUDIO"],
                    speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } }
                }
            })
        });
        const data = await res.json();
        const audio = new Audio(URL.createObjectURL(pcmToWav(data.candidates[0].content.parts[0].inlineData.data, 24000)));
        const source = audioCtx.createMediaElementSource(audio);
        source.connect(speechGain);
        
        return new Promise(res => {
            audio.onended = () => {
                musicGain.gain.setTargetAtTime(0.3, audioCtx.currentTime, 0.6);
                res();
            };
            audio.play();
        });
    } catch(e) { musicGain.gain.setTargetAtTime(0.3, audioCtx.currentTime, 0.1); }
}

function pcmToWav(b, r) {
    const raw = atob(b); const pcm = new Int16Array(new Uint8Array([...raw].map(c => c.charCodeAt(0))).buffer);
    const buf = new ArrayBuffer(44 + pcm.length * 2); const v = new DataView(buf);
    const s = (o, t) => { for(let i=0; i<t.length; i++) v.setUint8(o+i, t.charCodeAt(i)); };
    s(0, 'RIFF'); v.setUint32(4, 32 + pcm.length * 2, true); s(8, 'WAVE'); s(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, r, true); v.setUint32(28, r * 2, true); v.setUint16(32, 2, true);
    v.setUint16(34, 16, true); s(36, 'data'); v.setUint32(40, pcm.length * 2, true);
    for(let i=0; i<pcm.length; i++) v.setInt16(44 + i * 2, pcm[i], true);
    return new Blob([buf], { type: 'audio/wav' });
}

async function startRevolution() {
    initAudio();
    document.getElementById('start-overlay').style.display = 'none';
    
    // Эмуляция зрителей
    setInterval(() => {
        document.getElementById('viewers').innerText = (42000 + Math.floor(Math.random()*1500)).toLocaleString();
    }, 2500);

    // Начальный буфер
    let currentImage = await geminiImage("Hyper-realistic futuristic art, cinematic light, masterpiece, HIT VISUAL style");
    
    while(true) {
        // Показываем картинку из буфера
        const stage = document.getElementById('art-display');
        stage.style.opacity = "0";
        setTimeout(() => {
            stage.src = currentImage;
            stage.style.opacity = "1";
        }, 100);

        // Бот комментирует текущую картинку
        const comment = await geminiText("Оцени этот гиперреалистичный кадр как эксперт HIT VISUAL. Обратись к чату. Коротко и харизматично.");
        const talkPromise = speak(comment);

        // В это же время, пока бот говорит, ГЕНЕРИРУЕМ СЛЕДУЮЩИЙ КАДР В ЗАПАС
        const nextConcept = await geminiText("Придумай следующую визуальную идею для HIT VISUAL. Только английский промпт.");
        const imagePromise = geminiImage(nextConcept + ", photorealistic, high contrast, hit visual aesthetic");

        // Ждем, пока бот договорит и пока картинка сгенерируется
        await talkPromise;
        currentImage = await imagePromise; // Обновляем текущую картинку для следующего цикла

        // Маленькая пауза, чтобы люди успели рассмотреть результат перед следующим кадром
        await new Promise(r => setTimeout(r, 6000));
    }
}
</script>
</body>
</html>
