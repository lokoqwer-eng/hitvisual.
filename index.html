
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HIT VISUAL | AI PODCAST</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=JetBrains+Mono&display=swap');
        
        body { background: #000; color: #fff; margin: 0; overflow: hidden; height: 100vh; font-family: 'Unbounded', sans-serif; }
        
        .main-stage { position: absolute; inset: 0; background: #050505; display: flex; align-items: center; justify-content: center; }
        #art-display { width: 100%; height: 100%; object-fit: cover; transition: opacity 1.2s ease-in-out; opacity: 0; }

        .ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom) 15px; }

        /* Вебка блогера-подкастера */
        .blogger-cam {
            position: absolute; bottom: calc(env(safe-area-inset-bottom) + 20px); right: 15px;
            width: 90px; height: 110px; border-radius: 15px;
            background: rgba(0,0,0,0.9); border: 1.5px solid #00f2ff;
            overflow: hidden; pointer-events: auto;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .visualizer { display: flex; align-items: flex-end; justify-content: center; gap: 2px; height: 25px; margin-top: 8px; }
        .v-bar { width: 3px; background: #00f2ff; height: 2px; transition: height 0.1s; border-radius: 1px; }

        #start-overlay {
            position: absolute; inset: 0; z-index: 100; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
        }
        .logo-top { color: #00f2ff; font-size: 46px; font-weight: 900; line-height: 1; text-shadow: 0 0 30px rgba(0,242,255,0.7); }
        .logo-bottom { color: #fff; font-size: 38px; font-weight: 900; line-height: 1; }

        .podcast-info { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 25px); left: 15px; font-family: 'JetBrains Mono'; max-width: 240px; }
        
        .glitch-text { animation: pulse 2s infinite; color: #00f2ff; font-size: 9px; letter-spacing: 2px; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>

<div id="start-overlay" onclick="startPodcast()">
    <div class="logo-top">HIT</div>
    <div class="logo-bottom">VISUAL</div>
    <div class="mt-12 px-10 py-4 bg-cyan-500/10 border border-cyan-500/30 rounded-xl text-[11px] uppercase tracking-[5px] hover:bg-cyan-500 hover:text-black transition-all">
        Войти в эфир
    </div>
</div>

<div class="main-stage">
    <img id="art-display" src="">
</div>

<div class="ui-layer">
    <div class="flex justify-between items-start pt-6">
        <div class="flex flex-col gap-1">
            <div class="bg-red-600 text-white px-3 py-0.5 rounded text-[10px] font-black italic shadow-[0_0_15px_rgba(220,38,38,0.5)]">PODCAST LIVE</div>
            <div class="text-[8px] text-white/40 font-mono tracking-widest uppercase">Episode: AI_Revolution</div>
        </div>
        <div class="bg-black/50 backdrop-blur px-3 py-1 rounded-full text-[9px] border border-white/10 text-cyan-400">
            STREAMS: <span id="buff-status">ONLINE</span>
        </div>
    </div>

    <div class="blogger-cam">
        <div class="text-[8px] text-cyan-400 font-bold mb-1">HOST</div>
        <div class="bg-cyan-500/20 p-2 rounded-full">
            <svg class="w-6 h-6 text-cyan-400" fill="currentColor" viewBox="0 0 20 20"><path d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 006 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z"/></svg>
        </div>
        <div class="visualizer" id="viz"></div>
    </div>

    <div class="podcast-info">
        <div class="glitch-text mb-2">> ЭФИР HIT VISUAL</div>
        <div class="text-[10px] text-white/50 leading-relaxed italic">"Пространство, где реальность встречается с цифровым искусством. Только хиты."</div>
    </div>
</div>

<script>
const apiKey = ""; // ТВОЙ API КЛЮЧ
let audioCtx, musicGain, speechGain, analyser, dataArray;
const radioUrl = "https://lofi.stream.laut.fm/lofi?t302=2023-05-10_19-00-00";

// Системная роль блогера-подкастера
const systemPrompt = `Ты — ведущий подкаста сообщества HIT VISUAL. 
Твоя задача: вести эфир от имени группы. Ты не просто описываешь картинки, ты рассуждаешь о философии HIT VISUAL, о гиперреализме, о том как мы создаем визуальные тренды. 
Твой тон: харизматичный, уверенный, вдохновляющий. 
Используй фразы: 'наше сообщество', 'визуальная революция', 'стираем грани'. 
Каждое твое включение — это новая мысль для подкаста на 2-3 предложения.`;

function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const radio = new Audio(radioUrl);
    radio.crossOrigin = "anonymous";
    const src = audioCtx.createMediaElementSource(radio);
    musicGain = audioCtx.createGain();
    speechGain = audioCtx.createGain();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 32;
    dataArray = new Uint8Array(analyser.frequencyBinCount);

    src.connect(musicGain);
    musicGain.connect(analyser);
    speechGain.connect(analyser);
    analyser.connect(audioCtx.destination);

    musicGain.gain.value = 0.25;
    radio.play();

    const viz = document.getElementById('viz');
    for(let i=0; i<6; i++) {
        const b = document.createElement('div');
        b.className = 'v-bar';
        viz.appendChild(b);
    }
    updateViz();
}

function updateViz() {
    analyser.getByteFrequencyData(dataArray);
    const bars = document.getElementsByClassName('v-bar');
    for(let i=0; i<bars.length; i++) {
        bars[i].style.height = `${Math.max(2, (dataArray[i]/255)*25)}px`;
    }
    requestAnimationFrame(updateViz);
}

async function callAI(type, prompt) {
    const url = type === 'text' 
        ? `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`
        : `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
    
    const body = type === 'text'
        ? { contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: systemPrompt }] } }
        : { instances: { prompt }, parameters: { sampleCount: 1 } };

    const r = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
    const d = await r.json();
    return type === 'text' ? d.candidates[0].content.parts[0].text : `data:image/png;base64,${d.predictions[0].bytesBase64Encoded}`;
}

async function speak(text) {
    musicGain.gain.setTargetAtTime(0.06, audioCtx.currentTime, 0.4);
    try {
        const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                contents: [{ parts: [{ text }] }],
                generationConfig: { 
                    responseModalities: ["AUDIO"],
                    speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } }
                }
            })
        });
        const d = await r.json();
        const audio = new Audio(URL.createObjectURL(pcmToWav(d.candidates[0].content.parts[0].inlineData.data, 24000)));
        const s = audioCtx.createMediaElementSource(audio);
        s.connect(speechGain);
        return new Promise(res => {
            audio.onended = () => { musicGain.gain.setTargetAtTime(0.25, audioCtx.currentTime, 0.6); res(); };
            audio.play();
        });
    } catch(e) { musicGain.gain.setTargetAtTime(0.25, audioCtx.currentTime, 0.1); }
}

function pcmToWav(b, r) {
    const raw = atob(b); const pcm = new Int16Array(new Uint8Array([...raw].map(c => c.charCodeAt(0))).buffer);
    const buf = new ArrayBuffer(44 + pcm.length * 2); const v = new DataView(buf);
    const s = (o, t) => { for(let i=0; i<t.length; i++) v.setUint8(o+i, t.charCodeAt(i)); };
    s(0, 'RIFF'); v.setUint32(4, 32 + pcm.length * 2, true); s(8, 'WAVE'); s(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, r, true); v.setUint32(28, r * 2, true); v.setUint16(32, 2, true);
    v.setUint16(34, 16, true); s(36, 'data'); v.setUint32(40, pcm.length * 2, true);
    for(let i=0; i<pcm.length; i++) v.setInt16(44 + i * 2, pcm[i], true);
    return new Blob([buf], { type: 'audio/wav' });
}

async function startPodcast() {
    document.getElementById('start-overlay').style.display = 'none';
    initAudio();
    
    let currentImage = await callAI('image', "Hyper-realistic podcast studio background, cinematic neon lighting, HIT VISUAL aesthetic, futuristic digital art");
    
    while(true) {
        const stage = document.getElementById('art-display');
        stage.style.opacity = "0";
        setTimeout(() => { stage.src = currentImage; stage.style.opacity = "1"; }, 100);

        // Бот ведет подкаст
        const podcastSpeech = await callAI('text', "Начни новую мысль для подкаста HIT VISUAL. Порассуждай о визуальной революции и покажи нам новый хит.");
        const speechTask = speak(podcastSpeech);

        // Параллельно готовим СЛЕДУЮЩИЙ визуальный хит под его слова
        document.getElementById('buff-status').innerText = "STREAMING";
        const nextPrompt = await callAI('text', "Create a trend-setting hyper-realistic prompt for the next hit. English only.");
        const nextImageTask = callAI('image', nextPrompt + ", global trend, cinematic masterpiece");

        await speechTask;
        currentImage = await nextImageTask;
        document.getElementById('buff-status').innerText = "ONLINE";

        await new Promise(r => setTimeout(r, 4000));
    }
}
</script>
</body>
</html>
