<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>HIT VISUAL LUXURY</title>
    
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Montserrat:wght@400;600;700&display=swap');
        
        :root {
            --neon: #00e5ff;
            --pink: #ff007b;
            --bg: #ffffff;
            --text: #0f172a;
            --card: rgba(255, 255, 255, 0.98);
        }

        body.dark {
            --bg: #05070a;
            --text: #f8fafc;
            --card: rgba(13, 17, 23, 0.98);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .sync { font-family: 'Syncopate', sans-serif; }

        .glow-title {
            font-size: 10px;
            letter-spacing: 0.5em;
            background: linear-gradient(90deg, var(--neon), var(--pink), #7000ff, var(--neon));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow 4s linear infinite;
        }
        @keyframes rainbow { to { background-position: 200% center; } }

        .art-viewport {
            flex: 1;
            margin: 12px;
            background: #000;
            border-radius: 28px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }

        #main-img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .art-viewport.fs {
            position: fixed; inset: 0; margin: 0; z-index: 100; border-radius: 0;
        }
        .art-viewport.fs #main-img { object-fit: contain; }

        .ui-panel {
            background: var(--card);
            backdrop-filter: blur(20px);
            padding: 15px 15px calc(20px + env(safe-area-inset-bottom));
            border-radius: 32px 32px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
            z-index: 50;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .chip {
            padding: 8px 14px;
            background: rgba(128,128,128,0.1);
            border-radius: 14px;
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
            transition: 0.2s;
        }
        .chip.active { background: var(--neon); color: #000; }

        .btn {
            width: 100%; padding: 16px; border-radius: 18px;
            font-family: 'Syncopate', sans-serif; font-size: 10px;
            font-weight: 700; transition: 0.3s;
            text-transform: uppercase;
        }
        .btn-primary { 
            background: linear-gradient(135deg, var(--neon), #00a2ff); 
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
        }
        .btn-primary:disabled { opacity: 0.3; filter: grayscale(1); }
        
        .history-thumb {
            width: 55px; height: 55px; border-radius: 14px; flex-shrink: 0;
            object-fit: cover; border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.2s;
        }
        .history-thumb:active { transform: scale(0.9); }

        .modal-overlay {
            display: none;
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000;
            align-items: center; justify-content: center; padding: 20px;
            backdrop-filter: blur(15px);
        }

        .ad-placeholder {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px dashed rgba(0, 229, 255, 0.2);
            border-radius: 30px;
            padding: 40px 20px;
            width: 100%;
        }

        .progress-line {
            position: absolute; top: 0; left: 0; height: 3px;
            background: var(--neon); width: 0%; transition: width 0.4s ease;
            z-index: 20; box-shadow: 0 0 15px var(--neon);
        }

        input { font-size: 16px !important; color: #fff !important; }
        ::placeholder { color: rgba(255,255,255,0.3); }
    </style>
</head>
<body class="dark">

    <!-- СТИЛЬНЫЙ РЕКЛАМНЫЙ ПОСТЕР -->
    <div id="ad-modal" class="modal-overlay">
        <div class="max-w-sm w-full text-center">
            <div class="ad-placeholder mb-8 relative overflow-hidden group">
                <div class="absolute inset-0 bg-cyan-500/5 animate-pulse"></div>
                <div class="relative z-10">
                    <div class="text-4xl mb-4">🚀</div>
                    <h3 class="sync text-[12px] text-cyan-400 mb-2 tracking-[4px]">ВАША РЕКЛАМА</h3>
                    <p class="text-[9px] opacity-40 uppercase tracking-widest leading-loose">
                        Охват 100,000+ креаторов<br>
                        Интеграция в поток ИИ<br>
                        Связь: @tg_reklama
                    </p>
                </div>
            </div>
            
            <button id="ad-watch-btn" class="w-full py-5 bg-white text-black rounded-2xl font-bold sync text-[10px] tracking-[2px] disabled:opacity-30 transition-all">
                СМОТРЕТЬ РЕКЛАМУ (15 С)
            </button>
            <div id="ad-timer-text" class="mt-6 text-[9px] text-cyan-400/50 font-bold uppercase tracking-[3px] hidden">
                ЗАГРУЗКА БОНУСА: <span id="ad-sec">15</span> С
            </div>
        </div>
    </div>

    <div class="pt-10 pb-2 px-6 flex justify-between items-center">
        <div class="glow-title sync uppercase">HIT VISUAL LUXURY</div>
        <button onclick="toggleTheme()" id="theme-btn" class="text-xl">☀️</button>
    </div>

    <div class="art-viewport" id="viewport">
        <div id="p-line" class="progress-line"></div>
        <div id="loader" class="hidden absolute flex-col items-center z-30">
            <div class="w-10 h-10 border-2 border-cyan-500/10 border-t-cyan-400 rounded-full animate-spin"></div>
            <div class="mt-4 text-[7px] tracking-[5px] text-cyan-400/60 font-bold sync uppercase">Ai Rendering</div>
        </div>
        <div id="idle" class="sync opacity-20 text-[8px] tracking-[6px] text-white text-center px-10 uppercase">Create Your Vision</div>
        <img id="main-img" src="" alt="AI Art" onclick="toggleFS()" style="opacity:0">
    </div>

    <div class="ui-panel">
        <div class="flex justify-between items-center mb-5">
            <div id="limit-badge" class="chip !py-1 bg-cyan-500/5 text-cyan-400 border border-cyan-400/20">✨ 4 БЕСПЛАТНО</div>
            <div id="status-text" class="text-[7px] opacity-30 sync uppercase tracking-[2px]">Engine: Turbo v3</div>
        </div>

        <div class="flex gap-2 overflow-x-auto mb-5 no-scrollbar">
            <button onclick="setPrompt('cyber')" class="chip">КИБЕРПАНК</button>
            <button onclick="setPrompt('fantasy')" class="chip">ФЭНТЕЗИ</button>
            <button onclick="setPrompt('photo')" class="chip">ПОРТРЕТ</button>
            <button onclick="setPrompt('anime')" class="chip">АНИМЕ</button>
        </div>

        <div class="mb-5">
            <div class="bg-white/5 rounded-2xl p-4 border border-white/5">
                <input type="text" id="prompt-in" class="w-full bg-transparent outline-none text-[14px] mono" placeholder="Опишите словами ваш шедевр...">
            </div>
        </div>

        <div class="flex gap-2 mb-5">
            <button onclick="setRatio('1:1', this)" class="chip ratio-btn active">1:1</button>
            <button onclick="setRatio('9:16', this)" class="chip ratio-btn">9:16</button>
            <button onclick="setRatio('16:9', this)" class="chip ratio-btn">16:9</button>
        </div>

        <div class="history-scroll flex gap-3 overflow-x-auto mb-5 no-scrollbar" id="history-box"></div>

        <div class="grid grid-cols-2 gap-3">
            <button id="gen-btn" onclick="handleGenerate()" class="btn btn-primary">СОЗДАТЬ</button>
            <button id="save-btn" onclick="downloadArt()" class="btn bg-white/5 border border-white/10 text-white hidden">СКАЧАТЬ</button>
        </div>
    </div>

    <script>
        vkBridge.send("VKWebAppInit");

        const DAILY_LIMIT = 4;
        let genCount = parseInt(localStorage.getItem('hit_gen_count')) || 0;
        let lastDate = localStorage.getItem('hit_gen_date') || '';
        let isGenerating = false;
        let history = JSON.parse(localStorage.getItem('hit_history')) || [];
        let curW = 768, curH = 768;

        function checkLimits() {
            const today = new Date().toDateString();
            if(lastDate !== today) {
                genCount = 0;
                lastDate = today;
                localStorage.setItem('hit_gen_count', '0');
                localStorage.setItem('hit_gen_date', today);
            }
            updateBadge();
        }

        function updateBadge() {
            const rem = Math.max(0, DAILY_LIMIT - genCount);
            const badge = document.getElementById('limit-badge');
            if(rem > 0) {
                badge.innerText = `✨ ${rem} БЕСПЛАТНО`;
                badge.className = "chip !py-1 bg-cyan-500/5 text-cyan-400 border border-cyan-400/20";
            } else {
                badge.innerText = `🎬 СМОТРЕТЬ РЕКЛАМУ`;
                badge.className = "chip !py-1 bg-pink-500/10 text-pink-400 border border-pink-400/20";
            }
        }

        async function handleGenerate() {
            if(isGenerating) return;
            const val = document.getElementById('prompt-in').value;
            if(!val) return;

            checkLimits();
            if(genCount >= DAILY_LIMIT) {
                showAdModal();
            } else {
                runGen();
            }
        }

        async function runGen() {
            isGenerating = true;
            const loader = document.getElementById('loader');
            const idle = document.getElementById('idle');
            const genBtn = document.getElementById('gen-btn');
            const pLine = document.getElementById('p-line');
            const mainImg = document.getElementById('main-img');

            loader.classList.remove('hidden');
            idle.classList.add('hidden');
            genBtn.disabled = true;
            genBtn.innerText = "ГЕНЕРАЦИЯ...";
            pLine.style.width = "10%";

            // Пытаемся обойти перегрузку: меняем сид и добавляем случайные токены
            const seed = Math.floor(Math.random()*10000000);
            const userPrompt = document.getElementById('prompt-in').value;
            const finalPrompt = encodeURIComponent(userPrompt + ", highly detailed, masterpiece, 8k, luxury style");
            
            // ДВИЖОК ТУРБО (САМЫЙ БЫСТРЫЙ)
            const url = `https://image.pollinations.ai/prompt/${finalPrompt}?seed=${seed}&width=${curW}&height=${curH}&nologo=true&model=turbo&enhance=false`;

            let prg = 10;
            const prgItv = setInterval(() => {
                if(prg < 95) prg += (95 - prg) * 0.1;
                pLine.style.width = prg + "%";
            }, 300);

            const t = new Image();
            t.crossOrigin = "anonymous";
            
            const timeout = setTimeout(() => {
                if(isGenerating) {
                    clearInterval(prgItv);
                    // ЗАПАСНОЙ ВАРИАНТ ПРИ ТАЙМАУТЕ: меняем модель на базовую если турбо лежит
                    const fallbackUrl = `https://image.pollinations.ai/prompt/${finalPrompt}?seed=${seed+1}&width=${curW}&height=${curH}&nologo=true`;
                    t.src = fallbackUrl;
                }
            }, 12000); // Если турбо не ответил за 12 сек, пробуем базу

            t.onload = () => {
                clearTimeout(timeout);
                clearInterval(prgItv);
                pLine.style.width = "100%";
                
                mainImg.src = t.src;
                mainImg.style.opacity = "1";
                
                isGenerating = false;
                loader.classList.add('hidden');
                genBtn.disabled = false;
                genBtn.innerText = "СОЗДАТЬ";
                
                if(!history.includes(t.src)) {
                    history.unshift(t.src);
                    if(history.length > 10) history.pop();
                    localStorage.setItem('hit_history', JSON.stringify(history));
                    renderHistory();
                }

                genCount++;
                localStorage.setItem('hit_gen_count', genCount);
                updateBadge();
                
                setTimeout(() => pLine.style.width = "0%", 400);
                vkBridge.send("VKWebAppTapticNotificationOccurred", {"type": "success"});
            };

            t.onerror = () => {
                clearInterval(prgItv);
                pLine.style.width = "0%";
                alert("Сервер ИИ перегружен. Попробуйте через минуту.");
                resetUI();
            };

            t.src = url;
        }

        function resetUI() {
            isGenerating = false;
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('gen-btn').disabled = false;
            document.getElementById('gen-btn').innerText = "СОЗДАТЬ";
        }

        function setPrompt(t) {
            const ps = {
                cyber: "cyberpunk luxury car in neon city, futuristic",
                fantasy: "ethereal diamond dragon, crystal cave, glowing",
                photo: "stunning portrait of a queen, gold jewelry, studio light",
                anime: "luxury anime room, sunset view, lo-fi aesthetic"
            };
            document.getElementById('prompt-in').value = ps[t];
            vkBridge.send("VKWebAppTapticNotificationOccurred", {"type": "light"});
        }

        function setRatio(r, btn) {
            document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(r === '1:1') { curW=768; curH=768; viewport.style.aspectRatio = "1/1"; }
            if(r === '9:16') { curW=512; curH=896; viewport.style.aspectRatio = "9/16"; }
            if(r === '16:9') { curW=896; curH=512; viewport.style.aspectRatio = "16/9"; }
        }

        function renderHistory() {
            const box = document.getElementById('history-box');
            box.innerHTML = history.map(u => `
                <img src="${u}" class="history-thumb" onclick="loadFromHistory('${u}')">
            `).join('');
        }

        function loadFromHistory(url) {
            if(isGenerating) return;
            const mainImg = document.getElementById('main-img');
            mainImg.src = url;
            mainImg.style.opacity = "1";
            document.getElementById('idle').classList.add('hidden');
            document.getElementById('save-btn').classList.remove('hidden');
        }

        function showAdModal() {
            const modal = document.getElementById('ad-modal');
            const btn = document.getElementById('ad-watch-btn');
            const timer = document.getElementById('ad-timer-text');
            const sec = document.getElementById('ad-sec');
            
            modal.style.display = 'flex';
            btn.disabled = true;
            timer.classList.remove('hidden');
            
            let time = 15;
            sec.innerText = time;
            const itv = setInterval(() => {
                time--;
                sec.innerText = time;
                if(time <= 0) {
                    clearInterval(itv);
                    btn.disabled = false;
                    btn.innerText = "ПОЛУЧИТЬ ГЕНЕРАЦИЮ ✨";
                    btn.onclick = () => {
                        modal.style.display = 'none';
                        genCount = 0; 
                        updateBadge();
                        runGen();
                    };
                }
            }, 1000);
        }

        function toggleTheme() {
            document.body.classList.toggle('dark');
            const isD = document.body.classList.contains('dark');
            document.getElementById('theme-btn').innerText = isD ? '☀️' : '🌙';
        }

        function toggleFS() { 
            const img = document.getElementById('main-img');
            if(img.src && !isGenerating) viewport.classList.toggle('fs'); 
        }

        function downloadArt() {
            const img = document.getElementById('main-img');
            if(img.src && !isGenerating) {
                vkBridge.send("VKWebAppShowImages", { images: [img.src] });
            }
        }

        window.onload = () => {
            checkLimits();
            renderHistory();
        };
    </script>
</body>
</html>
